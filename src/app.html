    progressSlot.innerHTML = "";
    errSlot.innerHTML = planErrorHTML(stateName, text);
    if (stateName === "no_area") {
      const input = errSlot.querySelector("[data-error-area]");
      if (input) setTimeout(function(){ try { input.focus(); } catch (_) {} }, 30);
    }
  }
  function finishSubmit(){
    busy = false;
    if (isCurrent(token)) {
      planBtn.disabled = false;
      planBtn.textContent = "Make a plan";
    }
  }
  async function submitPlan(){
    if (busy) return;
    const when = whenInput ? whenInput.value.trim() : "";
    const area = areaInput ? areaInput.value.trim() : "";
    const budgetRaw = budgetInput ? budgetInput.value.trim() : "";
    const text = freeInput ? freeInput.value.trim() : "";
    busy = true;
    errSlot.innerHTML = "";
    progressSlot.innerHTML = logPanelHTML();
    planBtn.disabled = true;
    planBtn.textContent = "Making a plan";
    const body = { mood: mood, period: period };
    if (when) body.when = when;
    if (area) body.area = area;
    const budgetN = numberValue(budgetRaw);
    if (budgetRaw && budgetN !== null) body.budget = budgetN;
    if (text) body.text = text;
    try {
      const res = await fetch("/api/plan", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
        signal: ac.signal,
      });
      if (!res.ok || !res.body) {
        let msg = "";
        try { const d = await res.json(); msg = d && d.error; } catch (_) {}
        throw new Error(msg || ("Request failed (" + res.status + ")"));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      const linesEl = progressSlot.querySelector("[data-log-lines]");
      let buffer = "";
      let done = false;
      while (!done) {
        const step = await reader.read();
        done = !!step.done;
        buffer += decoder.decode(step.value || new Uint8Array(0), { stream: !done });
        const parts = buffer.split(/\r?\n/);
        buffer = parts.pop();
        for (let i = 0; i < parts.length; i++) {
          const raw = parts[i].trim();
          if (!raw) continue;
          let msg = null;
          try { msg = JSON.parse(raw); } catch (_) { continue; }
          if (!msg || typeof msg !== "object") continue;
          if (msg.type === "log" && msg.text) {
            appendLog(linesEl, msg.text);
          } else if (msg.type === "plan" && msg.plan && msg.plan.id) {
            cachePlan(msg.plan);
            finishSubmit();
            go("#/plan/" + encodeURIComponent(String(msg.plan.id)));
            return;
          } else if (msg.type === "error") {
            showPlanError(msg.state, msg.text);
            finishSubmit();
            return;
          }
        }
      }
      showPlanError(null, "The plan stream ended before a plan arrived.");
    } catch (e) {
      if (!isAbort(e) && isCurrent(token)) showPlanError(null, (e && e.message) || "That did not work. Try again.");
    } finally {
      finishSubmit();
    }
  }

  async function loadSaved(){
    if (!savedSlot) return;
    savedSlot.innerHTML = '<div class="skeleton sk-line w40"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w80"></div>';
    let data;
    try {
      data = await api("/api/plans", { signal: ac.signal });
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      savedSlot.innerHTML = '<div class="compact-error">Your saved plans did not load. <button class="text-btn" type="button" data-retry="saved">Try again</button></div>';
      return;
    }
    if (!isCurrent(token)) return;
    const plans = Array.isArray(data && data.plans) ? data.plans : [];
    if (!plans.length) { savedSlot.innerHTML = ""; return; }
    savedSlot.innerHTML =
      '<div class="saved-title"><h3 class="section-label">Saved plans</h3><span class="label num">' + plans.length + "</span></div>" +
      '<div class="saved-list">' + plans.map(savedPlanHTML).join("") + "</div>";
  }
  function savedPlanHTML(plan){
    const stops = Array.isArray(plan.stops) ? plan.stops : [];
    const names = stops.map(function(s){ return s && s.name; }).filter(Boolean).join(" · ");
    const when = Number(plan.saved_at || plan.created_at);
    return '<button class="saved-plan" type="button" data-nav="' + attr("#/plan/" + encodeURIComponent(String(plan.id))) + '">' +
      '<span class="saved-plan-main">' +
        '<span class="saved-plan-head">' + esc(plan.header || names || "Untitled plan") + "</span>" +
        (names ? '<span class="saved-plan-stops">' + esc(names) + "</span>" : "") +
        (Number.isFinite(when) ? '<span class="saved-plan-date">' + esc(formatDate(when)) + "</span>" : "") +
      "</span>" +
      '<span class="saved-plan-chev">' + icons.chevron + "</span>" +
    "</button>";
  }

  on(view, "click", function(e){
    const perBtn = e.target.closest("[data-period]");
    if (perBtn) {
      period = perBtn.getAttribute("data-period");
      Array.prototype.forEach.call(view.querySelectorAll("[data-period]"), function(b){ b.setAttribute("aria-pressed", b === perBtn ? "true" : "false"); });
      return;
    }
    const moodBtn = e.target.closest("[data-mood]");
    if (moodBtn) {
      mood = moodBtn.getAttribute("data-mood");
      Array.prototype.forEach.call(view.querySelectorAll("[data-mood]"), function(b){
        b.setAttribute("aria-pressed", b === moodBtn ? "true" : "false");
      });
      return;
    }
    if (e.target.closest("[data-error-area-go]")) {
      const input = errSlot.querySelector("[data-error-area]");
      const value = input ? input.value.trim() : "";
      if (!value) { if (input) input.focus(); return; }
      if (areaInput) areaInput.value = value;
      api("/api/me", { method: "PATCH", body: { area: value } })
        .then(function(d){ if (d && d.user) state.user = d.user; })
        .catch(function(){});
      submitPlan();
    }
  });
  if (form) form.addEventListener("submit", function(e){ e.preventDefault(); submitPlan(); });
  bindRetries({ plan: submitPlan, saved: loadSaved });
  loadSaved();
}

/* ---------------------------------------------------------------------------
   Plan result (screen 9)
   --------------------------------------------------------------------------- */
function renderPlanResult(id){
  const token = beginView();
  setShell({ title: "Plan", tabs: true, active: "plan" });
  view.className = "view";
  const ac = abortable();
  const planId = String(id == null ? "" : id);
  let currentPlan = null;
  let busyAction = false;

  const cached = getCachedPlan(planId);
  if (cached) paint(cached);
  else {
    view.innerHTML = '<div class="skeleton sk-detail"></div><div class="skeleton sk-detail"></div>';
    loadRemote();
  }

  async function loadRemote(){
    try {
      const data = await api("/api/plan/" + encodeURIComponent(planId), { signal: ac.signal });
      const plan = data && (data.plan || data);
      if (!plan || !plan.id) throw new Error("no plan");
      cachePlan(plan);
      if (isCurrent(token)) paint(plan);
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      if (e.status === 404) {
        view.innerHTML = '<div class="missing-plan">' +
          emptyBlock("This plan is not there.", "It may have been deleted, or the link is old.", '<button class="btn btn-sm" type="button" data-nav="#/plan">Plan an afternoon</button>') +
        "</div>";
      } else {
        view.innerHTML = errorBlock("That plan did not load. Check your connection, then try again.", "plan");
        bindRetries({ plan: loadRemote });
      }
    }
  }

  function stopEvidenceHTML(kind, label, text, isRead){
    if (!text) return "";
    return '<div class="ev-row">' +
      '<span class="ev-label ' + kind + '">' + esc(label) + "</span>" +
      '<p class="ev-text' + (isRead ? " read" : "") + '">' + esc(text) + "</p>" +
    "</div>";
  }
  function stopHTML(stop, i){
    const mapUrl = safeHttpUrl(stop && stop.map_url);
    const opsText = (stop && stop.ops) || "Hours not checked";
    const where = planStopWhere(stop);
    return '<section class="stop">' +
      '<div class="stop-head">' +
        '<span class="stop-index num">' + (i + 1) + "</span>" +
        '<div class="stop-main">' +
          '<h3 class="stop-name">' + esc((stop && stop.name) || "Somewhere") + "</h3>" +
          (where ? '<p class="stop-where">' + esc(where) + "</p>" : "") +
        "</div>" +
      "</div>" +
      '<div class="evidence">' +
        stopEvidenceHTML("notes", "From your notes", stop && stop.from_notes, false) +
        stopEvidenceHTML("qloo", "From Qloo", stop && stop.from_qloo, false) +
        stopEvidenceHTML("read", "Sparkling's read", stop && stop.read, true) +
      "</div>" +
      '<div class="stop-ops">' +
        "<span>" + esc(opsText) + "</span>" +
        (mapUrl ? '<span class="sep" aria-hidden="true">&middot;</span><a href="' + attr(mapUrl) + '" target="_blank" rel="noopener">Open map</a>' : "") +
        '<span class="sep" aria-hidden="true">&middot;</span><button type="button" data-swap="' + i + '"' + (busyAction ? " disabled" : "") + ">Swap</button>" +
      "</div>" +
    "</section>";
  }
  function paint(plan){
    if (!isCurrent(token)) return;
    currentPlan = plan;
    const stops = Array.isArray(plan.stops) ? plan.stops : [];
    const saved = !!plan.saved;
    view.innerHTML =
      '<h2 class="plan-header">' + esc(plan.header || "Your plan") + "</h2>" +
      '<p class="plan-meta">' + esc(stops.length + " " + plural(stops.length, "stop", "stops") + (saved ? " · Saved" : "")) + "</p>" +
      (plan.notice ? '<p class="plan-notice" role="note">' + esc(plan.notice) + "</p>" : "") +
      stops.map(stopHTML).join("") +
      '<div class="plan-actions">' +
        '<button class="btn" type="button" data-action="shorten"' + (stops.length <= 1 || busyAction ? " disabled" : "") + ">Shorten</button>" +
        '<button class="btn" type="button" data-action="budget"' + (busyAction ? " disabled" : "") + ">Lower budget</button>" +
        '<button class="btn btn-primary" type="button" data-action="save"' + (saved || busyAction ? " disabled" : "") + ">" + (saved ? "Saved" : "Save") + "</button>" +
      "</div>" +
      (Array.isArray(plan.log) && plan.log.length ?
        '<details class="how"><summary>How this was made</summary><ul class="how-list">' +
          plan.log.map(function(l){ return "<li>" + esc(l) + "</li>"; }).join("") +
        "</ul>" + receiptHTML(plan.receipt) + "</details>" : "");
  }
  function receiptHTML(r){
    if (!r) return "";
    const seeds = Array.isArray(r.seeds) ? r.seeds : [];
    const qs = Array.isArray(r.queries) ? r.queries : [];
    return '<div class="receipt"><p class="receipt-title">Receipt</p>' +
      '<p class="receipt-line"><span>Seeds sent to Qloo</span> ' + seeds.map(function(x){ return esc(x.name) + ' <code>' + esc(String(x.qloo_id || "").slice(0, 8)) + '</code>'; }).join(", ") + "</p>" +
      qs.map(function(q){ return '<p class="receipt-line"><code>GET ' + esc(q.endpoint) + "</code> type place · tag " + esc(q["filter.tags"] || "none") + " · near " + esc(q["filter.location.query"] || "") + " · " + esc(String(q.returned)) + " back</p>"; }).join("") +
      '<p class="receipt-line muted">' + esc(r.sent_to_qloo || "") + "</p></div>";
  }
  function setActionBusy(b){
    Array.prototype.forEach.call(view.querySelectorAll("[data-action], [data-swap]"), function(el){
      el.disabled = b ||
        (el.getAttribute("data-action") === "shorten" && currentPlan && Array.isArray(currentPlan.stops) && currentPlan.stops.length <= 1) ||
        (el.getAttribute("data-action") === "save" && currentPlan && currentPlan.saved);
    });
  }
  async function runPlanAction(action, extraBody){
    if (busyAction) return;
    busyAction = true;
    setActionBusy(true);
    try {
      const data = await api("/api/plan/" + encodeURIComponent(planId) + "/" + action, { method: "POST", body: extraBody || {}, signal: ac.signal });
      let fresh = data && data.plan;
      if (action === "save" && !fresh && currentPlan) {
        fresh = currentPlan;
        fresh.saved = true;
      }
      if (fresh && fresh.id) {
        if (action === "save") fresh.saved = true;
        cachePlan(fresh);
        paint(fresh);
      }
      if (action === "save") {
        const stops = currentPlan && Array.isArray(currentPlan.stops) ? currentPlan.stops : [];
        if (stops.length && stops[0] && stops[0].name) {
          writeDidYouGo({ plan_id: fresh && fresh.id ? fresh.id : planId, place: String(stops[0].name) });
        }
      }
      if (data && data.notice) toast(data.notice);
      else if (action === "save") toast("Plan saved.");
      else if (action === "swap") {
        const idx = (extraBody && extraBody.index) || 0;
        toast("Swapped stop " + (idx + 1) + ".");
        const el = view.querySelectorAll(".stop")[idx];
        if (el) { el.classList.add("just-swapped"); setTimeout(function(){ el.classList.remove("just-swapped"); }, 1600); }
      } else if (action === "shorten") toast("Shortened.");
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      toast((e && e.message) || "That did not work. Try again.");
    } finally {
      busyAction = false;
      if (isCurrent(token)) setActionBusy(false);
    }
  }
  function openBudgetSheet(){
    const current = numberValue(state.user && state.user.budget) || 40;
    const sheet = openSheet({
      title: "Lower the budget",
      body:
        '<form data-budget-form>' +
          '<div class="sheet-field"><label for="budgetCap">New budget cap</label>' +
          '<input id="budgetCap" type="number" inputmode="numeric" min="1" step="1" value="' + attr(current) + '" data-autofocus></div>' +
          '<p class="inline-error" data-budget-error role="alert" hidden></p>' +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Re-rank stops</button></div>' +
        "</form>",
    });
    const formEl = sheet.querySelector("[data-budget-form]");
    const input = sheet.querySelector("#budgetCap");
    const err = sheet.querySelector("[data-budget-error]");
    formEl.addEventListener("submit", async function(e){
      e.preventDefault();
      const n = numberValue(input.value);
      if (!n || n < 1) {
        err.textContent = "A number above zero is all it needs.";
        err.hidden = false;
        if (input) input.focus();
        return;
      }
      err.hidden = true;
      const submitBtn = formEl.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const data = await api("/api/plan/" + encodeURIComponent(planId) + "/budget", { method: "POST", body: { budget: n } });
        closeModal();
        const fresh = data && data.plan;
        if (fresh && fresh.id) { cachePlan(fresh); paint(fresh); }
        if (data && data.notice) toast(data.notice);
      } catch (e2) {
        err.textContent = (e2 && e2.message) || "That did not work. Try again.";
        err.hidden = false;
        submitBtn.disabled = false;
      }
    });
  }

  on(view, "click", function(e){
    const swapBtn = e.target.closest("[data-swap]");
    if (swapBtn) {
      runPlanAction("swap", { index: Number(swapBtn.getAttribute("data-swap")) || 0 });
      return;
    }
    const actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    const action = actionBtn.getAttribute("data-action");
    if (action === "shorten") runPlanAction("shorten");
    else if (action === "save") runPlanAction("save");
    else if (action === "budget") openBudgetSheet();
  });
}

/* ---------------------------------------------------------------------------
   Settings (screen 10)
   --------------------------------------------------------------------------- */
function renderSettings(){
  beginView();
  setShell({ title: "Settings", back: state.lastMain || "#/notes", tabs: false });
  view.className = "view no-tabs";

  const u = state.user || {};
  const isSample = !!u.sample;

  view.innerHTML =
    '<section class="settings-section">' +
      '<h2 class="settings-title">Planning</h2>' +
      '<p class="settings-hint">Prefills the plan form.</p>' +
      '<form data-prefs novalidate>' +
        '<div class="field"><label for="setArea">Planning area</label>' +
          '<input id="setArea" data-pref-area value="' + attr(u.area || "") + '" placeholder="Neighbourhood" autocomplete="off"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="setBudget">Default budget</label>' +
            '<input id="setBudget" data-pref-budget inputmode="numeric" value="' + attr(u.budget == null ? "" : u.budget) + '" placeholder="40" autocomplete="off"></div>' +
          '<div class="field"><label for="setWhen">Default time</label>' +
            '<input id="setWhen" data-pref-when value="' + attr(u.when || "") + '" placeholder="Saturday afternoon" autocomplete="off"></div>' +
        "</div>" +
        '<div class="save-row">' +
          '<button class="btn btn-primary btn-sm" type="submit">Save changes</button>' +
          '<p class="feedback" data-pref-feedback role="status"></p>' +
        "</div>" +
      "</form>" +
    "</section>" +
    '<section class="settings-section">' +
      '<h2 class="settings-title">Bring some history</h2>' +
      importBlockHTML("Start from your Letterboxd export. Titles with dates become footprints; anything less certain waits in the inbox.") +
    "</section>" +
    '<section class="settings-section">' +
      '<h2 class="settings-title">What Sparkling sends to Qloo</h2>' +
      '<p class="settings-hint inline">Your notes and photos never go to Qloo. When Sparkling recognises a mention it sends only those few words to Qloo search. When you plan, it sends the IDs of a few cards and your area.</p>' +
    "</section>" +
    '<section class="settings-section">' +
      '<h2 class="settings-title">Export everything</h2>' +
      '<p class="settings-hint">Your notes, your photos, your cards. One file, yours to keep.</p>' +
      '<div class="export-row"><a class="btn btn-sm" href="/api/export">Export everything</a></div>' +
    "</section>" +
    '<section class="settings-section danger-section">' +
      '<h2 class="settings-title">Delete everything</h2>' +
      '<p class="danger-copy">This removes every note, photo, card and plan from Sparkling. It cannot be undone.</p>' +
      '<div class="settings-actions"><button class="btn btn-danger btn-sm" type="button" data-delete-all>Delete everything</button></div>' +
    "</section>" +
    (isSample ?
      '<section class="settings-section danger-section">' +
        '<h2 class="settings-title">Sample notebook</h2>' +
        '<p class="sample-line">You are looking around a made-up notebook. Leaving removes it from this device.</p>' +
        '<div class="settings-actions"><button class="btn btn-danger btn-sm" type="button" data-leave-sample>Leave the sample</button></div>' +
      "</section>" : "");

  wireImport(view.querySelector("[data-import-block]"), {});

  const prefsForm = view.querySelector("[data-prefs]");
  if (prefsForm) {
    prefsForm.addEventListener("submit", async function(e){
      e.preventDefault();
      const area = view.querySelector("[data-pref-area]");
      const budget = view.querySelector("[data-pref-budget]");
      const when = view.querySelector("[data-pref-when]");
      const feedback = view.querySelector("[data-pref-feedback]");
      const btn = prefsForm.querySelector('button[type="submit"]');
      const valueOf = function(el){ return el ? el.value.trim() : ""; };
      const body = {};
      const areaV = valueOf(area);
      const whenV = valueOf(when);
      const budgetV = valueOf(budget);
      if (areaV) body.area = areaV;
      if (whenV) body.when = whenV;
      if (budgetV) {
        const n = numberValue(budgetV);
        if (n === null || n < 1) {
          feedback.textContent = "Budget needs a number above zero.";
          feedback.className = "feedback bad";
          if (budget) budget.focus();
          return;
        }
        body.budget = n;
      }
      if (feedback) { feedback.textContent = ""; feedback.className = "feedback"; }
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = "Saving";
      try {
        const data = await api("/api/me", { method: "PATCH", body: body });
        if (data && data.user) state.user = data.user;
        if (feedback) { feedback.textContent = "Saved."; feedback.className = "feedback ok"; }
      } catch (err) {
        if (feedback) { feedback.textContent = (err && err.message) || "That did not save. Try again."; feedback.className = "feedback bad"; }
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    });
  }

  function clearLocalNotebook(){
    clearPlanStorage();
    clearDidYouGo();
    clearDraft();
  }
  function openDeleteEverything(){
    confirmSheet({
      title: "Delete everything?",
      copy: "Every note, photo, card and plan will be removed from Sparkling. It cannot be undone.",
      extra: sheetField("Type DELETE to continue", "deleteConfirm", "text", "", "DELETE", true),
      danger: true,
      confirmLabel: "Delete everything",
      busyLabel: "Deleting",
      onConfirm: async function(){
        const input = modal.querySelector("#deleteConfirm");
        if (!input || input.value.trim() !== "DELETE") throw new Error("Type DELETE to continue.");
        await api("/api/delete", { method: "POST", body: { confirm: "DELETE" } });
        clearLocalNotebook();
        location.reload();
      },
    });
  }
  function openLeaveSample(){
    confirmSheet({
      title: "Leave the sample?",
      copy: "The made-up notebook will be removed from this device. You can start your own whenever you like.",
      danger: true,
      confirmLabel: "Leave the sample",
      busyLabel: "Leaving",
      onConfirm: async function(){
        await api("/api/delete", { method: "POST", body: { confirm: "DELETE" } });
        clearLocalNotebook();
        state.user = null;
        state.inboxCount = 0;
        history.replaceState(null, "", "#/onboarding");
        renderOnboarding();
      },
    });
  }

  on(view, "click", function(e){
    if (e.target.closest("[data-delete-all]")) { openDeleteEverything(); return; }
    if (e.target.closest("[data-leave-sample]")) { openLeaveSample(); return; }
  });
}


boot();

</script>
</body>
</html>
