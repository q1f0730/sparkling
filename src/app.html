/* First paint for Threads: three skeleton rows right away, and the last response of each period kept in
   memory so a revisit paints instantly while the fresh response replaces it in the background. */
const THREADS_CACHE = Object.create(null);
function threadsSkeletonHTML(){
  return '<div class="skeleton sk-card tall"></div>' +
    '<div class="skeleton sk-card"></div>' +
    '<div class="skeleton sk-card"></div>';
}

function renderThreads(){
  const token = beginView();
  setShell({ title: "Threads", tabs: true, active: "cards" });
  const ac = abortable();
  let period = "all";
  let current = [];
  let lastData = null;

  view.innerHTML =
    '<div class="cards-head">' +
      '<div class="segmented" role="group" aria-label="Cards view">' +
        '<button class="seg-btn" type="button" aria-pressed="false" data-nav="#/cards">Wall</button>' +
        '<button class="seg-btn" type="button" aria-pressed="true">Threads</button>' +
        '<button class="seg-btn" type="button" aria-pressed="false" data-nav="#/letter">Letter</button>' +
      "</div>" +
      '<p class="sub">Patterns across your cards.</p>' +
      '<div class="mood-row period-row" role="group" aria-label="Which you">' +
        [["all","All of you"],["now","Recent you"],["then","Earlier you"]].map(function(x){return '<button class="mood" type="button" data-tperiod="'+x[0]+'" aria-pressed="'+(x[0]===period?"true":"false")+'">'+x[1]+'</button>';}).join("") +
      "</div>" +
      '<p class="period-note" data-period-note></p>' +
    "</div>" +
    '<div data-threads>' + threadsSkeletonHTML() + "</div>";

  const threadsEl = view.querySelector("[data-threads]");
  const noteEl = view.querySelector("[data-period-note]");
  let loadSeq = 0;

  function shiftPill(shift){
    if (!shift) return "";
    const cls = shift === "New in recent notes" ? "new" : shift === "Fading from recent notes" ? "fading" : "steady";
    return '<span class="shift-pill ' + cls + '">' + esc(shift) + "</span>";
  }
  function threadNames(thread){
    const q = Array.isArray(thread.qloo_tags) ? thread.qloo_tags.map(function(x){ return x && x.name; }).filter(Boolean) : [];
    const parts = String(thread.tag || "").split(" · ").filter(Boolean);
    return (parts.length > 1 ? parts : (q.length ? q.slice(0, 1) : parts)).slice(0, 3).map(tagPretty);
  }
  /* "Sensitive, vulnerability and intimacy" (B): middle word italic clay; zh keeps names joined by · */
  function threadTitleHTML(thread){
    const n = threadNames(thread);
    if (n.length < 2) return esc(tagZh(n[0] || thread.tag || ""));
    if (LANG === "zh") return n.map(function(x, i){ x = tagZh(x); return i === 1 ? "<em>" + esc(x) + "</em>" : esc(x); }).join(" · ");
    const low = function(x){ return /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x; };
    if (n.length === 2) return esc(n[0]) + " and <em>" + esc(low(n[1])) + "</em>";
    return esc(n[0]) + ", <em>" + esc(low(n[1])) + "</em> and " + esc(low(n[2]));
  }
  function threadHTML(thread, i){
    const cards = Array.isArray(thread.cards) ? thread.cards : [];
    cards.forEach(function(c){ if (c && c.name) (window.SP_NAMES = window.SP_NAMES || {})[c.name] = 1; });
    /* Chips must name only the cards that really carry the tag. When no card does, the thread is a
       fallback over the most-kept cards and its label has to say so. */
    const carried = cards.filter(function(c){ return c && c.carries_tag === true; });
    const allCarryFalse = cards.length > 0 && cards.every(function(c){ return c && c.carries_tag === false; });
    const fallback = !carried.length && thread.carried_by_cards === false && allCarryFalse;
    const shown = carried.length ? carried : cards;
    const evidenceLabel = fallback ? (LANG === "zh" ? t("Across your most-kept cards") : "Across your most-kept cards") : "From your notes";
    const chips = shown.map(function(card){
      const count = Number(card.footprints) || 0;
      const label = card.name + (count ? ", " + count + " " + plural(count, "footprint", "footprints") : "");
      return '<button class="thread-chip type-' + attr(card.type || "other") + '" type="button" data-nav="#/cards/' + encodeURIComponent(card.id) + '" aria-label="' + attr(label) + '">' +
        '<span translate="no">' + esc(card.name) + "</span>" + (count ? '<span class="count">' + count + "</span>" : "") +
      "</button>";
    }).join("");
    return '<article class="thread">' +
      '<div class="thread-top"><span class="from-qloo">From the catalogue</span>' + shiftPill(thread.shift) + "</div>" +
      '<h2 class="thread-title" translate="no">' + threadTitleHTML(thread) + "</h2>" +
      '<span class="thread-evidence-label">' + evidenceLabel + "</span>" +
      '<div class="thread-chips">' + chips + "</div>" +
      (thread.read ? '<p class="thread-read"><span class="label">Sparkling’s read</span>' + esc(thread.read) + "</p>" : "") +
      '<button class="why-btn" type="button" data-why="' + i + '">Why this thread?</button>' +
    "</article>";
  }
  function whyHTML(t){
    const tags = Array.isArray(t.qloo_tags) ? t.qloo_tags : [];
    const cards = Array.isArray(t.cards) ? t.cards : [];
    cards.forEach(function(c){ if (c && c.name) (window.SP_NAMES = window.SP_NAMES || {})[c.name] = 1; });
    const words = Array.isArray(t.your_words) ? t.your_words : (t.your_words ? [t.your_words] : []);
    const rc = t.receipt || {};
    const typeOf = {}; cards.forEach(function(c){ typeOf[c.name] = c.type || "other"; });
    const listedAll = [];
    tags.forEach(function(q){ (Array.isArray(q.listed_on) ? q.listed_on : []).forEach(function(n){ if (listedAll.indexOf(n) < 0) listedAll.push(n); }); });
    const top = tags.slice(0, 3), rest = tags.slice(3);
    const qlooCard = '<section class="bcard"><div class="blabel"><i></i><span>Catalogue noticed</span><small>' + (listedAll.length ? "on your cards" : "for your cards together") + "</small></div>" +
      (top.length ? '<div class="seeds">' + top.map(function(q, i){ var sat = function(x){ return x && (Number(x.affinity) >= 0.995 || (x.affinity == null && Number(x.score) >= 0.995)); }; return seedHTML(sat(q) ? Object.assign({}, q, { affinity: null, score: null }) : q, "s" + (i + 1)); }).join("") + "</div>" : '<p class="why-line">No tags came back.</p>') +
      (rest.length ? '<div class="seeds-h">Close behind</div><div class="seeds">' + rest.map(function(q){ return seedHTML(q, "sm"); }).join("") + "</div>" : "") +
      (listedAll.length ? '<p class="why-line">Listed on <span translate="no">' + esc(listedAll.join(", ")) + "</span></p>" : '<p class="why-line">None of these sit on a single card of yours. Qloo returned them for these cards taken together.</p>') +
    "</section>";
    const wordRows = words.length ? words.map(function(w){
      return '<div class="why-q"><p translate="no">“' + esc(w.text) + '”</p><div class="m">' +
        (w.card ? '<span class="ent type-' + attr(typeOf[w.card] || "other") + '" translate="no">' + esc(w.card) + "</span>" : "") +
        "<span>" + esc(formatDate(w.at)) + "</span></div></div>";
    }).join("") : '<p class="why-line">No note quotes yet for these cards.</p>';
    const wordsCard = '<section class="bcard"><div class="blabel"><i class="clay"></i><span>In your words</span><small>' + esc(words.length + " " + plural(words.length, "note", "notes")) + "</small></div>" + wordRows + "</section>";
    const shown = cards.slice(0, 4), more = cards.slice(4);
    const feed = shown.map(function(c){
      const n = Number(c.footprints) || 0;
      return '<button type="button" class="why-f type-' + attr(c.type || "other") + '" data-close-nav="#/cards/' + encodeURIComponent(c.id) + '">' +
        '<b translate="no">' + esc(c.name) + "</b><span>" + esc(n + " " + plural(n, "note", "notes")) + "</span></button>";
    }).join("");
    const cardsCard = '<section class="bcard"><div class="blabel"><i class="butter"></i><span>Cards it grew from</span><small>' + esc(cards.length + " " + plural(cards.length, "card", "cards")) + "</small></div>" +
      '<div class="why-feed">' + feed + "</div>" +
      (more.length ? '<p class="why-line"><span>Also</span> <span translate="no">' + esc(more.map(function(c){ return c.name; }).join(", ")) + "</span></p>" : "") +
    "</section>";
    const basedOn = String((lastData && lastData.shift && lastData.shift.based_on) || "");
    const readCard = '<section class="bcard bread"><div class="blabel"><span>Sparkling’s read</span></div>' +
      (t.read ? "<p>" + esc(t.read) + "</p>" : "") +
      (t.shift && basedOn ? "<p>" + esc(t.shift) + ": comparing the catalogue tags on your " + esc(basedOn) + " most recent cards against the " + esc(basedOn) + " before them.</p>" : "") +
    "</section>";
    const ents = Array.isArray(rc["signal.interests.entities"]) ? rc["signal.interests.entities"] : [];
    const receipt =
      '<div class="why-receipt" translate="no">' +
        "<div>GET " + esc(rc.endpoint || "/v2/insights") + " · filter.type=" + esc(rc["filter.type"] || "urn:tag") + "</div>" +
        "<div>signal.interests.entities = " + ents.length + "</div>" +
        ents.map(function(e){ return '<div class="ind">' + esc(String(e.qloo_id || e).slice(0, 8)) + "…" + (e.name ? ' <span class="why-faint">' + esc(e.name) + "</span>" : "") + "</div>"; }).join("") +
        (Array.isArray(rc.tag_ids) && rc.tag_ids.length ? rc.tag_ids.map(function(id, i){ return '<div class="' + (i ? "ind" : "") + '">' + (i ? "" : "→ ") + esc(id) + "</div>"; }).join("") : "") +
      "</div>";
    return '<span tabindex="-1" data-autofocus class="why-focus"></span>' +
      '<h3 class="why-h1" translate="no">' + threadTitleHTML(t) + "</h3>" +
      '<p class="why-intro">What it rests on: Qloo’s data and your own notes, shown as they are. Sparkling’s own read sits apart.</p>' +
      qlooCard + wordsCard + cardsCard + readCard +
      '<details class="why-details"><summary>Receipt</summary>' + receipt + "</details>";
  }
  function openWhy(i){
    const t = current[i];
    if (!t) return;
    openSheet({ title: "Why this thread?", cls: "why-sheet", body: whyHTML(t), onMount: function(m){
      m.querySelectorAll("[data-close-nav]").forEach(function(btn){
        btn.addEventListener("click", function(){ const h = btn.getAttribute("data-close-nav"); closeModal(); location.hash = h; });
      });
    }});
  }
  function emptyHTML(reason){
    return emptyBlock(
      "Threads take a little time.",
      reason || "Threads show up once a few things keep coming back.",
      '<button class="btn btn-sm" type="button" data-nav="#/cards">Look at your cards</button>'
    );
  }
  function setNote(data){
    if (!noteEl) return;
    const sh = data && data.shift;
    if (period === "all" || !sh || !sh.based_on) { noteEl.textContent = period === "all" ? t("Everything you have kept.") : ""; return; }
    const names = period === "now" ? sh.now_cards : sh.then_cards;
    noteEl.textContent = (period === "now" ? "Your " + sh.based_on + " most recent cards: " : "The " + sh.based_on + " cards before your recent ones: ") + (names || []).join(", ") + ".";
  }
  function paint(data){
    lastData = data;
    setNote(data);
    const threads = Array.isArray(data && data.threads) ? data.threads : [];
    current = threads;
    if (!threads.length) {
      threadsEl.innerHTML = emptyHTML(data && data.reason);
      return;
    }
    threadsEl.innerHTML = threads.map(threadHTML).join("");
  }
  async function load(){
    const seq = ++loadSeq;
    const cached = THREADS_CACHE[period];
    if (cached) paint(cached);
    else if (threadsEl) threadsEl.innerHTML = threadsSkeletonHTML();
    try {
      const data = await api("/api/threads" + (period === "all" ? "" : "?period=" + period), { signal: ac.signal });
      if (!isCurrent(token) || seq !== loadSeq) return;
      THREADS_CACHE[period] = data;
      paint(data);
    } catch (e) {
      if (!isCurrent(token) || seq !== loadSeq || isAbort(e)) return;
      if (cached) return;
      threadsEl.innerHTML = errorBlock("Your threads did not load. Check your connection, then try again.", "threads");
    }
  }
  on(view, "click", function(e){
    const pb = e.target.closest("[data-tperiod]");
    if (pb) {
      period = pb.getAttribute("data-tperiod");
      view.querySelectorAll("[data-tperiod]").forEach(function(b){ b.setAttribute("aria-pressed", b === pb ? "true" : "false"); });
      load();
      return;
    }
    const wb = e.target.closest("[data-why]");
    if (wb) openWhy(Number(wb.getAttribute("data-why")));
  });

  bindRetries({ threads: load });
  load();
}

/* ---------------------------------------------------------------------------
   Inbox
   --------------------------------------------------------------------------- */
function renderInbox(){
  const token = beginView();
  setShell({ title: "Inbox", back: state.lastMain || "#/notes", tabs: false });
  const ac = abortable();

  view.innerHTML =
    '<header class="r7-mast r7-inbox-mast">' +
      '<p class="r7-eyebrow"><span>Unsure</span><span class="r7-sep" aria-hidden="true"></span><span class="inbox-count" data-inbox-count></span></p>' +
      '<h1 class="r7-display"><span>Did I get</span> <em>this right?</em></h1>' +
      '<p class="r7-deck">Sparkling was not sure about these. Keep the guess, pick another, or set it aside.</p>' +
      '<div class="r7-progress" aria-hidden="true"><i data-inbox-progress></i></div>' +
    '</header>' +
    '<div data-inbox-body><div class="skeleton sk-inbox"></div></div>';

  const countEl = view.querySelector("[data-inbox-count]");
  const bodyEl = view.querySelector("[data-inbox-body]");
  let items = [];
  let total = 0;
  let resolved = 0;
  let busy = false;

  function sentenceHTML(sentence, mention){
    const whole = String(sentence || "");
    const needle = String(mention || "");
    if (!needle) return esc(whole);
    let at = whole.indexOf(needle);
    if (at < 0) at = whole.toLowerCase().indexOf(needle.toLowerCase());
    if (at < 0) return esc(whole);
    return esc(whole.slice(0, at)) + "<mark>" + esc(whole.slice(at, at + needle.length)) + "</mark>" + esc(whole.slice(at + needle.length));
  }
  function emptyHTML(){
    return '<div class="done-wrap">' +
      '<p class="done-title">Nothing to look at.</p>' +
      '<p class="done-copy">' + esc(t("Sparkling was sure about everything lately.")) + '</p>' +
      '<div class="inbox-how" style="max-width:300px;margin:4px auto 22px;padding:14px 16px;border:1px solid var(--b-line);border-radius:18px;background:var(--b-card);text-align:left">' +
        '<p class="inbox-how-lead" style="margin:0 0 6px;font:500 14px/20px var(--sans);color:var(--b-ink)">' + esc(t("Sparkling never guesses silently.")) + '</p>' +
        '<p class="inbox-how-copy" style="margin:0;font:400 13px/19px var(--sans);color:var(--b-ink2)">' + esc(t("When a name could mean two things, like Margaret (a singer and a 2011 film), it waits here for you to pick.")) + '</p>' +
      '</div>' +
      '<button class="btn btn-sm" type="button" data-nav="#/notes">Back to your notes</button>' +
    "</div>";
  }
  function doneHTML(){
    return '<div class="done-wrap">' +
      '<p class="done-title">That’s everything.</p>' +
      '<p class="done-copy">Anything less certain will wait here when it needs you.</p>' +
      '<button class="btn btn-sm" type="button" data-nav="#/notes">Back to your notes</button>' +
    "</div>";
  }
  function itemHTML(item){
    const seen = {};
    const guesses = (Array.isArray(item.guesses) ? item.guesses : []).filter(function(g){ const k = String(g.name||'').toLowerCase()+'|'+guessMeta(g); if (seen[k]) return false; seen[k] = 1; return true; });
    const best = guesses[0] || null;
    const alternatives = guesses.slice(1, 3);
    const bestHTML = best
      ? '<div class="guess-best">' +
          '<span class="guess-name">' + esc(best.name || "Unnamed") + "</span>" +
          '<span class="guess-meta">' + esc(guessMeta(best)) + "</span>" +
          (item.reason ? '<span class="guess-meta guess-reason" style="display:block;margin-top:4px">' + reasonHtml(item.reason) + "</span>" : "") +
        "</div>"
      : '<p class="compact-empty">No close match this time.</p>';
    const altHTML = alternatives.length
      ? '<p class="or-label">Or</p>' + alternatives.map(function(guess){
          return '<button class="alt-guess" type="button" data-inbox-pick data-qloo-id="' + attr(guess.qloo_id) + '">' +
            '<span class="alt-name">' + esc(guess.name || "Unnamed") + "</span>" +
            '<span class="alt-meta">' + esc(guessMeta(guess)) + "</span>" +
          "</button>";
        }).join("")
      : "";
    return '<div class="inbox-stack" data-left="' + items.length + '"><article class="inbox-card">' +
      '<p class="sentence">' + sentenceHTML(item.sentence, item.mention) + "</p>" +
      '<p class="didyoumean">Did you mean</p>' +
      bestHTML +
      altHTML +
      '<p class="inline-error" data-inbox-error role="alert" hidden></p>' +
      '<button class="pk-else" type="button" data-inbox-else><span aria-hidden="true">/</span>' + esc(t("Something else")) + "</button>" +
      '<div class="inbox-actions">' +
        '<button class="btn btn-primary" type="button" data-inbox-yes' + (best ? "" : " disabled") + ">Yes, that</button>" +
        '<button class="btn btn-outline" type="button" data-inbox-no>Not a thing</button>' +
        '<button class="text-btn" type="button" data-inbox-keep>' + esc(t("Keep as my own thing")) + '</button>' +
      "</div>" +
      (items.length > 1 ? '<div class="keep-all"><button class="text-btn" type="button" data-inbox-keepall>Keep all guesses</button></div>' : "") +
    "</article></div>";
  }
  function upNextHTML(){
    const rest = items.slice(1, 5);
    if (!rest.length) return "";
    return '<section class="r7-upnext"><h3 class="r7-section"><span>Up next</span><span class="r7-count num">' + esc(String(items.length - 1)) + '</span></h3>' +
      '<ol class="r7-upnext-list">' + rest.map(function(item, i){
        const g = (Array.isArray(item.guesses) ? item.guesses : [])[0];
        return '<li><span class="r7-upnext-n num">' + String(resolved + i + 2).padStart(2, "0") + '</span>' +
          '<span class="r7-upnext-body"><span class="r7-upnext-q" translate="no">' + sentenceHTML(item.sentence, item.mention) + '</span>' +
          (g ? '<span class="r7-upnext-g"><span>Guess</span> <b translate="no">' + esc(g.name || "Unnamed") + '</b></span>' : "") + '</span></li>';
      }).join("") + (items.length > 5 ? '<li class="r7-upnext-more"><span>' + esc("+" + (items.length - 5) + " more") + '</span></li>' : "") +
      '</ol></section>';
  }
  function syncBadge(){
    state.inboxCount = items.length;
    updateInboxBadge();
  }
  function paint(){
    if (!bodyEl) return;
    if (!items.length) {
      if (countEl) countEl.textContent = "";
      const mast = view.querySelector(".r7-inbox-mast"); if (mast) mast.hidden = true;
      bodyEl.innerHTML = resolved > 0 ? doneHTML() : emptyHTML();
      syncBadge();
      return;
    }
    if (countEl) countEl.textContent = Math.min(resolved + 1, total) + " of " + total;
    const bar = view.querySelector("[data-inbox-progress]");
    if (bar) bar.style.width = Math.round(100 * resolved / Math.max(1, total)) + "%";
    bodyEl.innerHTML = itemHTML(items[0]) + '<p class="fx-swipe-hint">' + esc(t("Swipe right to keep · left if it is not a thing")) + "</p>" + upNextHTML();
    syncBadge();
  }
  function disableCurrent(){
    const cardEl = bodyEl.querySelector(".inbox-card");
    if (!cardEl) return;
    Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function(button){ button.disabled = true; });
  }
  function showActionError(message){
    const err = bodyEl.querySelector("[data-inbox-error]");
    if (err) {
      err.textContent = message || t("That did not go through. Try again.");
      err.hidden = false;
    }
    const cardEl = bodyEl.querySelector(".inbox-card");
    if (cardEl) Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function(button){ button.disabled = false; });
  }

  async function act(action, qlooId, picked){
    if (busy || !items.length) return;
    const item = items[0];
    busy = true;
    disableCurrent();
    try {
      const body = { action: action };
      if (action === "accept" && qlooId) body.qloo_id = qlooId;
      if (action === "accept" && picked) { body.pick = true; body.type = picked.type; }
      const data = await api("/api/inbox/" + encodeURIComponent(item.id), { method: "POST", body: body });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      items = items.filter(function(x){ return String(x.id) !== String(item.id); });
      resolved += 1;
      busy = false;
      paint();
      refreshMe();
      toast(action === "reject" ? "Set aside." : "Kept.", {
        actionLabel: "Undo",
        duration: 10000,
        onAction: function(){ undo(item.id); },
      });
    } catch (e) {
      if (!isCurrent(token)) return;
      busy = false;
      showActionError(e && e.message === "not found"
        ? "That item is no longer here. It may have been handled already."
        : t("That did not go through. Try again."));
    }
  }

  async function keepAll(){
    if (busy || !items.length) return;
    busy = true;
    disableCurrent();
    try {
      const data = await api("/api/inbox/accept_all", { method: "POST" });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      const count = items.length;
      items = [];
      resolved += count;
      busy = false;
      paint();
      refreshMe();
      toast("All guesses kept.");
    } catch (e) {
      if (!isCurrent(token)) return;
      busy = false;
      showActionError(t("That did not go through. Try again."));
    }
  }

  async function undo(itemId){
    try {
      const data = await api("/api/inbox/" + encodeURIComponent(itemId), { method: "POST", body: { action: "undo" } });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      await load({ quiet: true });
      toast("Back in the pile.");
    } catch (e) {
      if (!isCurrent(token)) return;
      toast("That could not be undone.");
      load({ quiet: true });
    }
  }

  async function load(opts){
    const quiet = !!(opts && opts.quiet);
    if (!quiet) {
      if (countEl) countEl.textContent = "";
      if (bodyEl) bodyEl.innerHTML = '<div class="skeleton sk-inbox"></div>';
    }
    try {
      const data = await api("/api/inbox", { signal: ac.signal });
      if (!isCurrent(token)) return;
      items = Array.isArray(data && data.items) ? data.items : [];
      total = items.length;
      resolved = 0;
      paint();
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      if (quiet) {
        toast("The inbox did not refresh.");
        return;
      }
      if (bodyEl) {
        bodyEl.innerHTML = errorBlock("The inbox did not load. Check your connection, then try again.", "inbox");
      }
    }
  }

  on(view, "click", function(e){
    const pick = e.target.closest("[data-inbox-pick]");
    if (pick) { act("accept", pick.getAttribute("data-qloo-id")); return; }
    if (e.target.closest("[data-inbox-yes]")) {
      const best = items[0] && Array.isArray(items[0].guesses) ? items[0].guesses[0] : null;
      if (best) act("accept", best.qloo_id);
      return;
    }
    if (e.target.closest("[data-inbox-no]")) { act("reject"); return; }
    if (e.target.closest("[data-inbox-keep]")) { act("keep"); return; }
    if (e.target.closest("[data-inbox-else]")) {
      const it = items[0]; if (!it || !window.Picker) return;
      Picker.open({ mode: "sheet", title: "Which one did you mean?", query: it.mention || "", onPick: function(r){ act("accept", r.qloo_id, r); } });
      return;
    }
    if (e.target.closest("[data-inbox-keepall]")) { keepAll(); }
  });
  bindRetries({ inbox: load });
  load();
}

      '</div><span class="mode-hint" data-mode-hint' + (mode === "in" && prefill ? "" : " hidden") + '>Picked from what you wrote</span></div>' +
      '<div class="plan-sentence">' +
        "<span>On</span>" +
        '<input class="inline-input when-input" data-when aria-label="' + attr(t("When")) + '" placeholder="' + attr(t("Saturday afternoon")) + '" value="' + attr(whenVal) + '">' +
        '<span class="out-only" data-out-only' + (mode === "in" ? " hidden" : "") + '>' +

        "<span>around</span>" +
        '<input class="inline-input area-input" data-area aria-label="Area" placeholder="Greenpoint" value="' + attr(user.area || "") + '">' +

  async function submitPlan(){
    if (busy) return;

    const area = areaInput ? areaInput.value.trim() : "";
    const budgetRaw = budgetInput ? budgetInput.value.trim() : "";
    const text = freeInput ? freeInput.value.trim() : "";
    busy = true;
    errSlot.innerHTML = "";
    progressSlot.innerHTML = logPanelHTML();
    planBtn.disabled = true;
    planBtn.textContent = t("Making a plan");
    const body = { mood: mood, period: period, mode: mode };
    if (lens) body.audience = lens;
    if (LANG === "zh") body.lang = "zh";
    if (when) body.when = when;
    if (area && mode !== "in") body.area = area;
    const budgetN = numberValue(budgetRaw);
    if (mode !== "in" && budgetRaw && budgetN !== null) body.budget = budgetN;
    if (text) body.text = text;
    body.lang = LANG === "zh" ? "zh" : "en";
    try {
      const res = await fetch("/api/plan", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
        signal: ac.signal,
      });
      if (!res.ok || !res.body) {
        let msg = "";
        try { const d = await res.json(); msg = d && d.error; } catch (_) {}
        throw new Error(msg || ("Request failed (" + res.status + ")"));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      const linesEl = progressSlot.querySelector("[data-log-lines]");
      let buffer = "";
      let done = false;
      while (!done) {
        const step = await reader.read();
        done = !!step.done;
        buffer += decoder.decode(step.value || new Uint8Array(0), { stream: !done });
        const parts = buffer.split(/\r?\n/);
        buffer = parts.pop();
        for (let i = 0; i < parts.length; i++) {
          const raw = parts[i].trim();
          if (!raw) continue;
          let msg = null;
          try { msg = JSON.parse(raw); } catch (_) { continue; }
          if (!msg || typeof msg !== "object") continue;
          if (msg.type === "log" && msg.text) {
            appendLog(linesEl, msg.text);
          } else if (msg.type === "plan" && msg.plan && msg.plan.id) {
            cachePlan(msg.plan);
            finishSubmit();
            go("#/plan/" + encodeURIComponent(String(msg.plan.id)));
            return;
          } else if (msg.type === "error") {
            showPlanError(msg.state, msg.text);
            finishSubmit();
            return;
          }
        }
      }
      showPlanError(null, t("The plan stream ended before a plan arrived."));
    } catch (e) {
      if (!isAbort(e) && isCurrent(token)) showPlanError(null, (e && e.message) || t("That did not work. Try again."));
    } finally {
      finishSubmit();
    }
  }

  /* stayin: result for a night in — 3 picks with poster, year, why-it-fits, and the cards behind each */

  function paintIn(plan){

        '<button class="btn btn-primary" type="button" data-action="save"' + (saved || busyAction ? " disabled" : "") + ">" + (saved ? "Saved" : "Save") + "</button>" +
      "</div>" +
      (Array.isArray(plan.log) && plan.log.length ?
        '<details class="how"><summary>How this was made</summary>' + traceHeadHTML(plan) + '<ol class="trace">' +
          (Array.isArray(plan.trace) && plan.trace.length === plan.log.length ? plan.trace : plan.log.map(function(l){ return { text: l }; })).map(function(l, i){ return '<li><span class="trace-n num">' + (i + 1) + '</span><span class="trace-t">' + esc(l.text) + '</span>' + (l.ms != null ? '<span class="trace-ms num">+' + (l.ms / 1000).toFixed(1) + 's</span>' : "") + "</li>"; }).join("") +
        "</ol>" + receiptHTML(plan.receipt) + "</details>" : "");
    if (plan && plan.id) prefetchPlain(plan.id);

  function paint(plan){
    if (!isCurrent(token)) return;
    currentPlan = plan;
    if (plan && plan.mode === "in") { view.classList.add("plan-in-view"); paintIn(plan); return; }
    view.classList.remove("plan-in-view");
    const stops = Array.isArray(plan.stops) ? plan.stops : [];
    const saved = !!plan.saved;
    view.innerHTML =
      (function(){ var hp=String(plan.header||"Your plan").split(" · "); var t=hp.length>2?hp.slice(0,2):[hp[0]]; var ch=hp.length>2?hp.slice(2):[];
        var walk=stops.reduce(function(a,st){ var m=String(st&&st.distance||"").match(/(\d+)\s*min/); return a+(m?Number(m[1]):0); },0);
        var first=stops[0]&&stops[0].arrive, last=stops.length&&stops[stops.length-1].leave;
        return '<header class="r7-plan-mast">' +
          '<p class="r7-eyebrow">' + t.map(function(x, k){ return (k ? '<span class="r7-sep" aria-hidden="true"></span>' : "") + '<span>' + esc(x) + '</span>'; }).join("") + (saved ? '<span class="r7-saved">Saved</span>' : "") + '</p>' +
          '<h2 class="plan-header r7-display"><span>Go</span> <em>live it.</em></h2>' +
          (ch.length?'<div class="plan-chips">'+ch.map(function(c){return '<span class="plan-chip">'+esc(LANG === "zh" ? trZh(c) : c)+"</span>";}).join("")+"</div>":"") +
          '<dl class="r7-stats">' +
            '<div><dt>' + esc(plural(stops.length, "stop", "stops")) + '</dt><dd class="num">' + stops.length + '</dd></div>' +
            '<div><dt>window</dt><dd class="num r7-small">' + esc(first && last ? String(first).replace(/ ?[AP]M$/,"") + "\u2013" + last : "\u2014") + '</dd></div>' +
            '<div><dt>walking</dt><dd class="num">' + (walk ? walk + '<small>' + (LANG === "zh" ? "分钟" : "min") + '</small>' : "\u2014") + '</dd></div>' +
          '</dl>' + '<button class="plain-cta" type="button" data-plain="1"><span>Same notes, no Qloo</span><span class="plain-cta-go">Compare &rarr;</span></button>' + '</header>'; })() +
      (Array.isArray(plan.left_out) && plan.left_out.length ? '<p class="plan-notice" role="note">' + esc((LANG === "zh" ? "已排除（你标了“不适合我”）：" : "Left out, you said not for me: ") + plan.left_out.join(", ")) + "</p>" : "") +
      diffHTML(plan) +
      (plan.notice ? '<p class="plan-notice" role="note">' + esc(plan.notice) + "</p>" : "") +
      routeMapHTML(stops) + sideHTML(stops, plan) +
      stops.map(function(st, i){ return stopHTML(st, i, stops); }).join("") +
      '<div class="plan-actions">' +
        '<button class="btn" type="button" data-action="shorten"' + (stops.length <= 1 || busyAction ? " disabled" : "") + ">Shorten</button>" +
        '<button class="btn" type="button" data-action="budget"' + (busyAction ? " disabled" : "") + ">Lower budget</button>" +
        '<button class="btn" type="button" data-plain="1">' + esc(t("Plain LLM")) + "</button>" +
        '<button class="btn btn-primary" type="button" data-action="save"' + (saved || busyAction ? " disabled" : "") + ">" + (saved ? "Saved" : "Save") + "</button>" +
      "</div>" +
      (Array.isArray(plan.log) && plan.log.length ?
        '<details class="how"><summary>How this was made</summary>' + traceHeadHTML(plan) + '<ol class="trace">' +
          (Array.isArray(plan.trace) && plan.trace.length === plan.log.length ? plan.trace : plan.log.map(function(l){ return { text: l }; })).map(function(l, i){ return '<li><span class="trace-n num">' + (i + 1) + '</span><span class="trace-t">' + esc(l.text) + '</span>' + (l.ms != null ? '<span class="trace-ms num">+' + (l.ms / 1000).toFixed(1) + 's</span>' : "") + "</li>"; }).join("") +
        "</ol>" + receiptHTML(plan.receipt) + "</details>" : "");
    if (plan && plan.id) prefetchPlain(plan.id);
  }
  function traceHeadHTML(plan){
    const q = plan.receipt && Array.isArray(plan.receipt.queries) ? plan.receipt.queries.length : 0;
    const last = plan.trace && plan.trace.length ? plan.trace[plan.trace.length - 1].ms : null;
    const bits = [plan.log.length + " steps", q ? q + " Qloo calls" : "", last != null ? (last / 1000).toFixed(0) + " s" : ""].filter(Boolean);
    return '<p class="trace-head num">' + esc(bits.join(" · ")) + "</p>";
  }
  function receiptHTML(r){
    if (!r) return "";
    const seeds = Array.isArray(r.seeds) ? r.seeds : [];
    const qs = Array.isArray(r.queries) ? r.queries : [];
    const zh = LANG === "zh";
    const SENT_ZH = {
      "Card IDs only. No note text, no location.": "只发卡片 ID，不发笔记原文，也不发位置。",
      "Card IDs and your area. No note text.": "只发卡片 ID 和你的区域，不发笔记原文。"
    };
    const PROV_ZH = { "cached": "缓存", "live": "实时", "live + cached": "实时 + 缓存" };
    const sent = String(r.sent_to_qloo || "");
    const sentOut = zh ? (SENT_ZH[sent] || t(sent)) : sent;
    let prov = "";
    if (r.provenance) {
      const live = r.provenance.live | 0, cached = r.provenance.cached | 0;
      const label = String(r.provenance.label || "");
      prov = zh
        ? " · " + esc(PROV_ZH[label] || t(label)) + "（实时 " + live + " 次，缓存 " + cached + " 次）"
        : " · " + esc(label) + " (" + live + " live, " + cached + " cached)";
    }
    return '<div class="receipt"><p class="receipt-title">' + (zh ? "回执" : "Receipt") + '</p>' +

      qs.map(function(q){ return '<p class="receipt-line"><code>GET ' + esc(q.endpoint) + "</code>" + (q["filter.location.query"] ? (LANG === "zh" ? " 类型 place · 标签 " : " type place · tag ") + esc(q["filter.tags"] || (LANG === "zh" ? "无" : "none")) + (LANG === "zh" ? " · 位置 " : " · near ") + esc(q["filter.location.query"] || "") : " " + esc(String(q["filter.type"] || "").split(":").pop())) + " · " + esc(String(q.returned)) + (LANG === "zh" ? " 个返回" : " back") + "</p>"; }).join("") +

  function setActionBusy(b){
    Array.prototype.forEach.call(view.querySelectorAll("[data-action], [data-swap]"), function(el){
      el.disabled = b ||
        (el.getAttribute("data-action") === "shorten" && currentPlan && Array.isArray(currentPlan.stops) && currentPlan.stops.length <= 1) ||
        (el.getAttribute("data-action") === "save" && currentPlan && currentPlan.saved);
    });
  }
  async function runPlanAction(action, extraBody){
    if (busyAction) return;
    busyAction = true;
    setActionBusy(true);
    try {
      const data = await api("/api/plan/" + encodeURIComponent(planId) + "/" + action, { method: "POST", body: extraBody || {}, signal: ac.signal });
      let fresh = data && data.plan;
      if (action === "save" && !fresh && currentPlan) {
        fresh = currentPlan;
        fresh.saved = true;
      }
      if (fresh && fresh.id) {
        if (action === "save") fresh.saved = true;
        cachePlan(fresh);
        paint(fresh);
      }
      if (action === "save") {
        const stops = currentPlan && Array.isArray(currentPlan.stops) ? currentPlan.stops : [];
        if (stops.length && stops[0] && stops[0].name) {
          writeDidYouGo({ plan_id: fresh && fresh.id ? fresh.id : planId, place: String(stops[0].name) });
        }
      }
      if (data && data.notice) toast(data.notice);
      else if (action === "save") toast("Plan saved.");
      else if (action === "swap") {
        const idx = (extraBody && extraBody.index) || 0;
        toast("Swapped stop " + (idx + 1) + ".");
        const el = view.querySelectorAll(".stop")[idx];
        if (el) { el.classList.add("just-swapped"); setTimeout(function(){ el.classList.remove("just-swapped"); }, 1600); }
      } else if (action === "shorten") toast("Shortened.");
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      toast((e && e.message) || t("That did not work. Try again."));
    } finally {
      busyAction = false;
      if (isCurrent(token)) setActionBusy(false);
    }
  }
  function openBudgetSheet(){
    const current = numberValue(state.user && state.user.budget) || 40;
    const sheet = openSheet({
      title: "Lower the budget",
      body:
        '<form data-budget-form>' +
          '<div class="sheet-field"><label for="budgetCap">New budget cap</label>' +
          '<input id="budgetCap" type="number" inputmode="numeric" min="1" step="1" value="' + attr(current) + '" data-autofocus></div>' +
          '<p class="inline-error" data-budget-error role="alert" hidden></p>' +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Re-rank stops</button></div>' +
        "</form>",
    });
    const formEl = sheet.querySelector("[data-budget-form]");
    const input = sheet.querySelector("#budgetCap");
    const err = sheet.querySelector("[data-budget-error]");
    formEl.addEventListener("submit", async function(e){
      e.preventDefault();
      const n = numberValue(input.value);
      if (!n || n < 1) {
        err.textContent = "A number above zero is all it needs.";
        err.hidden = false;
        if (input) input.focus();
        return;
      }
      err.hidden = true;
      const submitBtn = formEl.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const data = await api("/api/plan/" + encodeURIComponent(planId) + "/budget", { method: "POST", body: { budget: n } });
        closeModal();
        const fresh = data && data.plan;
        if (fresh && fresh.id) { cachePlan(fresh); paint(fresh); }
        if (data && data.notice) toast(data.notice);
      } catch (e2) {
        err.textContent = (e2 && e2.message) || t("That did not work. Try again.");
        err.hidden = false;
        submitBtn.disabled = false;
      }
    });
  }

  on(view, "click", function(e){
    if (e.target.closest("[data-plain]")) { openPlain(); return; }
    const wsBtn = e.target.closest("[data-why-stop]");
    if (wsBtn) { openWhyStop(Number(wsBtn.getAttribute("data-why-stop")) || 0); return; }
    const wpBtn = e.target.closest("[data-why-pick]");
    if (wpBtn) { openWhyStop(Number(wpBtn.getAttribute("data-why-pick")) || 0, true); return; }
    const swapBtn = e.target.closest("[data-swap]");
    if (swapBtn) {
      runPlanAction("swap", { index: Number(swapBtn.getAttribute("data-swap")) || 0 });
      return;
    }
    const actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    const action = actionBtn.getAttribute("data-action");
    if (action === "shorten") runPlanAction("shorten");
    else if (action === "save") runPlanAction("save");
    else if (action === "budget") openBudgetSheet();
  });
}

/* iOS-like edge swipe back for settings sub-pages */
function wireSwipeBack(parent){
  let sx = null, sy = 0, dx = 0;
  on(view, "touchstart", function(e){
    const tch = e.touches[0];
    if (tch.clientX - frame.getBoundingClientRect().left > 28) { sx = null; return; }
    sx = tch.clientX; sy = tch.clientY; dx = 0;
  }, { passive: true });
  on(view, "touchmove", function(e){
    if (sx === null) return;
    const tch = e.touches[0];
    dx = tch.clientX - sx;
    if (Math.abs(tch.clientY - sy) > Math.abs(dx)) { sx = null; view.style.transform = ""; return; }
    if (dx > 0) view.style.transform = "translateX(" + Math.min(dx, 300) + "px)";
  }, { passive: true });
  on(view, "touchend", function(){
    if (sx === null) return;
    view.style.transform = "";
    if (dx > 90) go(parent);
    sx = null;
  });
}

<script id="fx">
/* ==== r6 motion layer (original implementation; look inspired by RewampUI, rewampui.com) ====

(function(){

    if (s[0] === "#") return [1, 3, 5].map(function(i){ return parseInt(s.substr(i, 2), 16) / 255; });
    const m = s.match(/[\d.]+/g) || [0, 0, 0]; return [m[0] / 255, m[1] / 255, m[2] / 255];
  }
  function palette(){
    return { paper: rgb("--b-paper"), sage: rgb("--b-sage"), sageInk: rgb("--b-sage-ink"), clay: rgb("--b-clay"), clayInk: rgb("--b-clay-ink"), butter: rgb("--b-butter"), butterInk: rgb("--b-butter-ink"), card: rgb("--b-card") };
  }

  const COMMON = "precision mediump float;uniform vec2 uR;uniform float uT;uniform vec2 uP;uniform float uE;uniform float uK;" +
    "uniform vec3 cPaper,cSage,cSageI,cClay,cClayI,cButter,cButterI,cCard;" +

    "vec3 c=cPaper;" +
    "c=mix(c,sage,.9*bl(w,vec2(a*(.18+.1*sin(t*.21)),.78+.09*cos(t*.17)),.55));" +

  function boot(){

  // fly-deck:js — note -> card. A card that is NEW to the deck lifts off its chip and lands on the Cards nav:
  // the desktop rail item (wide or collapsed) when the rail is shown, else the mobile tab bar. Measure what is actually
  // on screen: the mobile #tabs is display:none on desktop, so it measures 0x0 at (0,0), which used to send the flight
  // to the top-left logo. A repeat mention (footprint appended to an existing card) gets no flight and no nav reaction.
  function deckTarget(){
    var c = [document.querySelector('.pf-rail .pf-nav [data-pf-go="cards"]'), document.querySelector('#tabs:not([hidden]) .tab[data-tab="cards"]')];

  }
  Fx.deckTarget = deckTarget;
  function land(){ /* fly-deck:waapi */
    var t = deckTarget(); if (!t) return; /* re-measured: the rail re-renders its buttons on route/lang changes */

    try { rm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) {}
    if (el.__fxLand) { el.__fxLand.forEach(function(a){ try { a.cancel(); } catch (_) {} }); }
    var old = el.querySelector(".fx-land-dot"); if (old) old.remove();
    /* resolve the warm palette (butter fill, faint butter-ink ring, soft sage halo) to concrete colours for WAAPI */
    var pr = document.createElement("i");
    pr.style.cssText = "position:absolute;visibility:hidden;background-color:color-mix(in srgb,var(--b-butter) 88%,var(--b-card));color:color-mix(in srgb,var(--b-butter-ink) 18%,transparent);border:0 solid color-mix(in srgb,var(--b-sage-ink) 50%,transparent)";
    el.appendChild(pr); var cs = getComputedStyle(pr), fill = cs.backgroundColor, ring = cs.color, halo = cs.borderTopColor; pr.remove();
    el.classList.add("fx-land");
    var dot = document.createElement("i"); dot.className = "fx-land-dot"; dot.setAttribute("aria-hidden", "true"); dot.textContent = "+1";
    var br = el.getBoundingClientRect(), ir = ic ? ic.getBoundingClientRect() : br;
    dot.style.left = Math.round(ir.right - br.left - 1) + "px"; dot.style.top = Math.round(ir.top - br.top - 12) + "px";
    el.appendChild(dot);
    var anims = [];
    /* only a middle keyframe: start and end fall back to the item's own fill/shadow (the active item keeps its card) */
    anims.push(el.animate([{ offset: .22, backgroundColor: fill, boxShadow: "0 0 0 3px " + ring + ",0 8px 22px -8px " + halo }], { duration: rm ? 900 : 1200, easing: "ease-out" }));
    anims.push(dot.animate(rm
      ? [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .7 }, { opacity: 0 }]
      : [{ opacity: 0, transform: "translateY(4px) scale(.6)" }, { opacity: 1, transform: "none", offset: .15 }, { opacity: 1, transform: "none", offset: .7 }, { opacity: 0, transform: "translateY(-6px)" }],
      { duration: rm ? 1100 : 1400, easing: "ease-out", fill: "forwards" }));
    if (ic && !rm) anims.push(ic.animate([{ transform: "scale(1)" }, { transform: "scale(1.22) rotate(-4deg)", offset: .35 }, { transform: "scale(.96)", offset: .7 }, { transform: "none" }], { duration: 550, easing: "cubic-bezier(.3,1.5,.5,1)" }));
    el.__fxLand = anims;
    anims[1].onfinish = function(){ if (dot.isConnected) dot.remove(); if (el.__fxLand === anims) { el.classList.remove("fx-land"); el.__fxLand = null; } };

  function waitAnims(el, cap){

  }
  Fx.grow = function(noteEl){
    if (!noteEl) return;
    var rm = false; try { rm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) {}
    var nid = noteEl.getAttribute("data-note-id");
    var fresh = [], seen = {};
    Array.prototype.forEach.call(noteEl.querySelectorAll(".mention.matched.draw[data-card]"), function(m){
      var id = m.getAttribute("data-card");
      if (seen[id]) { if (m.hasAttribute("data-fresh")) seen[id].fresh = true; return; }
      seen[id] = { id: id, m: m, fresh: m.hasAttribute("data-fresh") };
      fresh.push(seen[id]);
    });
    fresh = fresh.filter(function(x){ return x.fresh; });
    if (!fresh.length || !deckTarget()) return;
    function liveNote(){ return noteEl.isConnected ? noteEl : (nid && document.querySelector('#view [data-note-id="' + nid.replace(/"/g, "") + '"]')) || noteEl; }
    function chipOf(id){ var n = liveNote(); return n.querySelector('.grown-chip[data-card="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]'); }

      return;

      var chip = chipOf(x.id);

      var t = deckTarget(); if (!src || !t) return;

      var img = (chip && chip.querySelector("img") && chip.querySelector("img").currentSrc) || x.m.getAttribute("data-img");

      var an = el.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) scale(1)", opacity: 1, easing: "cubic-bezier(.2,.7,.3,1)" },
        { transform: "translate(" + x0 + "px," + (y0 - 14) + "px) scale(1.12) rotate(-4deg)", opacity: 1, offset: .16, easing: "cubic-bezier(.45,0,.55,1)" },
        { transform: "translate(" + mx + "px," + my + "px) scale(.85) rotate(-10deg)", opacity: 1, offset: .58, easing: "cubic-bezier(.5,0,.75,.4)" },
        { transform: "translate(" + x1 + "px," + y1 + "px) scale(.34) rotate(-2deg)", opacity: .95, offset: .9 },
        { transform: "translate(" + x1 + "px," + y1 + "px) scale(.22)", opacity: 0 }
      ], { duration: 820, easing: "linear", fill: "forwards" });

      an.onfinish = end; setTimeout(end, 1400);
    }
    function esc1(v){ return String(v).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  };
})();
