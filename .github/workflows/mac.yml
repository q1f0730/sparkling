name: macOS (unsigned .app / .dmg)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["platforms/mac/**", ".github/workflows/mac.yml"]
jobs:
  dmg:
    runs-on: macos-15
    defaults: { run: { working-directory: platforms/mac } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --mac dmg zip --universal --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sparkling-macos-unsigned
          path: |
            platforms/mac/dist/*.dmg
            platforms/mac/dist/*.zip
          if-no-files-found: error
