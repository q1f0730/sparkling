<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sparkling: a notebook that turns what you love into Qloo taste cards, threads, and a weekend plan you can go live.">
<meta name="theme-color" content="#f7f6f2">
<title>Sparkling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f7f6f2; --sheet:#ffffff; --surface:#f1efe9; --border:#e6e3db; --rule:#efede7;
  --text:#1f201d; --muted:#6b6a65; --faint:#a3a19a; --accent:#1b6e66; --accent-ink:#ffffff;
  --negative:#b42318; --dot:#d93f2b;
  --film:#3b5bdb; --music:#7048e8; --book:#2f9e44; --place:#e8590c; --other:#868e96;
  --radius-card:22px; --radius-control:999px; --gap:16px; --pad:20px; --control-h:38px;
  --serif:"Instrument Serif",Georgia,serif; --sans:"Instrument Sans",Inter,system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--rule);color:var(--text);
  font-family:var(--sans);font-size:14px;font-weight:400;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
input,textarea{min-width:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
img{max-width:100%}
h1,h2,h3,h4,p,figure,blockquote{margin:0}
ul,ol{margin:0}
svg{flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

:where(button,a,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
:where(input,textarea):focus-visible{outline-offset:1px}

/* ---- frame and shell ---- */
.frame{
  width:100%;max-width:480px;min-height:100dvh;margin:0 auto;position:relative;
  background:var(--ground);border-left:1px solid var(--border);border-right:1px solid var(--border);
}
@media (max-width:520px){.frame{border-left:0;border-right:0}}

#chrome{position:sticky;top:0;z-index:30;background:var(--ground)}
.topbar{
  display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;
  height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--pad) 0;
  background:var(--ground);
}
.top-left{display:flex;align-items:center;justify-content:flex-start;min-width:0}
.top-right{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.topbar-title{
  font-family:var(--serif);font-size:22px;font-weight:400;line-height:1;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 4px;
}
.icon-btn{
  width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
}
.avatar span{font-family:var(--serif);font-size:15px;line-height:1;transform:translateY(-.5px)}
.avatar:hover{border-color:#d7d3c8;background:var(--ground)}
.back-btn{width:32px;height:32px;margin-left:-6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.back-btn:hover{background:var(--surface)}
.back-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.inbox-btn{
  position:relative;min-width:34px;height:32px;padding:0 2px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--text);
}
.inbox-btn:hover{background:var(--surface)}
.inbox-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.inbox-badge{position:absolute;top:1px;right:-5px;display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--dot);border:2px solid var(--ground)}
.inbox-dot{display:none}
.inbox-badge .inbox-count{font-size:10px;font-weight:600;line-height:1;color:#fff;margin:0;font-variant-numeric:tabular-nums}
.ribbon{
  height:24px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border-bottom:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:500;
}
.tabs{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;
  width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(247,246,242,.96);border-top:1px solid var(--border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:4px 0 2px;border-radius:12px;color:var(--faint);font-size:10.5px;font-weight:500;line-height:1;
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tab:hover{color:var(--muted)}
.view{padding:12px var(--pad) calc(88px + env(safe-area-inset-bottom));min-height:60dvh}
.view.no-tabs{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.view.onboarding{padding:0;min-height:100dvh}

/* ---- type and common ---- */
.screen-head{display:flex;flex-direction:column;gap:12px;margin:3px 0 16px}
.section-label{font-size:14px;font-weight:600;line-height:1.35;margin:0;color:var(--text)}
.label{font-size:12px;font-weight:500;color:var(--muted)}
.serif{font-family:var(--serif);font-weight:400}
.sub{font-size:13px;line-height:1.55;color:var(--muted)}
.tiny{font-size:11.5px;line-height:1.45;color:var(--faint)}
.spacer{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--control-h);padding:0 16px;border-radius:var(--radius-control);
  border:1px solid var(--border);background:var(--sheet);color:var(--text);
  font-size:13px;font-weight:500;line-height:1;text-align:center;white-space:nowrap;
}
.btn:hover{border-color:#d7d3c8;text-decoration:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#17615a;border-color:#17615a}
.btn-ink{background:var(--text);border-color:var(--text);color:#fff}
.btn-ink:hover{background:#34352f;border-color:#34352f}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:0 10px}
.btn-ghost:hover{background:var(--surface);border-color:transparent}
.btn-outline{background:transparent;border-color:var(--border)}
.btn-danger{background:transparent;border-color:#e4c5c0;color:var(--negative)}
.btn-danger:hover{background:#fbf1ef;border-color:#d8aaa2}
.btn-danger-solid{background:var(--negative);border-color:var(--negative);color:#fff}
.btn-danger-solid:hover{background:#971d14;border-color:#971d14}
.btn-block{width:100%}
.btn-sm{min-height:32px;font-size:12px;padding:0 12px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.text-btn{
  display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 4px;
  color:var(--muted);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px;
}
.text-btn:hover{color:var(--text)}
.link-btn{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}
.chip-row,.chips-scroll{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:30px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-control);
  background:transparent;color:var(--muted);font-size:12px;font-weight:500;line-height:1;white-space:nowrap;
}
.chip:hover{border-color:#d7d3c8;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.chip[aria-pressed="true"]:hover{color:#fff}
.search-toggle{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid transparent;
}
.search-toggle:hover{background:var(--surface)}
.search-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.search-toggle[aria-expanded="true"]{background:var(--surface);border-color:var(--border);color:var(--text)}
.search-row{display:flex;gap:8px;align-items:center;margin:-2px 0 12px}
.search-field{
  flex:1;height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--radius-control);background:var(--sheet);
}
.search-field:focus-within{border-color:#d7d3c8}
.search-field svg{width:16px;height:16px;fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.search-field input{border:0;background:transparent;width:100%;font-size:13px;outline:none;padding:0}
.search-field input::placeholder{color:var(--faint)}
.icon-plain{
  width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
}
.icon-plain:hover{background:var(--surface)}
.icon-plain svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.inline-error{font-size:12.5px;line-height:1.45;color:var(--negative);margin:8px 0 0}
.inline-note{font-size:12.5px;line-height:1.45;color:var(--muted);margin:10px 0 0;padding:8px 11px;background:var(--surface);border-radius:12px}
.feedback{font-size:12.5px;line-height:1.45;margin:9px 0 0;color:var(--muted)}
.feedback.ok{color:var(--accent)}
.feedback.bad{color:var(--negative)}
.feedback:empty{display:none}

.state{
  padding:32px 18px;text-align:center;border:1px solid var(--rule);border-radius:18px;background:var(--sheet);
}
.state-title{font-family:var(--serif);font-size:23px;line-height:1.1;margin:0 0 7px}
.state-copy{font-size:13px;line-height:1.58;color:var(--muted);max-width:300px;margin:0 auto 15px}
.state-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.plan-ideas{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.plan-ideas-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 2px 4px}
.plan-idea{text-align:left;background:transparent;border:1px solid var(--line,#e4e1d8);border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;color:var(--ink,#1f1f1d);cursor:pointer}
.plan-idea:active{background:#efede6}
.compact-empty{padding:20px 4px;color:var(--muted);font-size:13px;line-height:1.5}
.compact-error{padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);font-size:13px;color:var(--muted)}

/* ---- skeletons ---- */
.skeleton{
  background:linear-gradient(90deg,var(--surface) 25%,#f7f5ef 38%,var(--surface) 52%);
  background-size:400% 100%;animation:sk 1.5s ease infinite;border-radius:8px;
}
.sk-line{height:10px;border-radius:5px;margin-bottom:8px}
.sk-line.w40{width:40%}.sk-line.w60{width:60%}.sk-line.w80{width:80%}.sk-line.w100{width:100%}
.sk-greeting{height:34px;width:88%;margin:8px 0 10px;border-radius:10px}
.sk-greeting.short{height:24px;width:58%;margin-bottom:20px}
.sk-composer{height:122px;border-radius:22px;margin-bottom:18px}
.sk-note{height:84px;border-radius:18px;margin-bottom:10px}
.sk-card{height:180px;border-radius:22px;margin-bottom:11px}
.sk-card.tall{height:228px}
.sk-inbox{height:260px;border-radius:22px}
.sk-detail{height:180px;border-radius:22px}

/* ---- notes ---- */
.greeting{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.04;
  letter-spacing:-.015em;margin:8px 0 18px;max-width:365px;
}
.composer{
  background:var(--sheet);border:1px solid var(--border);border-radius:22px;
  padding:12px 14px 10px;margin-bottom:16px;
  transition:box-shadow .2s ease,border-color .2s ease;
}
.composer:focus-within{border-color:#d8d4c8;box-shadow:0 10px 30px rgba(31,32,29,.075)}
.compose-text{
  display:block;width:100%;min-height:55px;max-height:210px;border:0;background:transparent;
  resize:none;padding:2px 0 8px;font-size:14px;line-height:1.55;outline:none;
}
.compose-text:focus-visible{outline:none}
.compose-text::placeholder{color:var(--faint)}
.compose-link{margin:0 0 8px}
.link-chip{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;
  padding:0 4px 0 10px;border-radius:var(--radius-control);
  background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;
}
.link-chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.link-chip .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;color:var(--muted);font-size:12px;font-weight:400}
.link-chip .remove{width:23px;height:23px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.link-chip .remove:hover{background:var(--border)}
.link-chip .remove svg{width:12px;height:12px}
.compose-foot{display:flex;align-items:center;gap:3px}
.tool-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px;border-radius:var(--radius-control);
  color:var(--muted);font-size:12px;font-weight:500;
}
.tool-btn:hover{background:var(--surface);color:var(--text)}
.tool-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.save-btn{min-height:36px;min-width:70px;padding:0 15px;font-size:12.5px}
.notes-tools{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.didyougo{
  background:var(--sheet);border:1px solid var(--border);border-radius:16px;
  padding:11px 13px;margin:0 0 16px;
}
.didyougo-q{font-size:13px;line-height:1.45;color:var(--text);margin:0 0 8px}
.didyougo-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.didyougo-actions .btn-sm{min-height:28px;padding:0 10px;font-size:11.5px}
.didyougo-actions .spacer{min-width:2px}
.dismiss-btn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--faint)}
.dismiss-btn:hover{background:var(--surface);color:var(--muted)}
.dismiss-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}

.day-group{margin:0 0 20px}
.day-label{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 7px 2px;line-height:1.3}
.note{
  position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:18px;
  padding:12px 14px 10px;margin:0 0 9px;
}
.note-text{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 9px;color:var(--text)}
.note-text:last-child{margin-bottom:2px}
.note-media{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}
.note-photo{width:74px;height:74px;object-fit:cover;border-radius:11px;border:1px solid var(--rule);background:var(--surface);display:block}
.note-link{margin:0 0 9px}
.note-link .link-chip{color:var(--muted)}
.note-link:hover{text-decoration:none}
.note-foot{display:flex;align-items:center;gap:6px;min-height:24px;color:var(--faint);font-size:11.5px;line-height:1.3}
.note-time{font-variant-numeric:tabular-nums}
.note-dot{width:2px;height:2px;border-radius:50%;background:var(--faint);display:inline-block;margin:0 1px}
.note-count{color:var(--muted)}
.note-menu{
  margin-left:auto;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--faint);flex:0 0 auto;
}
.note-menu:hover{background:var(--surface);color:var(--muted)}
.note-menu svg{width:15px;height:15px;fill:currentColor}
.note-enter{animation:noteIn .18s ease both}
.mention{position:relative;display:inline;padding:0 0 1px;border:0;background:none;color:inherit;font:inherit;line-height:inherit;text-align:left;border-radius:2px;cursor:pointer}
.mention.static{cursor:inherit}
.mention.matched::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;border-radius:2px;
  background:#b3c2ec;transform-origin:left;transform:scaleX(1);
  transition:background .15s ease;
}
.mention.matched:hover::after{background:#94a8e4}
.mention.matched.draw::after{animation:underline 1.1s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0ms)}
.mention.inbox{border-bottom:1px dotted #b8b5ab;color:var(--muted)}
.mention.pending{border-bottom:1px dotted #c9c6bc}
.plus-one{
  display:inline-block;margin-left:4px;font-size:10px;font-weight:500;color:#7d8fc8;
  vertical-align:super;line-height:1;opacity:0;animation:plusFade 2.4s ease .1s both;
}
.note-enter .mention.matched::after{animation:underline .55s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0ms)}
.tag-chip{
  display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:var(--radius-control);
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:500;
}

/* ---- cards ---- */
.cards-head{display:flex;flex-direction:column;gap:12px;margin:3px 0 15px}
.segmented{
  display:inline-flex;align-self:flex-start;padding:3px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-control);
}
.seg-btn{
  height:28px;padding:0 14px;border-radius:var(--radius-control);font-size:12px;font-weight:500;
  color:var(--muted);line-height:1;
}
.seg-btn[aria-pressed="true"]{background:var(--sheet);color:var(--text);border:1px solid var(--rule)}
.filters{margin:0 0 15px}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start}
.wall-col{display:flex;flex-direction:column;gap:11px;min-width:0}
.card-tile{
  display:block;width:100%;text-align:left;background:var(--sheet);
  border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;
  color:var(--text);position:relative;padding:0;
}
.card-tile:hover{border-color:#d7d3c8}
.type-bar{display:block;height:4px;width:100%;background:var(--type,var(--other))}
.type-film{--type:var(--film)}
.type-music{--type:var(--music)}
.type-book{--type:var(--book)}
.type-place{--type:var(--place)}
.type-tv{--type:var(--film)}
.type-other{--type:var(--other)}
.card-face{display:block;position:relative;overflow:hidden}
.card-face.image-face{background:var(--surface)}
.card-face.image-face img{display:block;width:100%;object-fit:cover;position:relative;z-index:1;background:var(--surface)}
.size-1 .image-face img{aspect-ratio:1/1}
.size-2 .image-face img{aspect-ratio:4/5}
.size-3 .image-face img{aspect-ratio:3/4}
.cover-fallback{
  position:absolute;inset:0;z-index:0;display:flex;align-items:flex-end;padding:12px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--type,var(--other)) 10%,var(--sheet)),var(--sheet) 78%);
}
.cover-fallback .face-title{font-size:19px}
.typographic-face{
  display:flex;align-items:flex-end;padding:14px 12px 12px;min-height:110px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--type,var(--other)) 9%,var(--sheet)),var(--sheet) 78%);
}
.size-1 .typographic-face{min-height:104px}
.size-2 .typographic-face{min-height:142px}
.size-3 .typographic-face{min-height:188px}
.face-title{
  font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:-.012em;
  color:var(--text);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.size-1 .typographic-face .face-title{font-size:21px}
.size-2 .typographic-face .face-title{font-size:26px}
.size-3 .typographic-face .face-title{font-size:31px}
.card-body{display:block;padding:10px 12px 11px}
.card-name{
  display:block;font-family:var(--serif);font-size:17px;line-height:1.08;font-weight:400;
  margin:0 0 3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-context{
  display:block;font-size:11.5px;line-height:1.35;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;
}
.card-meta{display:flex;align-items:center;gap:5px;margin-top:9px;min-height:10px}
.fp-dots{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.fp-dot{width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.28;display:inline-block}
.fp-more{font-size:10.5px;color:var(--faint);line-height:1;margin-left:1px;font-variant-numeric:tabular-nums}
.card-heart{display:inline-flex;align-items:center;color:var(--text)}
.card-heart svg{width:12px;height:12px;fill:currentColor;stroke:currentColor;stroke-width:1.4}
.notme{font-size:10.5px;color:var(--faint);margin-left:auto;line-height:1;white-space:nowrap}
.is-out .card-face,.is-out .card-body{opacity:.5}
.is-out .card-tile? {}
.wall.single{display:block;max-width:288px;margin:22px auto 0}
.wall.single .wall-col{gap:0}
.wall.single .typographic-face{min-height:190px}
.wall.single .typographic-face .face-title{font-size:33px}
.wall.single .image-face img{aspect-ratio:3/4}
.wall.single .card-name{font-size:21px}
.single-hint{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;max-width:250px;margin:14px auto 0}

/* ---- card detail ---- */
.detail{max-width:100%}
.detail-hero{margin:4px 0 14px}
.detail-hero-img{
  position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);
  background:var(--surface);min-height:120px;
}
.detail-hero-img img{display:block;width:100%;max-height:280px;object-fit:cover;position:relative;z-index:1;background:var(--surface)}
.detail-hero-img .cover-fallback{align-items:flex-end;padding:18px}
.detail-hero-img .cover-fallback .face-title{font-size:32px}
.detail-typeface{
  border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--sheet);
}
.detail-typeface .type-bar{height:4px}
.detail-typeface-inner{
  padding:20px 18px 18px;min-height:142px;display:flex;align-items:flex-end;
  background:linear-gradient(155deg,color-mix(in srgb,var(--type,var(--other)) 10%,var(--sheet)),var(--sheet) 78%);
}
.detail-typeface .face-title{font-size:36px;-webkit-line-clamp:unset;overflow:visible}
.detail-title{font-family:var(--serif);font-size:36px;line-height:1.02;letter-spacing:-.02em;margin:0 0 5px;overflow-wrap:anywhere}
.detail-context{font-size:13px;color:var(--muted);line-height:1.4;margin:0}
.detail-controls{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.heart-btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--radius-control);
  border:1px solid var(--border);background:var(--sheet);color:var(--muted);font-size:12px;font-weight:500;
}
.heart-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.heart-btn[aria-pressed="true"]{background:var(--surface);border-color:#d7d3c8;color:var(--text)}
.heart-btn[aria-pressed="true"] svg{fill:currentColor}
.heart-btn.notme[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.summary{font-size:12.5px;line-height:1.5;color:var(--muted);margin:14px 0 0;padding:0 0 14px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.filmstrip{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;margin:0}
.filmstrip::-webkit-scrollbar{display:none}
.strip-img{width:98px;height:118px;object-fit:cover;border-radius:12px;border:1px solid var(--rule);background:var(--surface);flex:0 0 auto}
.fp-list{margin:16px 0 0}
.fp{padding:13px 0;border-top:1px solid var(--rule)}
.fp-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fp-date{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.fp-kind{font-size:10.5px;font-weight:500;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 7px;line-height:1.3}
.fp-detach{margin-left:auto;font-size:11px;color:var(--faint);text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.fp-detach:hover{color:var(--text)}
.fp-quote{font-size:13.5px;line-height:1.5;color:var(--text);margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.fp-thumb{width:58px;height:58px;object-fit:cover;border-radius:9px;margin-top:8px;border:1px solid var(--rule)}
.viewchanged{margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.viewchanged h3{font-family:var(--serif);font-size:21px;font-weight:400;margin:0 0 11px}
.vw-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.vw-quote{background:var(--sheet);border:1px solid var(--border);border-radius:14px;padding:11px;min-width:0}
.vw-quote blockquote{font-size:12px;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.vw-date{font-size:10.5px;color:var(--faint);margin-top:8px;display:block;font-variant-numeric:tabular-nums}
.qloo-tags{margin:22px 0 0;padding:15px 0 0;border-top:1px solid var(--rule)}
.qloo-head{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.qloo-head h3{font-size:13px;font-weight:600;margin:0}
.catalogue{font-size:10.5px;color:var(--faint)}
.tag-row{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted);background:var(--ground)}
.detail-actions{display:flex;gap:8px;margin:22px 0 0;padding:15px 0 0;border-top:1px solid var(--rule)}
.detail-actions .btn{flex:1 1 0;min-width:0}
.missing-note{margin-top:10px}

/* ---- inbox ---- */
.inbox-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin:1px 0 13px}
.inbox-card{background:var(--sheet);border:1px solid var(--border);border-radius:22px;padding:18px 17px 16px}
.inbox-word{font-size:12px;font-weight:500;color:var(--faint);margin:0 0 9px}
.sentence{font-size:15px;line-height:1.6;color:var(--text);margin:0 0 20px;white-space:pre-wrap;overflow-wrap:anywhere}
.sentence mark{background:transparent;color:var(--text);border-bottom:1.5px solid #b3c2ec;padding-bottom:1px}
.didyoumean{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px}
.guess-best{border:1px solid var(--border);background:var(--ground);border-radius:16px;padding:12px 13px;margin:0 0 11px}
.guess-name{display:block;font-family:var(--serif);font-size:22px;line-height:1.05;margin:0 0 3px;overflow-wrap:anywhere}
.guess-meta{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.or-label{font-size:11px;color:var(--faint);margin:0 0 6px}
.alt-guess{
  display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);
  border-radius:13px;padding:9px 11px;margin:0 0 6px;color:var(--text);
}
.alt-guess:hover{border-color:#d7d3c8;background:var(--ground)}
.alt-name{display:block;font-size:13px;font-weight:500;line-height:1.35}
.alt-meta{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:1px}
.inbox-actions{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}
.inbox-actions .btn{flex:1 1 0;min-width:110px}
.keep-all{margin-top:9px;text-align:center}
.done-wrap{padding:60px 14px 0;text-align:center}
.done-title{font-family:var(--serif);font-size:30px;line-height:1.05;margin:0 0 8px}
.done-copy{font-size:13px;color:var(--muted);line-height:1.55;margin:0 auto 16px;max-width:260px}
.inbox-stack{position:relative}
.inbox-stack::before{
  content:"";position:absolute;left:8px;right:8px;top:7px;height:18px;border-radius:22px;
  background:var(--surface);border:1px solid var(--rule);z-index:-1;
}

/* ---- threads ---- */
.thread{background:var(--sheet);border:1px solid var(--border);border-radius:22px;padding:16px;margin:0 0 12px}
.from-qloo{
  display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;
  border:1px solid var(--accent);color:var(--accent);font-size:10.5px;font-weight:500;line-height:1;
}
.thread-title{font-family:var(--serif);font-size:26px;line-height:1.06;font-weight:400;margin:8px 0 12px;overflow-wrap:anywhere}
.thread-evidence-label{display:block;font-size:11px;font-weight:500;color:var(--faint);margin:0 0 6px}
.thread-chips{display:flex;flex-wrap:wrap;gap:6px}
.thread-chip{
  display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--border);background:var(--ground);color:var(--text);font-size:12px;text-align:left;line-height:1.25;
}
.thread-chip:hover{border-color:#d7d3c8;background:var(--surface)}
.thread-chip .count{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.thread-read{font-size:12.5px;line-height:1.55;color:var(--muted);font-style:italic;margin:12px 0 0;padding-top:11px;border-top:1px solid var(--rule)}
.period-row{margin-top:12px}
.period-note{font-size:12px;color:var(--faint);margin:8px 0 0;line-height:1.45;min-height:1em}
.thread-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shift-pill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:500;line-height:1;background:var(--surface);color:var(--muted)}
.shift-pill.new{background:var(--text);color:#fff}
.shift-pill.fading{background:transparent;border:1px dashed var(--faint);color:var(--muted)}
.why-btn{margin-top:10px;font-size:12px;font-weight:500;color:var(--accent);padding:6px 0;min-height:32px}
.why-sec{margin:0 0 16px}
.why-h{margin:0 0 8px;font-size:12px;font-weight:500}
.from-notes{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--surface);color:var(--text);font-size:10.5px;font-weight:500}
.why-read-h{font-style:italic;color:var(--muted);font-weight:500}
.why-list{list-style:none;margin:0;padding:0}
.why-list li{padding:8px 0;border-top:1px solid var(--rule)}
.why-list li:first-child{border-top:0;padding-top:2px}
.why-tag-name{font-family:var(--serif);font-size:19px;color:var(--text);line-height:1.15}
.why-meta{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.why-line{font-size:12.5px;color:var(--muted);margin-top:2px}
.why-quote blockquote{margin:0 0 3px;color:var(--text);font-size:13.5px;line-height:1.5}
.why-card-btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;color:var(--text);font-size:13.5px}
.why-read{font-style:italic;color:var(--muted);font-size:12.5px;margin:0 0 6px}
.why-details summary{font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;padding:4px 0}
.why-receipt{margin-top:8px;background:var(--ground);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;color:var(--text);overflow-wrap:anywhere}
.why-receipt .ind{padding-left:12px}
.why-faint{color:var(--faint)}
.why-focus{outline:none}
.why-tagnote{margin:0 0 8px}
.why-also{font-size:11px;font-weight:500;color:var(--faint);padding-top:12px!important}
.why-tag.extra .why-tag-name{font-size:16px}
.why-also + .why-tag{border-top:0}
.why-intro{font-size:12.5px;color:var(--muted);margin:0 0 14px}

/* ---- plan request ---- */
.plan-prompt{font-family:var(--serif);font-size:32px;line-height:1.04;letter-spacing:-.012em;font-weight:400;margin:7px 0 18px;max-width:350px}
.plan-form{background:var(--sheet);border:1px solid var(--border);border-radius:22px;padding:15px 15px 14px}
.plan-sentence{display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px;font-size:14px;line-height:1.7;color:var(--muted)}
.plan-sentence .sep{color:var(--faint)}
.inline-input{
  border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;
  color:var(--text);font-size:14px;line-height:1.7;padding:0 2px;min-width:2.5ch;
  field-sizing:content;max-width:100%;
}
.inline-input:focus{outline:none;border-bottom-color:var(--accent)}
.inline-input:focus-visible{outline:none;border-bottom-color:var(--accent)}
.when-input,.area-input{min-width:0}
.budget-input{text-align:left}
.mood-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.mood{
  height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;
}
.mood[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.free-line{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.free-input{
  width:100%;border:1px solid var(--border);border-radius:14px;background:var(--ground);
  padding:10px 11px;font-size:13px;line-height:1.45;
}
.free-input::placeholder{color:var(--faint)}
.plan-submit{margin-top:13px}
.log-panel{margin-top:15px;background:var(--sheet);border:1px solid var(--border);border-radius:20px;padding:14px 15px}
.log-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.log-status{font-size:13px;font-weight:500;line-height:1.4;display:flex;align-items:center;gap:7px;color:var(--text)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
.log-sub{font-size:11.5px;color:var(--faint);margin:3px 0 0;line-height:1.4}
.log-lines{list-style:none;margin:11px 0 0;padding:0;max-height:230px;overflow-y:auto}
.log-line{font-size:12.5px;line-height:1.5;color:var(--muted);padding:5px 0;border-top:1px solid var(--rule);animation:fadeIn .28s ease both}
.log-line:first-child{border-top:0}
.log-cancel{margin-top:9px;text-align:left}
.plan-error{margin-top:15px;background:var(--sheet);border:1px solid var(--border);border-radius:18px;padding:15px}
.plan-error-title{font-family:var(--serif);font-size:23px;line-height:1.1;margin:0 0 6px;font-weight:400}
.plan-error-text{font-size:13px;line-height:1.55;color:var(--text);margin:0 0 5px;overflow-wrap:anywhere}
.plan-error-copy{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 13px}
.plan-error-actions{display:flex;gap:7px;flex-wrap:wrap}
.saved-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:27px 0 4px}
.saved-list{}
.saved-plan{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;width:100%;
  text-align:left;padding:13px 2px;border-top:1px solid var(--rule);color:var(--text);
}
.saved-plan:hover .saved-plan-head{text-decoration:underline;text-underline-offset:2px}
.saved-plan:first-child{border-top:0}
.saved-plan-main{min-width:0}
.saved-plan-head{font-family:var(--serif);font-size:18px;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.saved-plan-stops{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.saved-plan-date{display:block;font-size:10.5px;color:var(--faint);line-height:1.4;margin-top:3px;font-variant-numeric:tabular-nums}
.saved-plan-chev{color:var(--faint);padding-top:4px}
.saved-plan-chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---- plan result ---- */
.plan-header{font-family:var(--serif);font-size:30px;line-height:1.07;font-weight:400;letter-spacing:-.012em;margin:7px 0 5px;overflow-wrap:anywhere}
.plan-meta{font-size:11.5px;color:var(--faint);line-height:1.4;margin:0 0 19px}
.stop{background:var(--sheet);border:1px solid var(--border);border-radius:22px;padding:16px 15px 14px;margin:0 0 12px}
.stop-head{display:flex;gap:11px;align-items:flex-start}
.stop-index{font-family:var(--serif);font-size:22px;line-height:1;color:var(--faint);padding-top:2px;min-width:14px;font-variant-numeric:tabular-nums}
.stop-main{min-width:0;flex:1}
.stop-name{font-family:var(--serif);font-size:26px;line-height:1.05;font-weight:400;margin:0 0 3px;overflow-wrap:anywhere}
.stop-where{font-size:12px;color:var(--muted);line-height:1.4;margin:0;overflow-wrap:anywhere}
.evidence{display:grid;gap:9px;margin:14px 0 0}
.ev-row{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.ev-label{
  display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;
  font-size:10.5px;font-weight:500;line-height:1;white-space:nowrap;
}
.ev-label.notes{background:var(--surface);color:var(--text)}
.ev-label.qloo{background:transparent;border:1px solid var(--accent);color:var(--accent);height:19px}
.ev-label.read{background:none;padding:0;height:auto;color:var(--muted);font-style:italic;font-size:10.5px}
.ev-text{font-size:12.5px;line-height:1.55;color:var(--text);margin:0;overflow-wrap:anywhere}
.ev-text.read{color:var(--muted);font-style:italic}
.stop-ops{
  display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:13px;padding-top:11px;
  border-top:1px solid var(--rule);font-size:11px;color:var(--muted);line-height:1.5;
}
.stop-ops .sep{color:var(--faint)}
.stop-ops a,.stop-ops button{
  color:var(--text);font-size:11px;text-decoration:underline;text-underline-offset:2px;padding:0;
}
.stop-ops a:hover,.stop-ops button:hover{color:var(--accent)}
.stop-inline{grid-column:1/-1;margin-top:7px}
.plan-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.plan-actions .btn{flex:1 1 0;min-width:92px}
.plan-action-area{margin-top:4px}
.saved-confirm{
  margin-top:12px;padding:10px 13px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;font-size:12.5px;line-height:1.5;color:var(--muted);
}
.how{margin:24px 0 0;border-top:1px solid var(--rule);padding-top:13px}
.how summary{
  list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--muted);line-height:1.5;
}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";color:var(--faint);font-size:14px;margin-left:auto;line-height:1}
.how[open] summary::after{content:"−"}
.how-list{list-style:none;margin:10px 0 0;padding:0}
.how-list li{font-size:12px;line-height:1.55;color:var(--muted);padding:5px 0;border-top:1px solid var(--rule)}
.how-list li:first-child{border-top:0}
.missing-plan{max-width:330px;margin:44px auto 0}

/* ---- settings ---- */
.settings-section{background:var(--sheet);border:1px solid var(--border);border-radius:22px;padding:16px;margin:0 0 12px}
.settings-title{font-size:14px;font-weight:600;line-height:1.4;margin:0 0 4px}
.settings-hint{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.settings-hint.inline{margin-bottom:0}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.field label{font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.4}
.field input,.field select{
  width:100%;height:38px;border:1px solid var(--border);border-radius:999px;background:var(--ground);
  padding:0 13px;font-size:13.5px;color:var(--text);
}
.field input:focus{border-color:#d7d3c8;outline:none}
.field input:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field-row .field{margin-bottom:0}
.save-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.import-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.file-name{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 8px;overflow-wrap:anywhere}
.import-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.stat{background:var(--ground);border:1px solid var(--rule);border-radius:14px;padding:10px 11px}
.stat-num{display:block;font-family:var(--serif);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.stat-label{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px}
.result-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fold summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.5;padding:8px 0 0;
}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";color:var(--faint);margin-left:auto;line-height:1}
.fold[open] summary::after{content:"−"}
.fold-body{font-size:12px;line-height:1.55;color:var(--muted);padding:9px 0 0}
.fold-body ol,.fold-body ul{margin:6px 0 0;padding-left:17px}
.fold-body li{margin:0 0 3px}
.export-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.danger-section{border-color:#ead7d3}
.danger-copy{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 11px}
.sample-line{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 11px}
.settings-actions{display:flex;gap:7px;flex-wrap:wrap}

/* ---- import (shared) ---- */
.import-block .settings-title{font-size:14px}
.import-intro{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.import-result-title{font-family:var(--serif);font-size:24px;line-height:1.1;margin:4px 0 7px;font-weight:400}
.import-result-copy{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0 0 10px}
.import-error{font-size:12.5px;line-height:1.5;color:var(--negative);margin:8px 0 0}
.import-busy{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.onboard-import .import-block{background:var(--sheet);border:1px solid var(--border);border-radius:20px;padding:16px;margin-top:18px}

/* ---- onboarding ---- */
.onboard{min-height:100dvh;display:flex;flex-direction:column;padding:30px 24px calc(22px + env(safe-area-inset-bottom));background:var(--ground)}
.onboard-top{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.wordmark{display:inline-flex;align-items:baseline;gap:6px;color:var(--text)}
.wordmark-name{font-family:var(--serif);font-size:27px;line-height:1;letter-spacing:-.01em}
.wordmark-dots{display:inline-flex;gap:3px;transform:translateY(-1px)}
.wordmark-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:dotShimmer 1.15s ease-out both}
.wordmark-dot:nth-child(1){animation-delay:.15s}
.wordmark-dot:nth-child(2){animation-delay:.3s}
.wordmark-dot:nth-child(3){animation-delay:.45s}
.onboard-back{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 2px}
.onboard-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.onboard h1,.onboard-headline{font-family:var(--serif);font-size:45px;line-height:1.01;letter-spacing:-.022em;font-weight:400;margin:42px 0 14px;max-width:365px}
.onboard-sub{font-size:14px;line-height:1.58;color:var(--muted);margin:0 0 28px;max-width:335px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--sheet);border:1px solid var(--border);border-radius:20px;padding:14px 15px;
  transition:border-color .15s ease;
}
.choice:hover{border-color:#d7d3c8}
.choice-copy{min-width:0;flex:1}
.choice-title{display:block;font-size:14px;font-weight:600;line-height:1.35;color:var(--text)}
.choice-sub{display:block;font-size:12px;line-height:1.4;color:var(--muted);margin-top:2px}
.choice-chev{color:var(--faint)}
.choice-chev svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.onboard-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;line-height:1.5;color:var(--faint)}
.onboard-status{font-size:12.5px;line-height:1.45;color:var(--muted);margin:11px 0 0}
.onboard-status.bad{color:var(--negative)}
.onboard-error{
  margin:0 0 16px;padding:10px 12px;border:1px solid #ead7d3;border-radius:14px;
  background:#fdf8f6;font-size:12px;line-height:1.5;color:var(--muted);
}
.onboard-error .text-btn{color:var(--negative);font-size:11.5px}
.onboard-import{flex:1;min-height:0}
.onboard-import h1{font-size:36px;margin:32px 0 10px}
.onboard-import .onboard-sub{font-size:13.5px;margin-bottom:18px}
.onboard-import .details-lite{margin-top:10px}
.onboard-next{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.onboard-file-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.onboard .import-block{margin-top:14px}
.file-input-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---- camera ---- */
.camera-sheet{background:var(--sheet);border:1px solid var(--border);border-radius:26px;padding:14px;margin:4px 0 0}
.cam-frame{
  position:relative;border-radius:18px;overflow:hidden;background:var(--surface);
  min-height:250px;max-height:56dvh;display:flex;align-items:center;justify-content:center;
}
.cam-empty{text-align:center;padding:28px 22px;color:var(--muted)}
.cam-empty svg{width:30px;height:30px;color:var(--faint);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.cam-empty p{font-size:13px;line-height:1.55;margin:0 auto;max-width:240px}
.cam-preview{display:block;width:100%;max-height:56dvh;object-fit:contain;background:var(--surface)}
.cam-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.cam-caption{margin-top:12px}
.cam-caption textarea{
  width:100%;min-height:52px;resize:vertical;border:1px solid var(--border);border-radius:14px;
  background:var(--ground);padding:10px 11px;font-size:13.5px;line-height:1.5;
}
.cam-caption textarea::placeholder{color:var(--faint)}
.cam-fallback{font-size:11.5px;line-height:1.45;color:var(--faint);margin:9px 1px 0}
.cam-save-row{display:flex;align-items:center;gap:8px;margin-top:11px}
.cam-saved{display:flex;gap:13px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.cam-thumb-wrap{position:relative;width:112px;height:142px;flex:0 0 auto;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--rule)}
.cam-thumb{width:100%;height:100%;object-fit:cover;display:block}
.scan{position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent);opacity:.85;box-shadow:0 0 7px rgba(27,110,102,.25);animation:scan 1.7s ease-in-out infinite}
.corner-tab{position:absolute;top:0;right:0;width:4px;height:34px;border-radius:0 0 3px 3px;background:var(--type,var(--other))}
.cam-state{min-width:0;flex:1;padding-top:2px}
.cam-state-title{font-size:13px;font-weight:500;line-height:1.45;color:var(--text);margin:0 0 4px}
.cam-state-copy{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 9px;overflow-wrap:anywhere}
.cam-match-name{font-family:var(--serif);font-size:20px;line-height:1.1;margin:0 0 2px;overflow-wrap:anywhere}
.cam-match-type{font-size:11px;color:var(--muted)}
.cam-actions-end{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cam-retry{margin-top:8px}

/* ---- dialog ---- */
dialog.modal{
  border:0;padding:0;background:transparent;color:var(--text);
  width:100%;max-width:480px;margin:auto auto 0;max-height:92dvh;
}
dialog.modal::backdrop{background:rgba(31,32,29,.34)}
.sheet{
  background:var(--sheet);border-top:1px solid var(--border);
  border-radius:24px 24px 0 0;padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;
}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin:0 0 12px;padding-right:34px}
.sheet-title{font-family:var(--serif);font-size:24px;line-height:1.08;font-weight:400;margin:0}
.sheet-close{
  position:absolute;top:14px;right:calc(var(--pad) - 4px);width:32px;height:32px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--muted);
}
.sheet-close:hover{background:var(--surface)}
.sheet-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.sheet-body{font-size:13px;line-height:1.55;color:var(--muted)}
.sheet-body p{margin:0 0 10px}
.sheet-body p:last-child{margin-bottom:0}
.sheet-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.sheet-field{display:flex;flex-direction:column;gap:5px;margin:13px 0 0}
.sheet-field label{font-size:11.5px;font-weight:500;color:var(--muted)}
.sheet-field input,.sheet-field textarea{
  width:100%;border:1px solid var(--border);border-radius:13px;background:var(--ground);
  padding:10px 12px;font-size:13.5px;line-height:1.5;
}
.sheet-field textarea{min-height:108px;resize:vertical}
.menu-list{display:flex;flex-direction:column;gap:2px;margin:2px 0 0}
.menu-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;
  padding:9px 3px;border-top:1px solid var(--rule);color:var(--text);font-size:13.5px;
}
.menu-item:first-child{border-top:0}
.menu-item:hover{color:var(--accent)}
.menu-item.danger{color:var(--negative)}
.menu-item .sub{font-size:11.5px;margin-top:2px;color:var(--muted)}
@media (min-width:520px){
  dialog.modal{margin:auto;border-radius:24px;max-width:420px}
  .sheet{border-radius:24px;border:1px solid var(--border);max-height:86dvh}
  .sheet-close{right:14px}
}

/* ---- toast ---- */
.toast-host{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;width:min(440px,calc(100vw - 32px));display:flex;justify-content:center;pointer-events:none;
}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:100%;
  background:var(--text);color:var(--ground);border-radius:999px;padding:10px 15px;
  font-size:12.5px;line-height:1.4;animation:toastIn .18s ease both;
}
.toast-text{min-width:0;overflow-wrap:anywhere}
.toast-action{color:#fff;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}

/* ---- motion ---- */
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes noteIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes plusFade{0%{opacity:0;transform:translateY(2px)}18%{opacity:1;transform:translateY(0)}75%{opacity:.9}100%{opacity:0;transform:translateY(-1px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotShimmer{0%{opacity:.25;transform:translateY(1px)}40%{opacity:1;transform:translateY(-1px)}100%{opacity:.55;transform:translateY(0)}}
@keyframes scan{0%{top:0;opacity:.9}90%{top:100%;opacity:.25}100%{top:100%;opacity:0}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
  .wordmark-dot{opacity:.7}
}

@media (max-width:360px){
  :root{--pad:16px}
  .greeting{font-size:30px}
  .onboard h1,.onboard-headline{font-size:38px}
  .plan-prompt{font-size:29px}
  .detail-title{font-size:31px}
  .card-name{font-size:16px}
  .vw-grid{grid-template-columns:1fr}
}
.heart-btn{min-width:120px;justify-content:center}
.plan-notice{font-size:13px;line-height:1.45;color:var(--text);background:var(--surface);border-radius:14px;padding:10px 14px;margin:4px 0 14px}
.stop.just-swapped{outline:2px solid var(--accent);outline-offset:2px;transition:outline-color 1.4s}
.receipt{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px;font-size:12px;color:var(--muted)}
.receipt-title{font-weight:600;color:var(--text);margin:0 0 6px}
.receipt-line{margin:0 0 6px;line-height:1.5}
.receipt-line span{color:var(--text)}
.receipt code{font-size:11px;background:var(--surface);padding:1px 5px;border-radius:6px}
.grown{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.grown-chip{display:grid;grid-template-columns:32px auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;background:var(--ground);border:1px solid var(--border);border-radius:14px;padding:6px 12px 6px 6px;font:inherit;color:inherit;cursor:pointer;max-width:100%}
.grown-chip img,.grown-face{grid-row:1/3;width:32px;height:40px;border-radius:7px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;background:var(--surface)}
.grown-name{font-family:var(--serif);font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.grown-meta{font-size:11px;color:var(--muted)}
.grown-chip.type-film,.grown-chip.type-tv{border-left:3px solid var(--film)}.grown-chip.type-music{border-left:3px solid var(--music)}.grown-chip.type-book{border-left:3px solid var(--book)}.grown-chip.type-place{border-left:3px solid var(--place)}
.grow-in .grown-chip{animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.1s + var(--k,0) * 120ms)}
@keyframes grow{from{opacity:0;transform:translateY(-6px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.grow-in .grown-chip{animation:none}}
.plus-one{animation:plusfade 2.4s ease forwards}
@keyframes plusfade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0;width:0;margin:0}}
button:focus-visible,a:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #1b6e66;outline-offset:2px}
button,a,[role=button]{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
</style>

<body>
<div class="frame" id="frame">
  <div id="chrome" hidden>
    <header class="topbar">
      <div class="top-left" id="topLeft"></div>
      <h1 class="topbar-title" id="topTitle">Notes</h1>
      <div class="top-right" id="topRight"></div>
    </header>
    <div class="ribbon" id="ribbon" hidden>Sample notebook · made-up data</div>
  </div>
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Main" hidden>
    <button class="tab" type="button" data-tab="notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14M5 10.5h14M5 15.5h9M5 20h6"/></svg>
      <span>Notes</span>
    </button>
    <button class="tab" type="button" data-tab="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="9" rx="1.5"/></svg>
      <span>Cards</span>
    </button>
    <button class="tab" type="button" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2.5"/><path d="M4 10.5h16M8.5 3.5v5M15.5 3.5v5"/></svg>
      <span>Plan</span>
    </button>
  </nav>
</div>
<dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>
<div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Sparkling needs JavaScript to keep your notebook.</p></noscript>
<script>
"use strict";
/* ---------------------------------------------------------------------------
   Sparkling. One file. Vanilla JS, hash routes, cookie session.
   --------------------------------------------------------------------------- */

const view = document.getElementById("view");
const frame = document.getElementById("frame");
const chromeEl = document.getElementById("chrome");
const topLeft = document.getElementById("topLeft");
const topTitle = document.getElementById("topTitle");
const topRight = document.getElementById("topRight");
const ribbon = document.getElementById("ribbon");
const tabsEl = document.getElementById("tabs");
const modal = document.getElementById("modal");
const toastHost = document.getElementById("toastHost");

const DAY = 86400000;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEK_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const WEEK_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const COUNT_WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const TYPE_LABELS = { film:"Film", tv:"TV", music:"Music", book:"Book", place:"Place", other:"Other" };
const TYPE_CLASSES = { film:"type-film", tv:"type-tv", music:"type-music", book:"type-book", place:"type-place", other:"type-other" };
const VALID_TYPES = ["film","tv","music","book","place","other"];

const state = {
  user: null,
  inboxCount: 0,
  booted: false,
  bootError: null,
  bootNotice: null,
  lastMain: "#/notes",
  focusComposer: false,
};
const planCache = new Map();

let viewToken = 0;
let cleanups = [];
let toastTimer = null;

/* ---- escaping and small utilities ---- */
function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, function(c){
    return c === "&" ? "&amp;" : c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === '"' ? "&quot;" : "&#39;";
  });
}
function attr(value){ return esc(value); }
function clamp(n, lo, hi){ n = Number(n); if (!Number.isFinite(n)) n = lo; return Math.max(lo, Math.min(hi, n)); }
function numberValue(v){ const n = Number(v); return Number.isFinite(n) ? n : null; }
function plural(n, one, many){ return Number(n) === 1 ? one : many; }
function countWord(n){ const i = Math.max(0, Math.min(12, Math.floor(Number(n) || 0))); return COUNT_WORDS[i]; }
function countWordCap(n){ const w = countWord(n); return w.charAt(0).toUpperCase() + w.slice(1); }
function typeOf(t){ return VALID_TYPES.includes(t) ? t : "other"; }
function typeLabel(t){ return TYPE_LABELS[typeOf(t)]; }
function typeClass(t){ return TYPE_CLASSES[typeOf(t)]; }
function sizeOf(s){ const n = Number(s); return n === 2 || n === 3 ? n : 1; }

function safeHttpUrl(value){
  if (typeof value !== "string" || !value) return "";
  try {
    const u = new URL(value, location.href);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : "";
  } catch (_) { return ""; }
}
function imgSrc(value){
  if (typeof value !== "string" || !value) return "";
  if (value.charAt(0) === "/" && value.indexOf("//") !== 0) return value;
  return /^https?:\/\//i.test(value) ? value : "";
}
function linkHost(value){
  try {
    const u = new URL(value, location.href);
    return u.hostname.replace(/^www\./, "") || u.href;
  } catch (_) { return String(value || ""); }
}
function urlOnly(value){
  const t = String(value || "").trim();
  return /^https?:\/\/[^\s]+$/i.test(t) ? t : "";
}
function extractFirstUrl(value){
  const m = String(value || "").match(/https?:\/\/[^\s]+/i);
  return m ? m[0] : "";
}

function startOfDay(ms){
  const d = new Date(Number(ms));
  if (Number.isNaN(d.getTime())) return NaN;
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function dayDiff(ms){
  const a = startOfDay(Date.now()), b = startOfDay(ms);
  if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
  return Math.round((a - b) / DAY);
}
function formatTime(ms){
  const n = Number(ms);
  if (!Number.isFinite(n)) return "";
  const d = new Date(n);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function formatDayLabel(ms){
  const diff = dayDiff(ms);
  if (diff === null) return "Earlier";
  if (diff === 0) return "Today";
  if (diff > 0 && diff < 7) return WEEK_LONG[new Date(Number(ms)).getDay()];
  const d = new Date(Number(ms));
  const year = d.getFullYear() === new Date().getFullYear() ? "" : " " + d.getFullYear();
  return d.getDate() + " " + MONTHS[d.getMonth()] + year;
}
function formatDate(ms){
  const n = Number(ms);
  if (!Number.isFinite(n)) return "";
  const d = new Date(n);
  const year = d.getFullYear() === new Date().getFullYear() ? "" : " " + d.getFullYear();
  return d.getDate() + " " + MONTHS[d.getMonth()] + year;
}

  const n = Number(ms);

}

function lastSeen(ms){
  const diff = dayDiff(ms);
  if (diff === null) return "";
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  if (diff > 1 && diff < 7) return weekdayShort(ms);

function sleep(ms, signal){
  return new Promise(function(resolve, reject){
    const timer = setTimeout(resolve, ms);
    if (signal) {
      if (signal.aborted) { clearTimeout(timer); reject(Object.assign(new Error("aborted"), { name:"AbortError" })); return; }
      signal.addEventListener("abort", function(){
        clearTimeout(timer);
        reject(Object.assign(new Error("aborted"), { name:"AbortError" }));
      }, { once:true });
    }
  });
}

/* ---- API ---- */
async function api(path, options){
  const opts = options || {};
  const method = opts.method || "GET";
  const headers = Object.assign({}, opts.headers || {});
  const init = { method: method, credentials: "same-origin", headers: headers };
  if (opts.signal) init.signal = opts.signal;
  if (opts.body !== undefined) {
    if (opts.body instanceof FormData) {
      init.body = opts.body;
    } else {
      headers["content-type"] = "application/json";
      init.body = JSON.stringify(opts.body);
    }
  }
  const res = await fetch(path, init);
  let data = null;
  const ct = res.headers.get("content-type") || "";
  if (ct.indexOf("application/json") >= 0) {
    try { data = await res.json(); } catch (_) {}
  } else {
    let text = "";
    try { text = await res.text(); } catch (_) {}
    if (text) {
      try { data = JSON.parse(text); } catch (_) { data = text; }
    }
  }
  if (!res.ok) {
    const serverMsg = data && typeof data === "object" && data.error ? data.error : "";
    const err = new Error(serverMsg || ("Request failed (" + res.status + ")"));
    err.status = res.status;
    err.data = data;
    if (res.status === 401 && state.user) sessionLost();
    throw err;
  }
  return data;
}
async function refreshMe(){
  try {
    const me = await api("/api/me");
    if (me && me.user) {
      state.user = me.user;
      state.inboxCount = Number(me.inbox_count) || 0;
      updateRibbon();
      updateInboxBadge();
    }
  } catch (_) {}
}
function sessionLost(){
  if (!state.user) return;
  state.user = null;
  state.inboxCount = 0;
  state.focusComposer = false;
  state.bootNotice = "Your session ended. Start a fresh notebook when you are ready.";
  closeModal();
  history.replaceState(null, "", "#/onboarding");
  renderOnboarding();
}

  el.className = "toast";
  const span = document.createElement("span");

  el.appendChild(span);
  let undo = null;
  if (o.actionLabel && typeof o.onAction === "function") {
    undo = document.createElement("button");
    undo.type = "button";
    undo.className = "toast-action";
    undo.textContent = String(o.actionLabel);
    undo.addEventListener("click", function(){
      dismissToast();

    });
    el.appendChild(undo);
  }

  const duration = Number(o.duration) || (o.actionLabel ? 10000 : 3500);
  toastTimer = setTimeout(dismissToast, duration);
}

/* ---- navigation and boot ---- */
function parseRoute(){
  let raw = location.hash || "#/notes";
  if (raw === "#" || raw === "#/") return { name: "notes" };
  const path = raw.replace(/^#\/?/, "");
  const parts = path.split("/").filter(Boolean).map(function(p){
    try { return decodeURIComponent(p); } catch (_) { return p; }
  });
  if (!parts.length) return { name: "notes" };
  if (parts[0] === "notes") return { name: "notes" };
  if (parts[0] === "cards") return parts[1] ? { name: "card", id: parts[1] } : { name: "cards" };
  if (parts[0] === "threads") return { name: "threads" };
  if (parts[0] === "inbox") return { name: "inbox" };
  if (parts[0] === "plan") return parts[1] ? { name: "planResult", id: parts[1] } : { name: "plan" };
  if (parts[0] === "settings") return { name: "settings" };
  if (parts[0] === "camera") return { name: "camera" };
  if (parts[0] === "onboarding") return { name: "onboarding" };
  return { name: "notes" };
}
function go(hash){
  if (!hash) return;
  if (location.hash === hash) { route(); return; }
  location.hash = hash;
}
function route(){
  if (!state.booted) return;
  const r = parseRoute();
  if (!state.user) {
    if (r.name !== "onboarding") history.replaceState(null, "", "#/onboarding");
    renderOnboarding();
    return;
  }
  if (r.name === "onboarding") {
    history.replaceState(null, "", "#/notes");
    renderNotes();
    return;
  }
  if (r.name === "notes" || r.name === "cards" || r.name === "plan") state.lastMain = "#/" + r.name;
  try { window.scrollTo(0, 0); } catch (_) {}
  switch (r.name) {
    case "notes": renderNotes(); break;
    case "cards": renderCards(); break;
    case "card": renderCardDetail(r.id); break;
    case "threads": renderThreads(); break;
    case "inbox": renderInbox(); break;
    case "plan": renderPlanRequest(); break;
    case "planResult": renderPlanResult(r.id); break;
    case "settings": renderSettings(); break;
    case "camera": renderCamera(); break;
    default: renderNotes();
  }
}
window.addEventListener("hashchange", function(){
  dismissToast();
  route();
});
tabsEl.addEventListener("click", function(e){
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const name = tab.getAttribute("data-tab");
  if (name === "notes") go("#/notes");
  else if (name === "cards") go("#/cards");
  else if (name === "plan") go("#/plan");
});

  const nav = e.target.closest("[data-nav]");
  if (!nav) return;
  const to = nav.getAttribute("data-nav");
  if (!to) return;
  e.preventDefault();
  go(to);
});

  let file = null;
  let busy = false;

  function setName(){
    if (!nameEl) return;
    nameEl.textContent = file ? file.name : "No file chosen";
  }
  if (choose && input) {
    choose.addEventListener("click", function(){ if (!busy) input.click(); });
  }
  if (input) {
    input.addEventListener("change", function(){
      const f = input.files && input.files[0] ? input.files[0] : null;
      if (!f) return;
      file = f;
      setName();
      if (submit) submit.disabled = false;
      if (statusEl) { statusEl.hidden = true; statusEl.textContent = ""; statusEl.className = "import-busy"; }
      if (resultEl) resultEl.innerHTML = "";
    });
  }
  if (submit) {
    submit.addEventListener("click", async function(){
      if (busy || !file) return;
      busy = true;
      submit.disabled = true;
      if (choose) choose.disabled = true;
      if (statusEl) {
        statusEl.hidden = false;
        statusEl.className = "import-busy";
        statusEl.textContent = "Reading your file. You can leave this screen while it works.";
      }
      if (resultEl) resultEl.innerHTML = "";
      try {
        const fd = new FormData();
        fd.append("file", file, file.name || "letterboxd.csv");
        const data = await api("/api/import/letterboxd", { method: "POST", body: fd });
        if (statusEl) { statusEl.hidden = true; statusEl.textContent = ""; }
        if (resultEl) resultEl.innerHTML = importResultHTML(data || {});
        await refreshMe();
        if (typeof opts.onDone === "function") opts.onDone(data || {});
      } catch (e) {
        if (statusEl) {
          statusEl.hidden = false;
          statusEl.className = "import-error";
          statusEl.textContent = e.status === 404
            ? "The import is not available right now. Try again in a little while."
            : e.status === 413
              ? "That file is too large to read here."
              : "That file did not go through. Try the diary.csv file from your export.";
        }
        if (submit) submit.disabled = false;
      } finally {
        busy = false;
        if (choose) choose.disabled = false;
      }
    });
  }
}

async function retryBootFromOnboarding(button){
  if (button) { button.disabled = true; button.textContent = "Trying again"; }
  try {
    const me = await api("/api/me");
    if (!me || !me.user) throw new Error("no session");
    state.user = me.user;
    state.inboxCount = Number(me.inbox_count) || 0;
    state.bootError = null;
    state.bootNotice = null;
    go("#/notes");
  } catch (e) {
    if (e.status !== 401) state.bootError = "Your notebook could not be reached just now. Try again in a moment.";
    else { state.bootError = null; state.bootNotice = null; }
    renderOnboarding();
  }
}

  }
  function setBusy(b, text){
    choices.forEach(function(c){ c.disabled = b; });
    if (text) setStatus(text, false);
  }
  async function makeSession(mode, chosen){
    if (state.user) {
      if (mode === "sample" && !state.user.sample) {
        // A deliberate switch from onboarding.
      } else {
        if (mode === "new") state.focusComposer = true;
        go("#/notes");
        return;
      }
    }
    setBusy(true, mode === "sample" ? "Opening the sample notebook." : "Opening a notebook.");

      if (!data || !data.user) throw new Error("no user");

      else makeSession("new", "history");
    }
  });

function draftKey(){ return "sparkling.draft." + ((state.user && state.user.id) || "anon"); }
function readDraft(){
  try {
    const raw = localStorage.getItem(draftKey());
    if (!raw) return { text: "", link: "" };
    const data = JSON.parse(raw);
    if (typeof data === "string") return { text: data, link: "" };
    return { text: String(data && data.text || ""), link: String(data && data.link || "") };
  } catch (_) { return { text: "", link: "" }; }
}
function writeDraft(text, link){
  try {
    const key = draftKey();
    if (!text && !link) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify({ text: String(text || ""), link: String(link || "") }));
  } catch (_) {}
}
function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch (_) {} }

function didYouGoKey(){ return "sparkling.didYouGo." + ((state.user && state.user.id) || "anon"); }
function readDidYouGo(){
  try {
    const raw = localStorage.getItem(didYouGoKey());
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (!rec || typeof rec !== "object" || !rec.plan_id || !rec.place) return null;
    return rec;
  } catch (_) { return null; }
}
function writeDidYouGo(rec){
  try { localStorage.setItem(didYouGoKey(), JSON.stringify(rec)); } catch (_) {}
}
function clearDidYouGo(){ try { localStorage.removeItem(didYouGoKey()); } catch (_) {} }

function planPrefillKey(){ return "sparkling.planPrefill." + ((state.user && state.user.id) || "anon"); }
function takePlanPrefill(){
  try {
    const key = planPrefillKey();
    const v = sessionStorage.getItem(key);
    if (v) sessionStorage.removeItem(key);
    return v || "";
  } catch (_) { return ""; }
}
function putPlanPrefill(text){
  try { sessionStorage.setItem(planPrefillKey(), String(text || "")); } catch (_) {}
}

function planStorageKey(id){ return "sparkling.plan." + ((state.user && state.user.id) || "anon") + "." + String(id); }
function cachePlan(plan){
  if (!plan || !plan.id) return;
  planCache.set(String(plan.id), plan);
  try { sessionStorage.setItem(planStorageKey(plan.id), JSON.stringify(plan)); } catch (_) {}
}
function getCachedPlan(id){
  const key = String(id);
  if (planCache.has(key)) return planCache.get(key);
  try {
    const raw = sessionStorage.getItem(planStorageKey(key));
    if (!raw) return null;
    const plan = JSON.parse(raw);
    if (!plan || !plan.id) return null;
    planCache.set(key, plan);
    return plan;
  } catch (_) { return null; }
}
function clearPlanStorage(){
  planCache.clear();
  try {
    const keys = [];
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i);
      if (k && k.indexOf("sparkling.plan.") === 0) keys.push(k);
    }
    keys.forEach(function(k){ sessionStorage.removeItem(k); });
  } catch (_) {}
}

function mentionedTextHTML(text, mentions, opts){
  const o = opts || {};
  const whole = String(text == null ? "" : text);
  const arr = Array.isArray(mentions) ? mentions : [];
  const valid = [];
  arr.forEach(function(m, index){
    if (!m || typeof m !== "object") return;
    const s = Number(m.start), e = Number(m.end);
    if (!Number.isInteger(s) || !Number.isInteger(e)) return;
    if (s < 0 || e <= s || e > whole.length) return;
    valid.push({ m: m, s: s, e: e, i: index });
  });
  valid.sort(function(a, b){ return a.s - b.s || b.e - a.e; });
  let cursor = 0;
  let out = "";
  let drawIndex = 0;
  valid.forEach(function(item){
    if (item.s < cursor) return;
    if (item.s > cursor) out += esc(whole.slice(cursor, item.s));
    const seg = whole.slice(item.s, item.e);
    const m = item.m;
    const st = m.state || "plain";
    const cardId = m.card_id == null ? "" : String(m.card_id);
    if (st === "matched" && cardId) {
      const delay = drawIndex * 55;
      drawIndex += 1;
      out += '<button type="button" class="mention matched' + (o.draw ? " draw" : "") + '" style="--d:' + delay + 'ms" data-nav="' +
        attr("#/cards/" + encodeURIComponent(cardId)) + '">' + esc(seg) + "</button>";
      if (o.plus && m.plus_one) out += '<span class="plus-one" aria-hidden="true">+1</span>';
    } else if (st === "inbox") {
      out += '<span class="mention inbox" title="Waiting for a look">' + esc(seg) + "</span>";
    } else if (st === "pending") {
      out += '<span class="mention pending">' + esc(seg) + "</span>";
    } else {
      out += esc(seg);
    }
    cursor = item.e;
  });
  if (cursor < whole.length) out += esc(whole.slice(cursor));
  return out;
}
function noteHTML(note, opts){
  const o = opts || {};
  if (!note) return "";
  const id = String(note.id == null ? "" : note.id);

  if (grown.length) {

    }).join("") + "</div>";

function greetingText(notesArr, cardsArr){
  const day = weekdayNameToday();
  const weekAgo = Date.now() - 7 * DAY;
  let returners = null;
  let thisWeek = null;
  if (Array.isArray(cardsArr)) {
    returners = cardsArr.filter(function(c){
      return Number(c.last_at) >= weekAgo && Number(c.footprints) > 1;
    }).length;
  }
  if (Array.isArray(notesArr)) {
    thisWeek = notesArr.filter(function(n){ return Number(n.created_at) >= weekAgo; }).length;
    if (returners === null) {
      const seen = new Set();
      notesArr.forEach(function(n){
        if (Number(n.created_at) < weekAgo) return;
        (Array.isArray(n.mentions) ? n.mentions : []).forEach(function(m){
          if (m && m.plus_one && m.state === "matched" && m.card_id) seen.add(String(m.card_id));
        });
      });
      returners = seen.size;
    }
  }
  const amount = function(n){ return n > 12 ? "Many" : countWordCap(n); };
  if (returners !== null && returners >= 2) return day + ". " + amount(returners) + " things came back to you this week.";
  if (returners === 1) return day + ". One thing came back to you this week.";
  if (thisWeek !== null && thisWeek >= 2) return day + ". " + amount(thisWeek) + " notes joined your notebook this week.";
  if (thisWeek === 1) return day + ". One note joined your notebook this week.";
  if (Array.isArray(notesArr)) {
    if (notesArr.length) return day + ". A few things are here when you want them.";
    return day + ". A quiet page, ready when you are.";
  }
  return day + ". Your notebook is here.";
}

      const day = startOfDay(n.created_at);
