name: iOS (unsigned Simulator app)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["platforms/ios/**", "platforms/package*.json", "platforms/capacitor.config.json", ".github/workflows/ios.yml"]
jobs:
  simulator:
    runs-on: macos-15
    defaults: { run: { working-directory: platforms } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pick the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -40
          APP=$(find build/Build/Products -name "App.app" -maxdepth 3 | head -1); echo "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Sparkling-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sparkling-ios-simulator-app
          path: platforms/Sparkling-iOS-Simulator.zip
          if-no-files-found: error
