    return '<div class="plan-error" role="alert">' +
      '<p class="plan-error-title">That plan did not come together.</p>' +
      (text ? '<p class="plan-error-text">' + esc(text) + "</p>" : "") +
      '<div class="plan-error-actions"><button class="btn btn-sm" type="button" data-retry="plan">Try again</button></div>' +
    "</div>";
  }

  view.innerHTML =
    '<h2 class="plan-prompt">An afternoon, built from what you keep.</h2>' +
    '<form class="plan-form" data-plan-form novalidate>' +
      '<div class="plan-sentence">' +
        "<span>On</span>" +
        '<input class="inline-input when-input" data-when aria-label="When" placeholder="Saturday afternoon" value="' + attr(user.when || "") + '">' +
        '<span class="sep" aria-hidden="true">&middot;</span>' +
        "<span>around</span>" +
        '<input class="inline-input area-input" data-area aria-label="Area" placeholder="Greenpoint" value="' + attr(user.area || "") + '">' +
        '<span class="sep" aria-hidden="true">&middot;</span>' +
        "<span>under $</span>" +
        '<input class="inline-input budget-input" data-budget inputmode="numeric" aria-label="Budget" placeholder="40" value="' + attr(user.budget == null ? "" : user.budget) + '">' +
      "</div>" +
      '<div class="mood-row" role="group" aria-label="Mood">' +
        moodButtonHTML("familiar", "Familiar") +
        moodButtonHTML("different", "A little different") +
        moodButtonHTML("surprise", "Surprise me") +
        '</div><div class="mood-row" role="group" aria-label="Which you">' +
        [["all","All of you"],["now","Recent you"],["then","Earlier you"]].map(function(x){return '<button class="mood" type="button" data-period="'+x[0]+'" aria-pressed="'+(x[0]===period?"true":"false")+'">'+x[1]+'</button>';}).join("") +
      "</div>" +
      '<div class="free-line">' +
        '<input class="free-input" data-free aria-label="Anything else?" placeholder="A quiet bookstore, then somewhere to sit" value="' + attr(prefill) + '">' +
      "</div>" +
      '<div class="plan-submit"><button class="btn btn-primary btn-block" type="submit" data-make-plan>Make a plan</button></div>' +
      '<div data-plan-progress></div>' +
      '<div data-plan-error></div>' +
    "</form>" +
    '<div class="plan-ideas"><p class="plan-ideas-h">Try one of these</p>' +
    ["A quiet bookstore, then somewhere to sit","A record shop and a slow coffee","Something a little off my usual track","An old cinema, then a late bite"].map(function(t){return '<button type="button" class="plan-idea" data-idea="'+attr(t)+'">'+esc(t)+'</button>';}).join("") +
    "</div>" +
    "<div data-saved-plans></div>";

  view.querySelectorAll("[data-idea]").forEach(function(b){b.addEventListener("click",function(){var f=view.querySelector("[data-free]");f.value=b.getAttribute("data-idea");f.focus();});});
  const form = view.querySelector("[data-plan-form]");
  const whenInput = view.querySelector("[data-when]");
  const areaInput = view.querySelector("[data-area]");
  const budgetInput = view.querySelector("[data-budget]");
  const freeInput = view.querySelector("[data-free]");
  const planBtn = view.querySelector("[data-make-plan]");
  const progressSlot = view.querySelector("[data-plan-progress]");
  const errSlot = view.querySelector("[data-plan-error]");
  const savedSlot = view.querySelector("[data-saved-plans]");

  function appendLog(linesEl, text){
    if (!linesEl || !isCurrent(token)) return;
    const li = document.createElement("li");
    li.className = "log-line";
    li.textContent = String(text);
    linesEl.appendChild(li);
    linesEl.scrollTop = linesEl.scrollHeight;
  }
  function showPlanError(stateName, text){
    if (!isCurrent(token)) return;
    progressSlot.innerHTML = "";
    errSlot.innerHTML = planErrorHTML(stateName, text);
    if (stateName === "no_area") {
      const input = errSlot.querySelector("[data-error-area]");
      if (input) setTimeout(function(){ try { input.focus(); } catch (_) {} }, 30);
    }
  }
  function finishSubmit(){
    busy = false;
    if (isCurrent(token)) {
      planBtn.disabled = false;
      planBtn.textContent = "Make a plan";
    }
  }
  async function submitPlan(){
    if (busy) return;
    const when = whenInput ? whenInput.value.trim() : "";
    const area = areaInput ? areaInput.value.trim() : "";
    const budgetRaw = budgetInput ? budgetInput.value.trim() : "";
    const text = freeInput ? freeInput.value.trim() : "";
    busy = true;
    errSlot.innerHTML = "";
    progressSlot.innerHTML = logPanelHTML();
    planBtn.disabled = true;
    planBtn.textContent = "Making a plan";
    const body = { mood: mood, period: period };
    if (when) body.when = when;
    if (area) body.area = area;
    const budgetN = numberValue(budgetRaw);
    if (budgetRaw && budgetN !== null) body.budget = budgetN;
    if (text) body.text = text;
    try {
      const res = await fetch("/api/plan", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
        signal: ac.signal,
      });
      if (!res.ok || !res.body) {
        let msg = "";
        try { const d = await res.json(); msg = d && d.error; } catch (_) {}
        throw new Error(msg || ("Request failed (" + res.status + ")"));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      const linesEl = progressSlot.querySelector("[data-log-lines]");
      let buffer = "";
      let done = false;
      while (!done) {
        const step = await reader.read();
        done = !!step.done;
        buffer += decoder.decode(step.value || new Uint8Array(0), { stream: !done });
        const parts = buffer.split(/\r?\n/);
        buffer = parts.pop();
        for (let i = 0; i < parts.length; i++) {
          const raw = parts[i].trim();
          if (!raw) continue;
          let msg = null;
          try { msg = JSON.parse(raw); } catch (_) { continue; }
          if (!msg || typeof msg !== "object") continue;
          if (msg.type === "log" && msg.text) {
            appendLog(linesEl, msg.text);
          } else if (msg.type === "plan" && msg.plan && msg.plan.id) {
            cachePlan(msg.plan);
            finishSubmit();
            go("#/plan/" + encodeURIComponent(String(msg.plan.id)));
            return;
          } else if (msg.type === "error") {
            showPlanError(msg.state, msg.text);
            finishSubmit();
            return;
          }
        }
      }
      showPlanError(null, "The plan stream ended before a plan arrived.");
    } catch (e) {
      if (!isAbort(e) && isCurrent(token)) showPlanError(null, (e && e.message) || "That did not work. Try again.");
    } finally {
      finishSubmit();
    }
  }

  async function loadSaved(){
    if (!savedSlot) return;
    savedSlot.innerHTML = '<div class="skeleton sk-line w40"></div><div class="skeleton sk-line w60"></div><div class="skeleton sk-line w80"></div>';
    let data;
    try {
      data = await api("/api/plans", { signal: ac.signal });
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      savedSlot.innerHTML = '<div class="compact-error">Your saved plans did not load. <button class="text-btn" type="button" data-retry="saved">Try again</button></div>';
      return;
    }
    if (!isCurrent(token)) return;
    const plans = Array.isArray(data && data.plans) ? data.plans : [];
    if (!plans.length) { savedSlot.innerHTML = ""; return; }
    savedSlot.innerHTML =
      '<div class="saved-title"><h3 class="section-label">Saved plans</h3><span class="label num">' + plans.length + "</span></div>" +
      '<div class="saved-list">' + plans.map(savedPlanHTML).join("") + "</div>";
  }
  function savedPlanHTML(plan){
    const stops = Array.isArray(plan.stops) ? plan.stops : [];
    const names = stops.map(function(s){ return s && s.name; }).filter(Boolean).join(" · ");
    const when = Number(plan.saved_at || plan.created_at);
    return '<button class="saved-plan" type="button" data-nav="' + attr("#/plan/" + encodeURIComponent(String(plan.id))) + '">' +
      '<span class="saved-plan-main">' +
        '<span class="saved-plan-head">' + esc(plan.header || names || "Untitled plan") + "</span>" +
        (names ? '<span class="saved-plan-stops">' + esc(names) + "</span>" : "") +
        (Number.isFinite(when) ? '<span class="saved-plan-date">' + esc(formatDate(when)) + "</span>" : "") +
      "</span>" +
      '<span class="saved-plan-chev">' + icons.chevron + "</span>" +
    "</button>";
  }

  on(view, "click", function(e){
    const perBtn = e.target.closest("[data-period]");
    if (perBtn) {
      period = perBtn.getAttribute("data-period");
      Array.prototype.forEach.call(view.querySelectorAll("[data-period]"), function(b){ b.setAttribute("aria-pressed", b === perBtn ? "true" : "false"); });
      return;
    }
    const moodBtn = e.target.closest("[data-mood]");
    if (moodBtn) {
      mood = moodBtn.getAttribute("data-mood");
      Array.prototype.forEach.call(view.querySelectorAll("[data-mood]"), function(b){
        b.setAttribute("aria-pressed", b === moodBtn ? "true" : "false");
      });
      return;
    }
    if (e.target.closest("[data-error-area-go]")) {
      const input = errSlot.querySelector("[data-error-area]");
      const value = input ? input.value.trim() : "";
      if (!value) { if (input) input.focus(); return; }
      if (areaInput) areaInput.value = value;
      api("/api/me", { method: "PATCH", body: { area: value } })
        .then(function(d){ if (d && d.user) state.user = d.user; })
        .catch(function(){});
      submitPlan();
    }
  });
  if (form) form.addEventListener("submit", function(e){ e.preventDefault(); submitPlan(); });
  bindRetries({ plan: submitPlan, saved: loadSaved });
  loadSaved();
}

/* ---------------------------------------------------------------------------
   Plan result (screen 9)
   --------------------------------------------------------------------------- */
function renderPlanResult(id){
  const token = beginView();
  setShell({ title: "Plan", tabs: true, active: "plan" });
  view.className = "view";
  const ac = abortable();
  const planId = String(id == null ? "" : id);
  let currentPlan = null;
  let busyAction = false;

  const cached = getCachedPlan(planId);
  if (cached) paint(cached);
  else {
    view.innerHTML = '<div class="skeleton sk-detail"></div><div class="skeleton sk-detail"></div>';
    loadRemote();
  }

  async function loadRemote(){
    try {
      const data = await api("/api/plan/" + encodeURIComponent(planId), { signal: ac.signal });
      const plan = data && (data.plan || data);
      if (!plan || !plan.id) throw new Error("no plan");
      cachePlan(plan);
      if (isCurrent(token)) paint(plan);
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      if (e.status === 404) {
        view.innerHTML = '<div class="missing-plan">' +
          emptyBlock("This plan is not there.", "It may have been deleted, or the link is old.", '<button class="btn btn-sm" type="button" data-nav="#/plan">Plan an afternoon</button>') +
        "</div>";
      } else {
        view.innerHTML = errorBlock("That plan did not load. Check your connection, then try again.", "plan");
        bindRetries({ plan: loadRemote });
      }
    }
  }

  function stopEvidenceHTML(kind, label, text, isRead, seeds){
    if (!text) return "";
    const tags = Array.isArray(seeds) ? seeds.filter(Boolean).slice(0, 3) : [];
    return '<div class="ev-row">' +
      '<span class="ev-label ' + kind + '">' + esc(label) + "</span>" +
      '<p class="ev-text' + (isRead ? " read" : "") + '">' + esc(text) + "</p>" +
      (tags.length ? '<div class="ev-seeds">' + tags.map(function(v, k){ return seedHTML({ name: v, type: "vibe" }, "sm" + (k < 2 ? " s" + (k + 1) : "")); }).join("") + "</div>" : "") +
    "</div>";
  }
  function sourcesHTML(stop){
    const src = Array.isArray(stop && stop.sources) ? stop.sources.filter(function(x){ return x && x.name; }) : [];
    if (!src.length) return stopEvidenceHTML("notes", "From your notes", stop && stop.from_notes, false);
    return '<div class="ev-row"><span class="ev-label notes">From your notes</span>' +
      '<div class="trace-list">' + src.map(function(x){
        const when = x.at ? new Date(Number(x.at)).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
        return '<button type="button" class="trace ' + typeClass(x.type) + '" data-nav="#/cards/' + attr(x.card_id) + '">' +
          (x.image ? '<img class="trace-img" src="' + attr(x.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '<span class="trace-img ph"></span>') +
          '<span class="trace-body"><span class="trace-name">' + esc(x.name) + (x.n > 1 ? ' <i>×' + esc(String(x.n)) + "</i>" : "") + "</span>" +
          (x.quote ? '<span class="trace-quote">&ldquo;' + esc(x.quote) + "&rdquo;</span>" : "") +
          (when ? '<span class="trace-at">' + esc(when) + "</span>" : "") + "</span></button>";
      }).join("") + "</div></div>";
  }
  function stopHTML(stop, i, all){
    const mapUrl = safeHttpUrl(stop && stop.map_url);
    const opsText = (stop && stop.ops) || "Hours not checked";
    const place = stop && (stop.neighborhood || stop.address) || "";
    const link = i > 0 && stop && stop.distance ? '<div class="stop-connector" aria-label="' + attr(stop.distance) + '">' + esc(String(stop.distance).replace(/ from stop \d+/, "")) + "</div>" : "";
    return link + '<section class="stop">' +
      '<div class="stop-head">' +
        '<span class="stop-index num">' + (i + 1) + "</span>" +
        '<div class="stop-main">' +
          (stop && stop.arrive ? '<p class="stop-time">' + esc(stop.arrive) + (stop.stay_min ? " &middot; " + esc(String(stop.stay_min)) + " min" : "") + "</p>" : "") +
          '<h3 class="stop-name">' + esc((stop && stop.name) || "Somewhere") + "</h3>" +
          '<p class="stop-where">' + esc([stop && stop.kind, place].filter(Boolean).join(" · ")) + "</p>" +
        "</div>" +
      "</div>" +
      '<div class="evidence">' +
        sourcesHTML(stop) +
        stopEvidenceHTML("qloo", "From Qloo", stop && stop.from_qloo, false, stop && stop.vibes) +
        stopEvidenceHTML("read", "Sparkling's read", stop && stop.read, true) +
      "</div>" +
      '<div class="stop-ops">' +
        "<span>" + esc(opsText) + "</span>" +
        (mapUrl ? '<span class="sep" aria-hidden="true">&middot;</span><a href="' + attr(mapUrl) + '" target="_blank" rel="noopener">Open map</a>' : "") +
        '<span class="sep" aria-hidden="true">&middot;</span><button type="button" data-swap="' + i + '"' + (busyAction ? " disabled" : "") + ">Swap</button>" +
      "</div>" +
    "</section>";
  }
  function routeMapHTML(stops){
    const pts = stops.map(function(s){ return s && s.coords && isFinite(s.coords.lat) && isFinite(s.coords.lon) ? s.coords : null; });
    if (pts.some(function(x){ return !x; }) || pts.length < 2) return "";
    const lat0 = pts.reduce(function(a, p){ return a + p.lat; }, 0) / pts.length;
    const kx = Math.cos(lat0 * Math.PI / 180);
    const xs = pts.map(function(p){ return p.lon * kx; }), ys = pts.map(function(p){ return -p.lat; });
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs), minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    const W = 350, H = 150, pad = 28;
    const sc = Math.min((W - 2 * pad) / Math.max(maxX - minX, 1e-6), (H - 2 * pad) / Math.max(maxY - minY, 1e-6));
    const ox = (W - sc * (maxX - minX)) / 2, oy = (H - sc * (maxY - minY)) / 2;
    const P = pts.map(function(_, i){ return [ox + sc * (xs[i] - minX), oy + sc * (ys[i] - minY)]; });
    let grid = "";
    for (let g = 1; g < 7; g++) grid += '<line x1="' + (g * W / 7) + '" y1="0" x2="' + (g * W / 7) + '" y2="' + H + '"/>';
    for (let g = 1; g < 4; g++) grid += '<line x1="0" y1="' + (g * H / 4) + '" x2="' + W + '" y2="' + (g * H / 4) + '"/>';
    return '<figure class="route-map" role="img" aria-label="Route between the stops, schematic">' +
      '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet"><g class="rm-grid">' + grid + "</g>" +
      '<polyline class="rm-path" points="' + P.map(function(q){ return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ") + '"/>' +
      P.map(function(q, i){ return '<g class="rm-pin"><circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="12"/><text x="' + q[0].toFixed(1) + '" y="' + (q[1] + 4.5).toFixed(1) + '" text-anchor="middle">' + (i + 1) + "</text></g>"; }).join("") +
      "</svg><figcaption>Schematic route &middot; not to scale</figcaption></figure>";
  }
  function planSummary(stops){
    if (!stops.length) return "";
    const first = stops[0] && stops[0].arrive, last = stops[stops.length - 1] && stops[stops.length - 1].leave;
    return first && last ? first + " to " + last : "";
  }
  function paint(plan){
    if (!isCurrent(token)) return;
    currentPlan = plan;
    const stops = Array.isArray(plan.stops) ? plan.stops : [];
    const saved = !!plan.saved;
    view.innerHTML =
      '<h2 class="plan-header">' + esc(plan.header || "Your plan") + "</h2>" +
      '<p class="plan-meta">' + esc([stops.length + " " + plural(stops.length, "stop", "stops"), planSummary(stops), saved ? "Saved" : ""].filter(Boolean).join(" · ")) + "</p>" +
      (plan.notice ? '<p class="plan-notice" role="note">' + esc(plan.notice) + "</p>" : "") +
      routeMapHTML(stops) +
      stops.map(function(st, i){ return stopHTML(st, i, stops); }).join("") +
      '<div class="plan-actions">' +
        '<button class="btn" type="button" data-action="shorten"' + (stops.length <= 1 || busyAction ? " disabled" : "") + ">Shorten</button>" +
        '<button class="btn" type="button" data-action="budget"' + (busyAction ? " disabled" : "") + ">Lower budget</button>" +
        '<button class="btn btn-primary" type="button" data-action="save"' + (saved || busyAction ? " disabled" : "") + ">" + (saved ? "Saved" : "Save") + "</button>" +
      "</div>" +
      (Array.isArray(plan.log) && plan.log.length ?
        '<details class="how"><summary>How this was made</summary><ul class="how-list">' +
          plan.log.map(function(l){ return "<li>" + esc(l) + "</li>"; }).join("") +
        "</ul>" + receiptHTML(plan.receipt) + "</details>" : "");
  }
  function receiptHTML(r){
    if (!r) return "";
    const seeds = Array.isArray(r.seeds) ? r.seeds : [];
    const qs = Array.isArray(r.queries) ? r.queries : [];
    return '<div class="receipt"><p class="receipt-title">Receipt</p>' +
      '<p class="receipt-line"><span>Seeds sent to Qloo</span> ' + seeds.map(function(x){ return esc(x.name) + ' <code>' + esc(String(x.qloo_id || "").slice(0, 8)) + '</code>'; }).join(", ") + "</p>" +
      qs.map(function(q){ return '<p class="receipt-line"><code>GET ' + esc(q.endpoint) + "</code> type place · tag " + esc(q["filter.tags"] || "none") + " · near " + esc(q["filter.location.query"] || "") + " · " + esc(String(q.returned)) + " back</p>"; }).join("") +
      '<p class="receipt-line muted">' + esc(r.sent_to_qloo || "") + "</p></div>";
  }
  function setActionBusy(b){
    Array.prototype.forEach.call(view.querySelectorAll("[data-action], [data-swap]"), function(el){
      el.disabled = b ||
        (el.getAttribute("data-action") === "shorten" && currentPlan && Array.isArray(currentPlan.stops) && currentPlan.stops.length <= 1) ||
        (el.getAttribute("data-action") === "save" && currentPlan && currentPlan.saved);
    });
  }
  async function runPlanAction(action, extraBody){
    if (busyAction) return;
    busyAction = true;
    setActionBusy(true);
    try {
      const data = await api("/api/plan/" + encodeURIComponent(planId) + "/" + action, { method: "POST", body: extraBody || {}, signal: ac.signal });
      let fresh = data && data.plan;
      if (action === "save" && !fresh && currentPlan) {
        fresh = currentPlan;
        fresh.saved = true;
      }
      if (fresh && fresh.id) {
        if (action === "save") fresh.saved = true;
        cachePlan(fresh);
        paint(fresh);
      }
      if (action === "save") {
        const stops = currentPlan && Array.isArray(currentPlan.stops) ? currentPlan.stops : [];
        if (stops.length && stops[0] && stops[0].name) {
          writeDidYouGo({ plan_id: fresh && fresh.id ? fresh.id : planId, place: String(stops[0].name) });
        }
      }
      if (data && data.notice) toast(data.notice);
      else if (action === "save") toast("Plan saved.");
      else if (action === "swap") {
        const idx = (extraBody && extraBody.index) || 0;
        toast("Swapped stop " + (idx + 1) + ".");
        const el = view.querySelectorAll(".stop")[idx];
        if (el) { el.classList.add("just-swapped"); setTimeout(function(){ el.classList.remove("just-swapped"); }, 1600); }
      } else if (action === "shorten") toast("Shortened.");
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      toast((e && e.message) || "That did not work. Try again.");
    } finally {
      busyAction = false;
      if (isCurrent(token)) setActionBusy(false);
    }
  }
  function openBudgetSheet(){
    const current = numberValue(state.user && state.user.budget) || 40;
    const sheet = openSheet({
      title: "Lower the budget",
      body:
        '<form data-budget-form>' +
          '<div class="sheet-field"><label for="budgetCap">New budget cap</label>' +
          '<input id="budgetCap" type="number" inputmode="numeric" min="1" step="1" value="' + attr(current) + '" data-autofocus></div>' +
          '<p class="inline-error" data-budget-error role="alert" hidden></p>' +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Re-rank stops</button></div>' +
        "</form>",
    });
    const formEl = sheet.querySelector("[data-budget-form]");
    const input = sheet.querySelector("#budgetCap");
    const err = sheet.querySelector("[data-budget-error]");
    formEl.addEventListener("submit", async function(e){
      e.preventDefault();
      const n = numberValue(input.value);
      if (!n || n < 1) {
        err.textContent = "A number above zero is all it needs.";
        err.hidden = false;
        if (input) input.focus();
        return;
      }
      err.hidden = true;
      const submitBtn = formEl.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        const data = await api("/api/plan/" + encodeURIComponent(planId) + "/budget", { method: "POST", body: { budget: n } });
        closeModal();
        const fresh = data && data.plan;
        if (fresh && fresh.id) { cachePlan(fresh); paint(fresh); }
        if (data && data.notice) toast(data.notice);
      } catch (e2) {
        err.textContent = (e2 && e2.message) || "That did not work. Try again.";
        err.hidden = false;
        submitBtn.disabled = false;
      }
    });
  }

  on(view, "click", function(e){
    const swapBtn = e.target.closest("[data-swap]");
    if (swapBtn) {
      runPlanAction("swap", { index: Number(swapBtn.getAttribute("data-swap")) || 0 });
      return;
    }
    const actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    const action = actionBtn.getAttribute("data-action");
    if (action === "shorten") runPlanAction("shorten");
    else if (action === "save") runPlanAction("save");
    else if (action === "budget") openBudgetSheet();
  });
}

/* iOS-like edge swipe back for settings sub-pages */
function wireSwipeBack(parent){
  let sx = null, sy = 0, dx = 0;
  on(view, "touchstart", function(e){
    const tch = e.touches[0];
    if (tch.clientX - frame.getBoundingClientRect().left > 28) { sx = null; return; }
    sx = tch.clientX; sy = tch.clientY; dx = 0;
  }, { passive: true });
  on(view, "touchmove", function(e){
    if (sx === null) return;
    const tch = e.touches[0];
    dx = tch.clientX - sx;
    if (Math.abs(tch.clientY - sy) > Math.abs(dx)) { sx = null; view.style.transform = ""; return; }
    if (dx > 0) view.style.transform = "translateX(" + Math.min(dx, 300) + "px)";
  }, { passive: true });
  on(view, "touchend", function(){
    if (sx === null) return;
    view.style.transform = "";
    if (dx > 90) go(parent);
    sx = null;
  });
}

  const COMMON = "precision mediump float;uniform vec2 uR;uniform float uT;uniform vec2 uP;uniform float uE;uniform float uK;" +
    "uniform vec3 cPaper,cSage,cSageI,cClay,cClayI,cButter,cButterI,cCard;" +
    "float bl(vec2 u,vec2 c,float r){vec2 d=u-c;return exp(-dot(d,d)/(r*r));}";
  /* liquid: three drifting colour pools + one that trails the finger, inside a slowly warped field */
  const LIQUID = COMMON + "void main(){vec2 uv=gl_FragCoord.xy/uR;float a=uR.x/uR.y;vec2 p=vec2(uv.x*a,uv.y);float t=uT;" +
    "vec2 w=p+.07*vec2(sin(p.y*3.1+t*.33),cos(p.x*2.6-t*.29))+.025*vec2(sin(p.y*7.3+t*.7),cos(p.x*6.1-t*.55));" +
    "vec3 sage=mix(cSage,cSageI,.34),clay=mix(cClay,cClayI,.2),butter=mix(cButter,cButterI,.08);" +
    "vec3 c=cPaper;" +
    "c=mix(c,sage,.9*bl(w,vec2(a*(.18+.1*sin(t*.21)),.78+.09*cos(t*.17)),.55));" +
    "c=mix(c,butter,.85*bl(w,vec2(a*(.86+.08*cos(t*.19)),.42+.12*sin(t*.23)),.5));" +
    "c=mix(c,clay,.8*bl(w,vec2(a*(.5+.2*sin(t*.13+1.)),.06+.08*cos(t*.27)),.48));" +
    "vec2 cp=vec2(uP.x*a,uP.y);vec3 warm=mix(mix(cClay,cClayI,.34),butter,.3);c=mix(c,warm,(.74+.2*uE)*bl(w,cp,(.4+.1*uE)*uK));c=mix(c,mix(cCard,vec3(1.),.4),.5*bl(w,cp+vec2(-.05,.06)*uK,.16*uK));" +
    "c=mix(c,clay,.35*uE*bl(w,cp+vec2(.12,-.08),.18));" +
    "gl_FragColor=vec4(c,1.);}";
  /* paper strata: five cut sheets stepping down to the lower right, soft shadow under each, light rim on the cut */
  const PAPER = COMMON + "vec2 rot(vec2 p,float a){float s=sin(a),c=cos(a);return vec2(p.x*c-p.y*s,p.x*s+p.y*c);}" +
    "void main(){vec2 uv=gl_FragCoord.xy/uR;float a=uR.x/uR.y;vec2 p=rot((uv-vec2(.5))*vec2(a,1.)*2.,-.42);float t=uT*.32;" +
    "vec3 pal[5];pal[0]=mix(cPaper,cSage,.65);pal[1]=mix(cPaper,cButter,.85);pal[2]=mix(cSage,cSageI,.1);pal[3]=mix(cPaper,cClay,.9);pal[4]=mix(cClay,cClayI,.12);" +
    "vec3 c=cPaper;" +
    "for(int i=0;i<5;i++){float f=float(i);float base=-.12-f*.22;" +
    "float wv=sin(p.x*1.7+t*.9+f*.85)*.1+cos(p.x*3.3-t*.7+f*1.2)*.03+sin(p.x*.8+t*.45)*.05;" +
    "float d=(base+wv)-p.y;" +
    "float sh=smoothstep(-.16,0.,d)*(1.-step(0.,d));c=mix(c,c*vec3(.84,.81,.76),sh*.42);" +
    "vec3 lc=pal[i];lc=mix(lc,lc*.96,clamp(d*.5,0.,1.));lc+=vec3(.16)*smoothstep(.02,.002,d)*smoothstep(-.004,.002,d);" +
    "c=mix(c,lc,smoothstep(-.004,.004,d));}" +
    "gl_FragColor=vec4(c,1.);}";

  const live = new Set();
  function mount(host, kind){
    if (!host || host.querySelector(":scope > .fx-bg")) return;
    host.classList.add("fx-host");
    const bg = document.createElement("div");
    bg.className = "fx-bg"; bg.setAttribute("aria-hidden", "true");
    host.insertBefore(bg, host.firstChild);
    const canvas = document.createElement("canvas");
    let gl = null;
    try { gl = canvas.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: "low-power" }); } catch (_) {}
    if (!gl) { bg.classList.add("fx-static"); return; }
    function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; }
    const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, kind === "paper" ? PAPER : LIQUID);
    if (!vs || !fs) { bg.classList.add("fx-static"); return; }
    const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { bg.classList.add("fx-static"); return; }
    gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {}; ["uR", "uT", "uP", "uE", "uK", "cPaper", "cSage", "cSageI", "cClay", "cClayI", "cButter", "cButterI", "cCard"].forEach(function(n){ U[n] = gl.getUniformLocation(pr, n); });
    function colours(){ const c = palette(); gl.uniform3fv(U.cPaper, c.paper); gl.uniform3fv(U.cSage, c.sage); gl.uniform3fv(U.cSageI, c.sageInk); gl.uniform3fv(U.cClay, c.clay); gl.uniform3fv(U.cClayI, c.clayInk); gl.uniform3fv(U.cButter, c.butter); gl.uniform3fv(U.cButterI, c.butterInk); gl.uniform3fv(U.cCard, c.card); }
    colours();
    bg.appendChild(canvas);
    const scale = kind === "paper" ? Math.min(devicePixelRatio || 1, 1.5) : 0.5; /* liquid is pure blur: half-res is free quality */
    function size(){ const r = bg.getBoundingClientRect(); const w = Math.max(2, Math.round(r.width * scale)), h = Math.max(2, Math.round(r.height * scale)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); gl.uniform2f(U.uR, w, h); gl.uniform1f(U.uK, Math.max(.35, Math.min(1, 190 / Math.max(1, r.height)))); } }
    size();
    /* pointer: spring-follow (low stiffness, light damping = liquid lag) */
    const st = { x: .62, y: .45, vx: 0, vy: 0, tx: .62, ty: .45, e: 0, touched: 0, visible: true, raf: 0, t0: performance.now(), last: performance.now() };
    function onMove(e){ const r = bg.getBoundingClientRect(); if (!r.width) return; st.tx = (e.clientX - r.left) / r.width; st.ty = 1 - (e.clientY - r.top) / r.height; st.touched = performance.now(); }
    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerdown", onMove, { passive: true });
    const io = "IntersectionObserver" in window ? new IntersectionObserver(function(en){ st.visible = en[0].isIntersecting; if (st.visible) kick(); }, { threshold: 0 }) : null;
    if (io) io.observe(bg);
    function draw(now){
      const dt = Math.min(.05, (now - st.last) / 1000); st.last = now;
      const t = (now - st.t0) / 1000;
      if (now - st.touched > 2600) { st.tx = .55 + .3 * Math.sin(t * .23); st.ty = .5 + .25 * Math.cos(t * .31); }
      const k = 46, d = 10; /* stiffness, damping */
      st.vx += ((st.tx - st.x) * k - st.vx * d) * dt; st.vy += ((st.ty - st.y) * k - st.vy * d) * dt;
      st.x += st.vx * dt; st.y += st.vy * dt;
      st.e += (Math.min(1, Math.hypot(st.vx, st.vy) * .9) - st.e) * Math.min(1, dt * 4);
      gl.uniform1f(U.uT, t + 7); gl.uniform2f(U.uP, st.x, st.y); gl.uniform1f(U.uE, st.e);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function frame(now){
      st.raf = 0;
      if (!bg.isConnected) return destroy();
      if (!st.visible || document.hidden) return;
      size(); draw(now);
      st.raf = requestAnimationFrame(frame);
    }
    function kick(){ if (reduced()) { size(); draw(st.t0 + 4000); return; } if (!st.raf) { st.last = performance.now(); st.raf = requestAnimationFrame(frame); } }
    function destroy(){
      live.delete(inst);
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerdown", onMove);
      if (io) io.disconnect(); if (st.raf) cancelAnimationFrame(st.raf);
      const lose = gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
    }
    const inst = { kick: kick, destroy: destroy, host: host, colours: function(){ colours(); kick(); } };
    live.add(inst);
    kick();
  }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) live.forEach(function(i){ i.kick(); }); });
  Fx.mount = mount;
  Fx.recolour = function(){ live.forEach(function(i){ i.colours(); }); };

  /* ---- word reveal (CJK: per character) ---- */
  function reveal(el, perChar){
    if (!el || el.dataset.fxRv) return;
    el.dataset.fxRv = "1";
    if (reduced()) return;
    const label = el.textContent;
    let i = 0;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node){
      const parts = node.nodeValue.match(/[\u3000-\u9fff\uff00-\uffef]|[^\s\u3000-\u9fff\uff00-\uffef]+|\s+/g) || [];
      const frag = document.createDocumentFragment();
      parts.forEach(function(tok){
        if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
        const pieces = perChar && !/[\u3000-\u9fff]/.test(tok) ? Array.from(tok) : [tok];
        const outer = document.createElement("span"); outer.className = "fx-w"; outer.setAttribute("aria-hidden", "true");
        pieces.forEach(function(ch){ const s = document.createElement("span"); s.className = "fx-wi"; s.style.setProperty("--i", i++); s.textContent = ch; if (perChar) { const w = document.createElement("span"); w.className = "fx-w"; w.appendChild(s); outer.appendChild(w); } else outer.appendChild(s); });
        if (perChar) outer.className = "fx-word"; /* keep a word unbreakable */
        frag.appendChild(outer);
      });
      node.parentNode.replaceChild(frag, node);
    });
    el.classList.add(perChar ? "fx-rv-c" : "fx-rv");
    el.setAttribute("translate", "no");
    el.setAttribute("aria-label", label);
  }
  Fx.reveal = reveal;

  /* ---- orb markup ---- */
  Fx.orb = function(size){ return '<span class="fx-orb"' + (size ? ' style="--s:' + size + 'px"' : "") + ' aria-hidden="true"><i></i></span>'; };

  /* ---- scan: enhance whatever the router just rendered ---- */
  function scan(){
    const view = document.getElementById("view");
    if (!view) return;
    const onb = view.querySelector(".onboard:not(.onboard-import)");
    if (onb) { onb.classList.add("fx-fade"); mount(onb, "liquid"); reveal(onb.querySelector(".onboard-headline")); }
    const g = view.querySelector("[data-greeting]");
    if (g) {
      g.classList.add("fx-greet", "fx-fade"); mount(g, "liquid");
      const h = g.querySelector(".greeting"); if (h) reveal(h);
    }
    const th = view.querySelector("[data-threads]");
    if (th) {
      const head = view.querySelector(".cards-head"); if (head) { head.classList.add("fx-paper"); mount(head, "paper"); }
      view.querySelectorAll(".thread-title").forEach(function(t){ reveal(t); });
    }
    const ph = view.querySelector(":scope > .plan-header");
    if (ph) {
      const wrap = document.createElement("div"); wrap.className = "fx-paper";
      ph.parentNode.insertBefore(wrap, ph); wrap.appendChild(ph);
      const meta = wrap.nextElementSibling; if (meta && meta.classList.contains("plan-meta")) wrap.appendChild(meta);
      mount(wrap, "paper"); reveal(ph);
    } else { const p2 = view.querySelector(".fx-paper > .plan-header"); if (p2) reveal(p2); }
    const dt = view.querySelector(".detail-title"); if (dt) reveal(dt, true);
    const pp = view.querySelector(".plan-prompt"); if (pp) reveal(pp);
    view.querySelectorAll(".log-panel .live-dot").forEach(function(d){ const o = document.createElement("span"); o.innerHTML = Fx.orb(34); d.replaceWith(o.firstChild); const s = view.querySelector(".log-panel .log-status"); if (s) s.classList.add("fx-shine"); });
    view.querySelectorAll(".inbox-card:not([data-fx-sw])").forEach(swipe);
    if (pendingEnter && view.querySelector(".detail-title")) { pendingEnter = false; view.classList.add("fx-enter"); setTimeout(function(){ view.classList.remove("fx-enter"); }, 900); }
  }
  let scanQueued = false;
  function queue(){ if (scanQueued) return; scanQueued = true; requestAnimationFrame(function(){ scanQueued = false; try { scan(); } catch (e) { console.warn("fx", e); } }); }
  Fx.scan = queue;

  /* ---- morphing tab blob: left/right edges on separate springs (leading edge quicker) = liquid stretch ---- */
  function tabBlob(){
    const tabs = document.getElementById("tabs"); if (!tabs) return;
    const blob = document.createElement("span"); blob.className = "fx-blob"; blob.setAttribute("aria-hidden", "true");
    tabs.insertBefore(blob, tabs.firstChild);
    const s = { l: 0, r: 0, vl: 0, vr: 0, tl: 0, tr: 0, raf: 0, last: 0, placed: false };
    function target(){
      const a = tabs.querySelector('.tab[aria-current="page"]');
      if (!a || tabs.hidden) { blob.style.opacity = "0"; return; }
      blob.style.opacity = "1";
      const tr = tabs.getBoundingClientRect(), r = a.getBoundingClientRect();
      if (!r.width) return;
      s.tl = r.left - tr.left; s.tr = r.right - tr.left;
      if (!s.placed || reduced()) { s.l = s.tl; s.r = s.tr; s.vl = s.vr = 0; s.placed = true; paint(); return; }
      if (!s.raf) { s.last = performance.now(); s.raf = requestAnimationFrame(step); }
    }
    function paint(){
      const w = s.r - s.l, v = Math.abs(s.vl) + Math.abs(s.vr);
      const sq = Math.min(.14, v / 9000);
      blob.style.width = w + "px";
      blob.style.transform = "translateX(" + s.l + "px) scaleY(" + (1 - sq) + ")";
    }
    function step(now){
      const dt = Math.min(.032, (now - s.last) / 1000); s.last = now;
      const right = s.tl > s.l; /* moving right: right edge leads */
      const kL = right ? 260 : 520, kR = right ? 520 : 260, d = 28;
      s.vl += ((s.tl - s.l) * kL - s.vl * d) * dt; s.vr += ((s.tr - s.r) * kR - s.vr * d) * dt;
      s.l += s.vl * dt; s.r += s.vr * dt;
      paint();
      if (Math.abs(s.tl - s.l) + Math.abs(s.tr - s.r) + Math.abs(s.vl) + Math.abs(s.vr) > .5) s.raf = requestAnimationFrame(step);
      else { s.raf = 0; s.l = s.tl; s.r = s.tr; paint(); }
    }
    new MutationObserver(function(){ requestAnimationFrame(target); }).observe(tabs, { attributes: true, subtree: true, attributeFilter: ["aria-current", "hidden"] });
    window.addEventListener("resize", function(){ s.placed = false; target(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ s.placed = false; target(); });
    target();
    Fx.tabTarget = target;
  }

  /* ---- inbox deck: drag right = keep, left = not a thing ---- */
  function swipe(card){
    card.dataset.fxSw = "1";
    const stack = card.parentNode;
    if (stack && stack.classList.contains("inbox-stack") && !stack.querySelector(".fx-peek")) {
      stack.classList.add("fx-deck");
      const left = Number(stack.getAttribute("data-left") || 2);
      if (left > 1) { const p = document.createElement("div"); p.className = "fx-peek p1"; stack.appendChild(p); }
      if (left > 2) { const p = document.createElement("div"); p.className = "fx-peek p2"; stack.appendChild(p); }
    }
    const yesS = document.createElement("span"); yesS.className = "fx-stamp yes"; yesS.textContent = (window.t ? window.t("Keep") : "Keep");
    const noS = document.createElement("span"); noS.className = "fx-stamp no"; noS.textContent = (window.t ? window.t("Not a thing") : "Not a thing");
    card.appendChild(yesS); card.appendChild(noS);
    let st = null;
    card.addEventListener("pointerdown", function(e){
      if (e.target.closest("button,a,input")) return;
      st = { x: e.clientX, y: e.clientY, id: e.pointerId, dx: 0, drag: false };
    });
    card.addEventListener("pointermove", function(e){
      if (!st || e.pointerId !== st.id) return;
      const dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (!st.drag) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { st.drag = true; try { card.setPointerCapture(e.pointerId); } catch (_) {} card.style.transition = "none"; } else if (Math.abs(dy) > 12) { st = null; return; } else return; }
      st.dx = dx;
      card.style.transform = "translateX(" + dx + "px) rotate(" + dx / 22 + "deg)";
      yesS.style.opacity = Math.max(0, Math.min(1, dx / 90)); noS.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    function end(){
      if (!st) return; const dx = st.dx, drag = st.drag; st = null;
      if (!drag) return;
      const yes = card.querySelector("[data-inbox-yes]"), no = card.querySelector("[data-inbox-no]");
      const btn = dx > 96 ? yes : dx < -96 ? no : null;
      if (btn && !btn.disabled) {
        card.style.transition = "transform .32s cubic-bezier(.4,0,.2,1), opacity .32s";
        card.style.transform = "translateX(" + (dx > 0 ? 1 : -1) * innerWidth * 1.1 + "px) rotate(" + (dx > 0 ? 18 : -18) + "deg)"; card.style.opacity = "0";
        setTimeout(function(){ btn.click(); }, 260);
      } else {
        card.style.transition = "transform .5s cubic-bezier(.34,1.56,.64,1)"; card.style.transform = ""; yesS.style.opacity = 0; noS.style.opacity = 0;
      }
    }
    card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
  }

  /* ---- card tile -> detail: the tile lifts and grows into the detail hero, content rises in ---- */
  let pendingEnter = false;
  document.addEventListener("click", function(e){
    const tile = e.target.closest(".card-tile[data-nav]");
    if (!tile || reduced()) return;
    const r = tile.getBoundingClientRect();
    const ghost = tile.cloneNode(true); ghost.className += " fx-ghost"; ghost.removeAttribute("data-nav");
    Object.assign(ghost.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    document.body.appendChild(ghost);
    const vw = Math.min(innerWidth, 480), pad = 20, x0 = (innerWidth - vw) / 2 + pad;
    const top = document.getElementById("chrome") ? document.getElementById("chrome").getBoundingClientRect().bottom + 12 : 80;
    const W = vw - pad * 2;
    const anim = ghost.animate([
      { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", transform: "perspective(900px) rotateY(0) scale(1)", borderRadius: "18px", opacity: 1 },
      { transform: "perspective(900px) rotateY(-8deg) scale(1.03)", offset: .35 },
      { left: x0 + "px", top: top + "px", width: W + "px", height: Math.round(W * .8) + "px", transform: "perspective(900px) rotateY(0) scale(1)", borderRadius: "20px", opacity: 1 }
    ], { duration: 460, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
    pendingEnter = true;
    anim.onfinish = function(){ ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: "forwards" }).onfinish = function(){ ghost.remove(); }; };
    setTimeout(function(){ if (ghost.isConnected) ghost.remove(); }, 1600);
  }, true);

  /* ---- slide to confirm ---- */
  Fx.slideHTML = function(label){
    return '<div class="fx-slide" data-fx-slide><div class="fx-slide-fill"></div><span class="fx-slide-label">' + label + '</span>' +
      '<button class="fx-slide-knob" type="button" aria-label="' + label + '"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>';
  };
  Fx.wireSlide = function(root, onDone){
    const el = root.querySelector("[data-fx-slide]"); if (!el) return;
    const knob = el.querySelector(".fx-slide-knob"), fill = el.querySelector(".fx-slide-fill"), label = el.querySelector(".fx-slide-label");
    let st = null, done = false;
    function max(){ return el.clientWidth - knob.offsetWidth - 8; }
    function set(x){ knob.style.transform = "translateX(" + x + "px)"; fill.style.width = (x + 56) + "px"; label.style.opacity = String(1 - Math.min(1, x / max()) * .8); }
    function finish(){ done = true; el.classList.add("fx-done"); set(max()); label.style.opacity = "1"; if (navigator.vibrate) try { navigator.vibrate(12); } catch (_) {} onDone(function(){ done = false; el.classList.remove("fx-done"); el.classList.add("fx-back"); set(0); setTimeout(function(){ el.classList.remove("fx-back"); }, 500); }, label); }
    knob.addEventListener("pointerdown", function(e){ if (done) return; st = { x: e.clientX }; el.classList.remove("fx-back"); try { knob.setPointerCapture(e.pointerId); } catch (_) {} });
    knob.addEventListener("pointermove", function(e){ if (!st) return; set(Math.max(0, Math.min(max(), e.clientX - st.x))); });
    function up(e){ if (!st) return; const x = Math.max(0, Math.min(max(), e.clientX - st.x)); st = null; if (x > max() * .82) finish(); else { el.classList.add("fx-back"); set(0); } }
    knob.addEventListener("pointerup", up); knob.addEventListener("pointercancel", up);
    knob.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && !done) { e.preventDefault(); finish(); } });
  };

  function boot(){
    const view = document.getElementById("view");
    if (view) new MutationObserver(queue).observe(view, { childList: true, subtree: true });
    tabBlob();
    if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ setTimeout(Fx.recolour, 50); });
    new MutationObserver(function(){ setTimeout(Fx.recolour, 30); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-appearance", "class", "data-theme"] });
    queue();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
