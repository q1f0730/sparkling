name: Android (debug APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["platforms/android/**", "platforms/package*.json", "platforms/capacitor.config.json", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platforms } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sparkling-android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
