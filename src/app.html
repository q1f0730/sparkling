    listEl.innerHTML = '<div class="skeleton sk-note"></div><div class="skeleton sk-note"></div><div class="skeleton sk-note"></div>';
  }
  function setListError(){
    if (!listEl) return;
    listEl.removeAttribute("aria-busy");
    listEl.innerHTML = errorBlock("Your notes did not load. Check your connection, then try again.", initialRetry ? "initial" : "notes");
  }
  function paintGreeting(){
    const slot = view.querySelector("[data-greeting]");
    if (!slot) return;
    const text = greetingText(greetingNotes, greetingCards);
    slot.innerHTML = '<h2 class="greeting">' + esc(text) + "</h2>";
  }
  function emptyStateHTML(){
    if (query) {
      return '<div class="state">' +
        '<p class="state-copy">No notes mention that yet.</p>' +
        '<div class="state-actions"><button class="btn btn-sm" type="button" data-clear-search>Clear search</button></div>' +
      "</div>";
    }
    if (filter !== "all") {
      return '<div class="state">' +
        '<p class="state-copy">No notes under this filter yet.</p>' +
        '<div class="state-actions"><button class="btn btn-sm" type="button" data-show-all>Show all notes</button></div>' +
      "</div>";
    }
    return '<div class="state"><p class="state-copy">Nothing here yet. Write one line about something you watched, heard, read or visited. Sparkling will take it from there.</p></div>';
  }
  function paintTimeline(enterId){
    if (!listEl) return;
    listEl.removeAttribute("aria-busy");
    if (!notes.length) { listEl.innerHTML = emptyStateHTML(); return; }
    const ordered = notes.slice().sort(function(a, b){ return (Number(b.created_at) || 0) - (Number(a.created_at) || 0); });
    const groups = new Map();
    ordered.forEach(function(n){
      const day = startOfDay(n.created_at);
      const key = Number.isFinite(day) ? String(day) : "earlier";
      if (!groups.has(key)) groups.set(key, { label: Number.isFinite(day) ? formatDayLabel(n.created_at) : "Earlier", items: [] });
      groups.get(key).items.push(n);
    });
    let html = "";
    groups.forEach(function(group){
      html += '<section class="day-group"><h2 class="day-label">' + esc(group.label) + "</h2>" +
        group.items.map(function(n){ return noteHTML(n, { enter: String(n.id) === String(enterId) }); }).join("") +
      "</section>";
    });
    listEl.innerHTML = html;
  }
  function paintDidYouGo(){
    const slot = view.querySelector("[data-didyougo]");
    if (!slot) return;
    const rec = readDidYouGo();
    if (!rec) { slot.innerHTML = ""; return; }
    slot.innerHTML = '<div class="didyougo">' +
      '<p class="didyougo-q">Did you go to ' + esc(rec.place) + "?</p>" +
      '<div class="didyougo-actions">' +
        '<button class="btn btn-sm" type="button" data-dyg-yes>Yes, add a line</button>' +
        '<button class="btn btn-sm btn-ghost" type="button" data-dyg-no>Didn\'t go</button>' +
        '<span class="spacer"></span>' +
        '<button class="dismiss-btn" type="button" data-dyg-dismiss aria-label="Dismiss">' + icons.close + "</button>" +
      "</div>" +
      '<p class="inline-error" data-dyg-error role="alert" hidden></p>' +
    "</div>";
  }

  async function loadInitial(){
    const seq = ++loadSeq;
    initialRetry = true;
    if (listEl) {
      listEl.setAttribute("aria-busy", "true");
      listEl.innerHTML = '<div class="skeleton sk-note"></div><div class="skeleton sk-note"></div><div class="skeleton sk-note"></div>';
    }
    let nres;
    let cres;
    try {
      const results = await Promise.allSettled([
        api("/api/notes?filter=all", { signal: ac.signal }),
        api("/api/cards?type=all", { signal: ac.signal }),
      ]);
      nres = results[0];
      cres = results[1];
    } catch (e) { return; }
    if (!isCurrent(token) || seq !== loadSeq) return;
    if (nres && nres.status === "fulfilled") {
      const data = nres.value || {};
      notes = Array.isArray(data.notes) ? data.notes : [];
      baseCount = notes.length;
      greetingNotes = notes;
      initialRetry = false;
    } else {
      notes = [];
      greetingNotes = null;
    }
    if (cres && cres.status === "fulfilled") {
      const data = cres.value || {};
      greetingCards = Array.isArray(data.cards) ? data.cards : [];
    } else {
      greetingCards = null;
    }
    paintGreeting();
    if (nres && nres.status === "fulfilled") paintTimeline();
    else setListError();
  }

  async function loadNotes(opts){
    const silent = !!(opts && opts.silent);
    const seq = ++loadSeq;
    initialRetry = false;
    if (!silent) setListLoading();
    const params = new URLSearchParams();
    params.set("filter", filter);
    if (query.trim()) params.set("q", query.trim());
    try {
      const data = await api("/api/notes?" + params.toString(), { signal: ac.signal });
      if (!isCurrent(token) || seq !== loadSeq) return;
      notes = Array.isArray(data && data.notes) ? data.notes : [];
      if (filter === "all" && !query.trim()) baseCount = notes.length;
      paintTimeline();
    } catch (e) {
      if (!isCurrent(token) || seq !== loadSeq || isAbort(e)) return;
      if (silent) toast("Your notes did not refresh.");
      else setListError();
    }
  }

  function applyFilterReset(){
    filter = "all";
    query = "";
    if (searchInput) searchInput.value = "";
    setFilterUI();
  }

  async function pollNote(note){
    if (!note || !note.id) return;
    const id = String(note.id);
    const deadline = Date.now() + 20000;
    while (isCurrent(token) && Date.now() < deadline) {
      try { await sleep(1500, ac.signal); } catch (e) { return; }
      if (!isCurrent(token)) return;
      try {
        const data = await api("/api/notes/" + encodeURIComponent(id), { signal: ac.signal });
        const fresh = data && data.note;
        if (!fresh) return;
        const idx = notes.findIndex(function(n){ return String(n.id) === id; });
        if (idx >= 0) notes[idx] = fresh;
        if (fresh.status !== "pending") {
          replaceNoteInDom(id, fresh, { draw: true, plus: true });
          refreshMe();
          return;
        }
      } catch (e) {
        if (isAbort(e)) return;
        if (e.status === 404) return;
      }
    }
  }

  async function saveNote(){
    if (saving) return;
    let raw = ta ? ta.value : "";
    let rawLink = link;
    const justUrl = urlOnly(raw);
    if (justUrl && !rawLink) {
      rawLink = justUrl;
      raw = "";
      link = justUrl;
      paintLinkChip();
      if (ta) ta.value = "";
      resizeTextarea();
      persistDraft();
    }
    const text = raw.trim();
    if (!text && !rawLink) {
      showSaveError("A line or a link is all it needs.");
      if (ta) ta.focus();
      return;
    }
    let payloadText = text;
    if (rawLink) {
      if (!payloadText) payloadText = rawLink;
      else if (payloadText.indexOf(rawLink) < 0) payloadText = payloadText + "\n" + rawLink;
    }
    saving = true;
    showSaveError("");
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "Saving"; }
    const body = { text: payloadText };
    if (rawLink) body.link = rawLink;
    try {
      const data = await api("/api/notes", { method: "POST", body: body, signal: ac.signal });
      const note = data && data.note;
      if (!note) throw new Error("The note did not come back.");
      if (!isCurrent(token)) return;
      if (ta) { ta.value = ""; ta.style.height = ""; }
      link = "";
      paintLinkChip();
      clearDraft();
      resizeTextarea();
      if (filter !== "all" || query) {
        applyFilterReset();
        notes = [note];
        baseCount = baseCount === null ? 1 : baseCount + 1;
        paintTimeline(note.id);
        loadNotes({ silent: true });
      } else {
        notes = [note].concat(notes.filter(function(n){ return String(n.id) !== String(note.id); }));
        baseCount = baseCount === null ? 1 : baseCount + 1;
        paintTimeline(note.id);
      }
      pollNote(note);
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      showSaveError("That did not save. Your draft is still here.");
    } finally {
      if (isCurrent(token)) {
        saving = false;
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save"; }
      }
    }
  }

  function openLinkDialog(){
    const sheet = openSheet({
      title: "Add a link",
      body:
        '<form data-link-form>' +
          '<div class="sheet-field"><label for="linkUrl">Link</label><input id="linkUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://" value="' + attr(link || "") + '" data-autofocus></div>' +
          '<p class="inline-error" data-link-error role="alert" hidden></p>' +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Add link</button></div>' +
        "</form>",
    });
    const form = sheet.querySelector("[data-link-form]");
    const input = sheet.querySelector("#linkUrl");
    const err = sheet.querySelector("[data-link-error]");
    form.addEventListener("submit", function(e){
      e.preventDefault();
      const v = input.value.trim();
      const safe = safeHttpUrl(v);
      if (!safe) {
        err.textContent = "A link starts with http:// or https://.";
        err.hidden = false;
        input.focus();
        return;
      }
      link = safe;
      paintLinkChip();
      persistDraft();
      closeModal();
      if (ta) ta.focus();
      resizeTextarea();
    });
  }

  function openEditNote(note){
    const sheet = openSheet({
      title: "Edit note",
      body:
        '<form data-edit-form>' +
          '<div class="sheet-field"><label for="editNoteText">Note</label><textarea id="editNoteText" data-edit-text data-autofocus>' + esc(note.text || "") + "</textarea></div>" +
          '<p class="inline-error" data-edit-error role="alert" hidden></p>' +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save note</button></div>' +
        "</form>",
    });
    const form = sheet.querySelector("[data-edit-form]");
    const area = sheet.querySelector("[data-edit-text]");
    const err = sheet.querySelector("[data-edit-error]");
    const save = sheet.querySelector('button[type="submit"]');
    form.addEventListener("submit", async function(e){
      e.preventDefault();
      const value = area.value.trim();
      if (!value) { err.textContent = "A note needs a line."; err.hidden = false; area.focus(); return; }
      err.hidden = true;
      save.disabled = true;
      const old = save.textContent;
      save.textContent = "Saving";
      try {
        const data = await api("/api/notes/" + encodeURIComponent(note.id), { method: "PATCH", body: { text: value } });
        const fresh = data && data.note;
        if (!fresh) throw new Error("no note");
        const idx = notes.findIndex(function(n){ return String(n.id) === String(note.id); });
        if (idx >= 0) notes[idx] = fresh;
        closeModal();
        replaceNoteInDom(note.id, fresh, {});
        pollNote(fresh);
      } catch (e) {
        err.textContent = "That did not save. Try again.";
        err.hidden = false;
        save.disabled = false;
        save.textContent = old;
      }
    });
  }

  function openDeleteNote(note){
    confirmSheet({
      title: "Delete this note?",
      copy: "The note and what it added will be removed. This cannot be undone.",
      confirmLabel: "Delete note",
      busyLabel: "Deleting",
      danger: true,
      onConfirm: async function(){
        await api("/api/notes/" + encodeURIComponent(note.id), { method: "DELETE" });
        notes = notes.filter(function(n){ return String(n.id) !== String(note.id); });
        if (baseCount !== null && baseCount > 0) baseCount -= 1;
        paintTimeline();
        toast("Note deleted.");
        refreshMe();
      },
    });
  }

  function openNoteMenu(note){
    if (!note) return;
    const sheet = openMenu("Note", [
      { key: "edit", label: "Edit note" },
      { key: "delete", label: "Delete note", sub: "This cannot be undone.", danger: true },
    ]);
    Array.prototype.forEach.call(sheet.querySelectorAll("[data-menu]"), function(item){
      item.addEventListener("click", function(){
        const key = item.getAttribute("data-menu");
        closeModal();
        if (key === "edit") openEditNote(note);
        else if (key === "delete") openDeleteNote(note);
      });
    });
  }

  async function didYouGoAction(went){
    const rec = readDidYouGo();
    if (!rec) { paintDidYouGo(); return; }
    const wrap = view.querySelector(".didyougo");
    const err = view.querySelector("[data-dyg-error]");
    const buttons = wrap ? wrap.querySelectorAll("button") : [];
    Array.prototype.forEach.call(buttons, function(b){ b.disabled = true; });
    if (err) { err.hidden = true; err.textContent = ""; }
    try {
      await api("/api/plan/" + encodeURIComponent(rec.plan_id) + "/went", { method: "POST", body: { went: went } });
      if (!isCurrent(token)) return;
      clearDidYouGo();
      paintDidYouGo();
      if (went) {
        if (ta) {
          ta.value = "Went to " + String(rec.place) + ". ";
          link = "";
          paintLinkChip();
          resizeTextarea();
          persistDraft();
          ta.focus();
        }
        toast("Noted. A line when you are ready.");
      } else {
        toast("Noted.");
      }
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      if (err) { err.textContent = "That did not save. Try again."; err.hidden = false; }
      Array.prototype.forEach.call(buttons, function(b){ b.disabled = false; });
    }
  }

  // Composer setup
  if (ta) {
    ta.value = initialText;
    ta.addEventListener("input", function(){
      persistDraft();
      resizeTextarea();
    });
    ta.addEventListener("paste", function(e){
      const cb = e.clipboardData;
      if (!cb) return;
      const pasted = cb.getData("text");
      const justUrl = urlOnly(pasted);
      if (!justUrl) return;
      e.preventDefault();
      link = justUrl;
      paintLinkChip();
      persistDraft();
    });
    ta.addEventListener("keydown", function(e){
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        saveNote();
      }
    });
    resizeTextarea();
    if (state.focusComposer) {
      state.focusComposer = false;
      setTimeout(function(){ try { ta.focus(); } catch (_) {} }, 30);
    }
  }
  const composer = view.querySelector("[data-composer]");
  if (composer) composer.addEventListener("submit", function(e){ e.preventDefault(); saveNote(); });
  paintLinkChip();
  paintDidYouGo();

  const prompts = [
    "What stayed with you today?",
    "Something you watched, heard, read or found?",
    "Paste a link or drop a screenshot.",
  ];
  let promptIndex = 0;
  const promptTimer = setInterval(function(){
    if (!ta || ta.value.trim()) return;
    promptIndex = (promptIndex + 1) % prompts.length;
    ta.placeholder = prompts[promptIndex];
  }, 5200);
  onCleanup(function(){ clearInterval(promptTimer); });
  onCleanup(function(){ clearTimeout(searchTimer); });

  // Template bindings
  const searchClose = view.querySelector("[data-search-close]");
  function setSearchOpen(open){
    searchOpen = !!open;
    if (searchToggle) searchToggle.setAttribute("aria-expanded", searchOpen ? "true" : "false");
    if (searchRow) searchRow.hidden = !searchOpen;
    if (searchOpen && searchInput) setTimeout(function(){ try { searchInput.focus(); } catch (_) {} }, 20);
  }
  function clearSearch(){
    const had = !!query;
    query = "";
    if (searchInput) searchInput.value = "";
    clearTimeout(searchTimer);
    if (had) loadNotes();
  }
  on(view, "click", function(e){
    const filterBtn = e.target.closest("[data-filter]");
    if (filterBtn) {
      const next = filterBtn.getAttribute("data-filter");
      if (!next || next === filter) return;
      filter = next;
      if (searchInput) query = searchInput.value.trim();
      setFilterUI();
      loadNotes();
      return;
    }
    if (e.target.closest("[data-search-toggle]")) {
      if (searchOpen) { setSearchOpen(false); clearSearch(); }
      else setSearchOpen(true);
      return;
    }
    if (e.target.closest("[data-search-close]")) { setSearchOpen(false); clearSearch(); return; }
    if (e.target.closest("[data-clear-search]")) { setSearchOpen(true); clearSearch(); return; }
    if (e.target.closest("[data-show-all]")) {
      filter = "all";
      setFilterUI();
      loadNotes();
      return;
    }
    if (e.target.closest("[data-open-camera]")) {
      persistDraft();
      go("#/camera");
      return;
    }
    if (e.target.closest("[data-open-link]")) { openLinkDialog(); return; }
    if (e.target.closest("[data-link-remove]")) {
      link = "";
      paintLinkChip();
      persistDraft();
      return;
    }
    const menuBtn = e.target.closest("[data-note-menu]");
    if (menuBtn) {
      const id = menuBtn.getAttribute("data-note-menu");
      const note = notes.find(function(n){ return String(n.id) === String(id); });
      if (note) openNoteMenu(note);
      return;
    }
    if (e.target.closest("[data-dyg-yes]")) { didYouGoAction(true); return; }
    if (e.target.closest("[data-dyg-no]")) { didYouGoAction(false); return; }
    if (e.target.closest("[data-dyg-dismiss]")) {
      clearDidYouGo();
      paintDidYouGo();
      return;
    }
  });
  if (searchClose) searchClose.addEventListener("click", function(){ setSearchOpen(false); clearSearch(); });
  if (searchInput) {
    searchInput.addEventListener("input", function(){
      clearTimeout(searchTimer);
      const value = searchInput.value;
      searchTimer = setTimeout(function(){
        if (!isCurrent(token)) return;
        query = value.trim();
        loadNotes();
      }, 320);
    });
    searchInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(searchTimer);
        query = searchInput.value.trim();
        loadNotes();
      }
      if (e.key === "Escape") {
        setSearchOpen(false);
        clearSearch();
      }
    });
  }

  // Long press a note to open its menu.
  let pressTimer = null;
  let pressStart = null;
  function clearPress(){ if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } pressStart = null; }
  on(view, "pointerdown", function(e){
    if (pressTimer) clearPress();
    const noteEl = e.target.closest(".note");
    if (!noteEl) return;
    if (e.target.closest("button,a,textarea,input,img")) return;
    const id = noteEl.getAttribute("data-note-id");
    pressStart = { x: e.clientX, y: e.clientY };
    pressTimer = setTimeout(function(){
      pressTimer = null;
      const note = notes.find(function(n){ return String(n.id) === String(id); });
      if (note) openNoteMenu(note);
    }, 540);
  });
  on(view, "pointerup", clearPress);
  on(view, "pointercancel", clearPress);
  on(view, "pointermove", function(e){
    if (!pressStart) return;
    if (Math.abs(e.clientX - pressStart.x) > 8 || Math.abs(e.clientY - pressStart.y) > 8) clearPress();
  });

  bindRetries({
    initial: loadInitial,
    notes: loadNotes,
  });

  loadInitial();
}

/* ---------------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------------- */
async function boot(){
  setShell({ hide: true });
  view.className = "view onboarding";
  view.innerHTML =
    '<div class="onboard">' +
      '<div class="onboard-top">' +
        '<span class="wordmark"><span class="wordmark-name">Sparkling</span><span class="wordmark-dots" aria-hidden="true"><span class="wordmark-dot"></span><span class="wordmark-dot"></span><span class="wordmark-dot"></span></span></span>' +
      "</div>" +
      '<p class="onboard-status" role="status">Opening your notebook.</p>' +
    "</div>";
  try {
    const me = await api("/api/me");
    if (!me || !me.user) {
      const err = new Error("no session");
      err.status = 401;
      throw err;
    }
    state.user = me.user;
    state.inboxCount = Number(me.inbox_count) || 0;
    state.bootError = null;
    state.bootNotice = null;
    syncPrefsFromServer();
    if (me.did_you_go && me.did_you_go.plan_id && me.did_you_go.place) {
      writeDidYouGo({
        plan_id: String(me.did_you_go.plan_id),
        place: String(me.did_you_go.place),
        label: String(me.did_you_go.label || "your plan"),
      });
    } else {
      clearDidYouGo();
    }
  } catch (e) {
    if (e && e.status === 401) {
      state.user = null;
      state.bootError = null;
    } else {
      state.bootError = "Your notebook could not be reached just now. Try again in a moment.";
    }
  } finally {
    state.booted = true;
    route();
  }
}

/* ---------------------------------------------------------------------------
   Camera
   --------------------------------------------------------------------------- */
function renderCamera(){
  const token = beginView();
  setShell({ title: "Photo", back: "#/notes", tabs: false });

  view.innerHTML =
    '<div class="screen-head"><p class="sub">A photo joins your notes. Sparkling reads any text in it, then looks for something it recognises.</p></div>' +
    '<div class="camera-sheet">' +
      '<div class="cam-frame" data-cam-frame></div>' +
      '<div class="filmstrip" data-cam-strip hidden></div>' +
      '<div class="cam-controls">' +
        '<button class="btn btn-sm" type="button" data-cam-take>' + icons.camera + "Take a photo</button>" +
        '<button class="btn btn-sm" type="button" data-cam-choose>' + icons.photo + "Choose from library</button>" +
        '<button class="text-btn" type="button" data-cam-remove hidden>Remove photo</button>' +
      "</div>" +
      '<input class="file-input-hidden" type="file" accept="image/*" capture="environment" data-cam-take-input tabindex="-1" aria-hidden="true">' +
      '<input class="file-input-hidden" type="file" accept="image/*" multiple data-cam-choose-input tabindex="-1" aria-hidden="true">' +
      '<p class="cam-fallback" data-cam-fallback>If your camera does not open, choose a photo from your library instead.</p>' +
      '<div class="cam-caption"><textarea data-cam-caption rows="2" maxlength="1000" placeholder="Add a few words, or just save" aria-label="Add a few words, or just save"></textarea></div>' +
      '<p class="inline-error" data-cam-error role="alert" hidden></p>' +
      '<div class="cam-save-row">' +
        '<button class="btn btn-primary" type="button" data-cam-save disabled>Save photo</button>' +
        '<span class="tiny" data-cam-count>No photo chosen</span>' +
      "</div>" +
    "</div>" +
    '<div data-cam-saved></div>';

  const frameEl = view.querySelector("[data-cam-frame]");
  const stripEl = view.querySelector("[data-cam-strip]");
  const captionEl = view.querySelector("[data-cam-caption]");
  const saveBtn = view.querySelector("[data-cam-save]");
  const countEl = view.querySelector("[data-cam-count]");
  const removeBtn = view.querySelector("[data-cam-remove]");
  const errorEl = view.querySelector("[data-cam-error]");
  const fallbackEl = view.querySelector("[data-cam-fallback]");
  const savedEl = view.querySelector("[data-cam-saved]");
  const takeInput = view.querySelector("[data-cam-take-input]");
  const chooseInput = view.querySelector("[data-cam-choose-input]");

  let selected = [];
  let current = 0;
  let saved = [];
  let nextKey = 1;
  const urls = [];

  function emptyFrameHTML(){
    return '<div class="cam-empty">' + icons.camera + "<p>Add a photo of a page, a poster, a screen or a place.</p></div>";
  }
  function showError(msg){
    if (!errorEl) return;
    errorEl.textContent = msg || "";
    errorEl.hidden = !msg;
  }
  function isImageFile(file){
    if (!file) return false;
    if (file.type && file.type.indexOf("image/") === 0) return true;
    return /\.(jpe?g|png|webp|gif|heic|heif|avif|bmp)$/i.test(file.name || "");
  }
  function paintFrame(){
    if (!frameEl) return;
    if (!selected.length) {
      frameEl.innerHTML = emptyFrameHTML();
      current = 0;
    } else {
      if (current < 0) current = 0;
      if (current >= selected.length) current = selected.length - 1;
      const item = selected[current];
      frameEl.innerHTML = '<img class="cam-preview" src="' + attr(item.url) + '" alt="Photo ready to save">';
    }
    if (removeBtn) {
      removeBtn.hidden = !selected.length;
      removeBtn.textContent = selected.length > 1 ? "Remove this photo" : "Remove photo";
    }
    if (saveBtn) {
      saveBtn.disabled = !selected.length;
      saveBtn.textContent = selected.length > 1 ? "Save " + selected.length + " photos" : "Save photo";
    }
    if (countEl) {
      countEl.textContent = !selected.length
        ? "No photo chosen"
        : selected.length + " " + plural(selected.length, "photo", "photos");
    }
    if (stripEl) {
      stripEl.hidden = selected.length < 2;
      stripEl.innerHTML = selected.length > 1
        ? selected.map(function(item, i){
            return '<img class="strip-img" src="' + attr(item.url) + '" alt="Photo ' + (i + 1) + '" data-cam-pick="' + i + '" role="button" tabindex="0" aria-label="Show photo ' + (i + 1) + '">';
          }).join("")
        : "";
    }
  }
  function addFiles(fileList){
    const files = fileList ? Array.prototype.slice.call(fileList) : [];
    if (!files.length) return;
    let problem = "";
    let added = 0;
    files.forEach(function(file){
      if (!isImageFile(file)) { problem = "Only image files can be added."; return; }
      if (file.size > 8 * 1024 * 1024) { problem = "One photo was larger than 8 MB, so it stayed out."; return; }
      const url = URL.createObjectURL(file);
      urls.push(url);
      selected.push({ key: nextKey++, file: file, url: url });
      added += 1;
    });
    if (added) current = selected.length - 1;
    showError(problem);
    paintFrame();
  }
  function removeCurrent(){
    if (!selected.length) return;
    selected.splice(current, 1);
    if (current >= selected.length) current = selected.length - 1;
    if (current < 0) current = 0;
    showError("");
    paintFrame();
  }

  function sourceRowHTML(item){
    const card = item.card;
    const thumb =
      '<div class="cam-thumb-wrap ' + (card ? typeClass(card.type) : "") + '">' +
        '<img class="cam-thumb" src="' + attr(item.url) + '" alt="Photo saved to your notes" loading="lazy">' +
        (item.state === "reading" ? '<span class="scan" aria-hidden="true"></span>' : "") +
        (card ? '<span class="corner-tab" aria-hidden="true"></span>' : "") +
      "</div>";
    let body = "";
    if (item.state === "uploading") {
      body = '<p class="cam-state-title">Saving the photo.</p><p class="cam-state-copy">It will join your notes in a moment.</p>';
    } else if (item.state === "reading") {
      body = '<p class="cam-state-title">Saved to your notes.</p><p class="cam-state-copy">reading the text...</p>';
    } else if (item.state === "failed") {
      body = '<p class="cam-state-title">That photo did not go through.</p>' +
        '<p class="cam-state-copy">' + esc(item.error || "Check your connection, then try again.") + "</p>" +
        '<div class="cam-actions-end"><button class="btn btn-sm" type="button" data-cam-retry="' + attr(item.key) + '">Try again</button></div>';
    } else if (item.state === "timeout") {
      body = '<p class="cam-state-title">Saved to your notes.</p>' +
        '<p class="cam-state-copy">Sparkling is still reading in the background. The card will appear when it is ready.</p>' +
        '<div class="cam-actions-end"><button class="btn btn-sm" type="button" data-nav="#/notes">See notes</button></div>';
    } else if (card) {
      body = '<p class="cam-state-title">Saved. This looks like</p>' +
        '<p class="cam-match-name">' + esc(card.name) + "</p>" +
        '<p class="cam-match-type">' + esc(cardContext(card)) + "</p>" +
        '<div class="cam-actions-end">' +
          '<button class="btn btn-sm" type="button" data-nav="#/cards/' + encodeURIComponent(card.id) + '">Open card</button>' +
          '<button class="btn btn-sm btn-ghost" type="button" data-nav="#/notes">See notes</button>' +
        "</div>";
    } else if (item.cardId) {
      body = '<p class="cam-state-title">Saved to your notes.</p><p class="cam-state-copy">A card was made from this photo.</p>' +
        '<div class="cam-actions-end">' +
          '<button class="btn btn-sm" type="button" data-nav="#/cards/' + encodeURIComponent(item.cardId) + '">Open card</button>' +
          '<button class="btn btn-sm btn-ghost" type="button" data-nav="#/notes">See notes</button>' +
        "</div>";
    } else if (item.readFailed) {
      body = '<p class="cam-state-title">Saved to your notes.</p>' +
        '<p class="cam-state-copy">Recognition did not finish this time. The photo and your words are safe in Notes.</p>' +
        '<div class="cam-actions-end"><button class="btn btn-sm" type="button" data-nav="#/notes">See notes</button></div>';
    } else {
      body = '<p class="cam-state-title">Saved to your notes.</p>' +
        '<p class="cam-state-copy">No card this time. The photo and your words are safe in Notes.</p>' +
        '<div class="cam-actions-end"><button class="btn btn-sm" type="button" data-nav="#/notes">See notes</button></div>';
    }
    return '<div class="cam-saved" data-cam-saved-key="' + attr(item.key) + '">' + thumb + '<div class="cam-state">' + body + "</div></div>";
  }
  function paintSaved(){
    if (!savedEl) return;
    savedEl.innerHTML = saved.map(sourceRowHTML).join("");
  }

  async function settleItem(item, note){
    if (!isCurrent(token)) return;
    item.noteId = note.id;
    if (note.status === "failed") {
      item.state = "done";
      item.readFailed = true;
      paintSaved();
      return;
    }
    const matched = (Array.isArray(note.mentions) ? note.mentions : []).filter(function(m){
      return m && m.state === "matched" && m.card_id != null;
    });
    if (matched.length) {
      item.cardId = matched[0].card_id;
      try {
        const data = await api("/api/cards/" + encodeURIComponent(matched[0].card_id));
        if (!isCurrent(token)) return;
        if (data && data.card) item.card = data.card;
      } catch (_) {}
    }
    if (!isCurrent(token)) return;
    item.state = "done";
    paintSaved();
    refreshMe();
  }

  async function trackItem(item){
    const deadline = Date.now() + 30000;
    while (isCurrent(token) && Date.now() < deadline) {
      await sleep(1600);
      if (!isCurrent(token) || !item.noteId) return;
      try {
        const data = await api("/api/notes/" + encodeURIComponent(item.noteId));
        if (!isCurrent(token)) return;
        const note = data && data.note;
        if (!note) return;
        if (note.status === "pending") continue;
        await settleItem(item, note);
        return;
      } catch (e) {
        if (!isCurrent(token) || (e && e.status === 401)) return;
        if (e && e.status === 404) {
          item.state = "timeout";
          paintSaved();
          return;
        }
      }
    }
    if (!isCurrent(token)) return;
    item.state = "timeout";
    paintSaved();
  }

  async function uploadItem(item){
    if (!isCurrent(token)) return;
    item.state = "uploading";
    item.error = "";
    paintSaved();
    try {
      const fd = new FormData();
      fd.append("file", item.file, item.file.name || "photo.jpg");
      fd.append("caption", item.caption || "");
      const data = await api("/api/notes/photo", { method: "POST", body: fd });
      if (!isCurrent(token)) return;
      if (data && data.error) throw new Error(data.error);
      const note = data && data.note;
      if (!note || !note.id) throw new Error("The note did not come back.");
      item.noteId = note.id;
      if (note.status === "pending") {
        item.state = "reading";
        paintSaved();
        await trackItem(item);
      } else {
        await settleItem(item, note);
      }
    } catch (e) {
      if (!isCurrent(token)) return;
      item.state = "failed";
      if (e && (e.status === 413 || (e.status === 400 && /large|8 MB/i.test(e.message || "")))) {
        item.error = "That photo is too large. Keep it under 8 MB.";
      } else if (e && e.status === 401) {
        item.error = "Your session ended. Open the notebook again to save this photo.";
      } else {
        item.error = "Check your connection, then try again.";
      }
      paintSaved();
    }
  }

  async function runBatch(list){
    for (let i = 0; i < list.length; i++) {
      if (!isCurrent(token)) break;
      await uploadItem(list[i]);
    }
    if (!isCurrent(token)) return;
    refreshMe();
    const bad = list.filter(function(item){ return item.state === "failed"; }).length;
    if (bad) {
      showError(bad + " " + plural(bad, "photo", "photos") + " did not go through. Try again below.");
    } else {
      showError("");
      toast("Saved to your notes.");
    }
  }

  function startSave(){
    if (!selected.length) return;
    const caption = captionEl ? captionEl.value.trim() : "";
    const batch = selected.map(function(entry){ return { entry: entry, caption: caption }; });
    selected = [];
    current = 0;
    if (captionEl) captionEl.value = "";
    paintFrame();
    showError("");
    const created = batch.map(function(pair){
      return {
        key: pair.entry.key,
        file: pair.entry.file,
        url: pair.entry.url,
        caption: pair.caption,
        state: "uploading",
        error: "",
        noteId: null,
        cardId: null,
        card: null,
        readFailed: false,
      };
    });
    saved = created.concat(saved);
    paintSaved();
    runBatch(created);
  }

  paintFrame();

  on(view, "click", function(e){
    if (e.target.closest("[data-cam-take]")) { if (takeInput) takeInput.click(); return; }
    if (e.target.closest("[data-cam-choose]")) { if (chooseInput) chooseInput.click(); return; }
    if (e.target.closest("[data-cam-remove]")) { removeCurrent(); return; }
    if (e.target.closest("[data-cam-save]")) { startSave(); return; }
  });
  on(takeInput, "change", function(){
    addFiles(takeInput.files);
    takeInput.value = "";
  });
  on(chooseInput, "change", function(){
    addFiles(chooseInput.files);
    chooseInput.value = "";
  });
  on(stripEl, "click", function(e){
    const pick = e.target.closest("[data-cam-pick]");
    if (!pick) return;
    const index = Number(pick.getAttribute("data-cam-pick"));
    if (!Number.isFinite(index)) return;
    current = clamp(index, 0, Math.max(0, selected.length - 1));
    paintFrame();
  });
  on(stripEl, "keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    const pick = e.target.closest("[data-cam-pick]");
    if (!pick) return;
    e.preventDefault();
    const index = Number(pick.getAttribute("data-cam-pick"));
    if (!Number.isFinite(index)) return;
    current = clamp(index, 0, Math.max(0, selected.length - 1));
    paintFrame();
  });
  on(savedEl, "click", function(e){
    const retry = e.target.closest("[data-cam-retry]");
    if (!retry) return;
    const key = retry.getAttribute("data-cam-retry");
    const item = saved.find(function(x){ return String(x.key) === String(key); });
    if (!item || item.state !== "failed") return;
    showError("");
    uploadItem(item).then(function(){
      if (!isCurrent(token)) return;
      if (item.state !== "failed") toast("Saved to your notes.");
      const bad = saved.filter(function(x){ return x.state === "failed"; }).length;
      if (!bad) showError("");
    });
  });

  if (navigator.permissions && navigator.permissions.query) {
    try {
      navigator.permissions.query({ name: "camera" }).then(function(status){
        if (!isCurrent(token) || !fallbackEl) return;
        function apply(){
          if (status.state === "granted") {
            fallbackEl.hidden = true;
          } else if (status.state === "denied") {
            fallbackEl.hidden = false;
            fallbackEl.textContent = "Camera access is off for this site. You can still choose a photo from your library.";
          } else {
            fallbackEl.hidden = false;
            fallbackEl.textContent = "If your camera does not open, choose a photo from your library instead.";
          }
        }
        apply();
        if (typeof status.addEventListener === "function") {
          status.addEventListener("change", apply);
          onCleanup(function(){ try { status.removeEventListener("change", apply); } catch (_) {} });
        }
      }).catch(function(){});
    } catch (_) {}
  }

  onCleanup(function(){
    urls.forEach(function(url){ try { URL.revokeObjectURL(url); } catch (_) {} });
  });
}

/* ---------------------------------------------------------------------------
   Cards
   --------------------------------------------------------------------------- */
function renderCards(){
  const token = beginView();
  setShell({ title: "Cards", tabs: true, active: "cards" });
  const ac = abortable();

  const FILTERS = [
    ["all", "All"],
    ["film", "Film & TV"],
    ["music", "Music"],
    ["book", "Books"],
    ["place", "Places"],
    ["other", "More"],
  ];

  view.innerHTML =
    '<div class="cards-head">' +
      '<div class="segmented" role="group" aria-label="Cards view">' +
        '<button class="seg-btn" type="button" aria-pressed="true">Wall</button>' +
        '<button class="seg-btn" type="button" aria-pressed="false" data-nav="#/threads">Threads</button>' +
      "</div>" +
    "</div>" +
    '<div class="filters"><div class="chips-scroll" data-type-chips>' +
      FILTERS.map(function(pair, index){
        return '<button class="chip" type="button" data-cards-type="' + attr(pair[0]) + '" aria-pressed="' + (index === 0 ? "true" : "false") + '">' + esc(pair[1]) + "</button>";
      }).join("") +
    "</div></div>" +
    '<div data-wall>' + cardSkeletonHTML() + "</div>";

  const wallEl = view.querySelector("[data-wall]");
  let filter = "all";
  let cards = [];
  let loadSeq = 0;

  function paintChips(){
    Array.prototype.forEach.call(view.querySelectorAll("[data-cards-type]"), function(button){
      button.setAttribute("aria-pressed", button.getAttribute("data-cards-type") === filter ? "true" : "false");
    });
  }
  function hideBrokenImages(container){
    Array.prototype.forEach.call(container.querySelectorAll("img"), function(img){
      function hide(){ img.hidden = true; }
      img.addEventListener("error", hide);
      if (img.complete && img.naturalWidth === 0) hide();
    });
  }
  function emptyHTML(){
    if (filter !== "all") {
      return emptyBlock("", "No cards under this filter yet.", '<button class="btn btn-sm" type="button" data-show-all-cards>Show all cards</button>');
    }
    return emptyBlock(
      "No cards yet.",
      "Cards appear when your notes mention something Sparkling can recognise. Your notes are all still here.",
      '<button class="btn btn-sm" type="button" data-nav="#/notes">Write a note</button>'
    );
  }
  function tileHTML(card){
    const size = sizeOf(card.size);
    const type = typeOf(card.type);
    const name = String(card.name || "Untitled");
    const image = imgSrc(card.image);
    const heart = Number(card.heart) || 0;
    const count = Number(card.footprints) || 0;
    const face = image
      ? '<span class="card-face image-face">' +
          '<span class="cover-fallback"><span class="face-title">' + esc(name) + "</span></span>" +
          '<img src="' + attr(image) + '" alt="" loading="lazy">' +
        "</span>"
      : '<span class="card-face typographic-face"><span class="face-title">' + esc(name) + "</span></span>";
    const marker = heart === 1
      ? '<span class="card-heart" aria-hidden="true">' + icons.heart + "</span>"
      : heart === -1
        ? '<span class="notme">Not for me</span>'
        : "";
    const label = [name, cardContext(card)];
    if (count) label.push(count + " " + plural(count, "footprint", "footprints"));
    if (heart === 1) label.push("Loved");
    if (heart === -1) label.push("Not for me");
    return '<button class="card-tile size-' + size + " " + typeClass(type) + (heart === -1 ? " is-out" : "") + '" type="button" data-nav="#/cards/' + encodeURIComponent(card.id) + '" aria-label="' + attr(label.filter(Boolean).join(". ")) + '">' +
      '<span class="type-bar"></span>' +
      face +
      '<span class="card-body">' +
        (image ? '<span class="card-name">' + esc(name) + "</span>" : "") +
        '<span class="card-context">' + esc(cardContext(card)) + "</span>" +
        '<span class="card-meta">' + footprintsDots(count) + '<span class="spacer"></span>' + marker + "</span>" +
      "</span>" +
    "</button>";
  }
  function wallHTML(list){
    if (list.length === 1) {
      return '<div class="wall single"><div class="wall-col">' + tileHTML(list[0]) + "</div></div>" +
        '<p class="single-hint">' + esc(filter === "all"
          ? "Mention it again sometime and it will remember."
          : "The only card under this filter so far.") + "</p>";
    }
    const columns = [[], []];
    const weight = [0, 0];
    list.forEach(function(card){
      const size = sizeOf(card.size);
      const w = size === 3 ? 2.6 : size === 2 ? 1.8 : 1;
      const index = weight[0] <= weight[1] ? 0 : 1;
      columns[index].push(card);
      weight[index] += w;
    });
    return '<div class="wall">' + columns.map(function(col){
      return '<div class="wall-col">' + col.map(tileHTML).join("") + "</div>";
    }).join("") + "</div>";
  }
  function paintWall(){
    if (!wallEl) return;
    wallEl.removeAttribute("aria-busy");
    if (!cards.length) {
      wallEl.innerHTML = emptyHTML();
      return;
    }
    wallEl.innerHTML = wallHTML(cards);
    hideBrokenImages(wallEl);
  }
  async function load(){
    const seq = ++loadSeq;
    if (wallEl) {
      wallEl.setAttribute("aria-busy", "true");
      wallEl.innerHTML = cardSkeletonHTML();
    }
    try {
      const data = await api("/api/cards?type=" + encodeURIComponent(filter), { signal: ac.signal });
      if (!isCurrent(token) || seq !== loadSeq) return;
      cards = Array.isArray(data && data.cards) ? data.cards : [];
      paintWall();
    } catch (e) {
      if (!isCurrent(token) || seq !== loadSeq || isAbort(e)) return;
      if (!wallEl) return;
      wallEl.removeAttribute("aria-busy");
      wallEl.innerHTML = errorBlock("Your cards did not load. Check your connection, then try again.", "cards");
    }
  }

  on(view, "click", function(e){
    const chip = e.target.closest("[data-cards-type]");
    if (chip) {
      const next = chip.getAttribute("data-cards-type") || "all";
      if (next === filter) return;
      filter = next;
      paintChips();
      load();
      return;
    }
    if (e.target.closest("[data-show-all-cards]")) {
      if (filter !== "all") {
        filter = "all";
        paintChips();
        load();
      }
    }
  });
  bindRetries({ cards: load });
  load();
}

/* ---------------------------------------------------------------------------
   Card detail
   --------------------------------------------------------------------------- */
function renderCardDetail(id){
  const token = beginView();
  setShell({ title: "Card", back: state.lastMain || "#/cards", tabs: false });
  const ac = abortable();

  let card = null;
  let footprints = [];
  let viewChanged = null;
  let qlooTags = [];
  let photos = [];
  let reactionBusy = false;
  let reactionError = "";
  let loadSeq = 0;
  let swipeStart = null;

  const KIND_LABELS = {
    note: "Note",
    rewatch: "Rewatch",
    first_watch: "First watch",
    listen: "Listen",
    read: "Read",
    visit: "Visit",
    quote: "Quote",
    screenshot: "Screenshot",
    link: "Link",
  };
  function kindLabel(kind){ return KIND_LABELS[kind] || "Note"; }
  function sourceLabel(fp){
    if (fp.source === "imported" || fp.source === "imported_pref") return { label: "Imported", title: "From your Letterboxd export" };
    if (fp.source === "seed") return { label: "Sample", title: "From the sample notebook" };
    return null;
  }
  function compactViewChanged(list){
    const pos = list.find(function(f){ return f.sentiment === "positive"; });
    const neg = list.find(function(f){ return f.sentiment === "negative"; });
    if (!pos || !neg) return null;
    if (!String(pos.quote || "").trim() || !String(neg.quote || "").trim()) return null;
    return pos.created_at > neg.created_at ? { a: neg, b: pos } : { a: pos, b: neg };
  }
  function skeletonHTML(){
    return '<div class="skeleton sk-detail"></div>' +
      '<div class="skeleton sk-line w80" style="margin-top:18px"></div>' +
      '<div class="skeleton sk-line w60"></div>' +
      '<div class="skeleton sk-line w100" style="margin-top:22px"></div>' +
      '<div class="skeleton sk-line w80"></div>' +
      '<div class="skeleton sk-line w40"></div>';
  }
  function headerHTML(){
    if (!card) return "";
    const name = String(card.name || "Untitled");
    const image = imgSrc(card.image);
    if (image) {
      return '<div class="detail-hero">' +
          '<div class="detail-hero-img ' + typeClass(card.type) + '">' +
            '<div class="cover-fallback" aria-hidden="true"></div>' +
            '<img src="' + attr(image) + '" alt="" onerror="this.remove()">' +
          "</div>" +
        "</div>" +
        '<h2 class="detail-title">' + esc(name) + "</h2>" +
        '<p class="detail-context">' + esc(cardContext(card)) + "</p>";
    }
    return '<div class="detail-hero">' +
        '<div class="detail-typeface ' + typeClass(card.type) + '">' +
          '<span class="type-bar"></span>' +
          '<div class="detail-typeface-inner"><span class="face-title">' + esc(name) + "</span></div>" +
        "</div>" +
      "</div>" +
      '<p class="detail-context">' + esc(cardContext(card)) + "</p>";
  }
  function reactionHTML(){
    const heart = card ? Number(card.heart) || 0 : 0;
    return '<div class="detail-controls">' +
        '<button class="heart-btn" type="button" data-react="1" aria-pressed="' + (heart === 1 ? "true" : "false") + '">' +
          icons.heart + "<span>" + (heart === 1 ? "Loved" : "Love this") + "</span>" +
        "</button>" +
        '<button class="heart-btn notme" type="button" data-react="-1" aria-pressed="' + (heart === -1 ? "true" : "false") + '">' +
          icons.close + "<span>Not for me</span>" +
        "</button>" +
      "</div>" +
      '<p class="inline-error" role="alert"' + (reactionError ? "" : " hidden") + ">" + esc(reactionError) + "</p>";
  }
  function paintReaction(){
    const block = view.querySelector("[data-reaction-block]");
    if (!block) return;
    const active = document.activeElement;
    const keep = active && active.getAttribute ? active.getAttribute("data-react") : null;
    block.innerHTML = reactionHTML();
    if (keep) {
      const next = block.querySelector('[data-react="' + keep + '"]');
      if (next) { try { next.focus(); } catch (_) {} }
    }
  }
  function summaryHTML(){
    if (!card) return "";
    const n = footprints.length;
    if (!n) return '<p class="summary">No footprints yet.</p>';
    const oldest = footprints[footprints.length - 1];
    const newest = footprints[0];
    const first = card.first_at || (oldest && oldest.created_at);
    const last = card.last_at || (newest && newest.created_at);
    const bits = [];
    if (first) bits.push("First met " + monthYear(first));
    bits.push(n + " " + plural(n, "time", "times") + " since");
    if (last) {
      const seen = lastSeen(last);
      bits.push(seen === "today" || seen === "yesterday" ? "last seen " + seen : "last " + seen);
    }
    return '<p class="summary">' + esc(bits.join(" · ")) + "</p>";
  }
  function filmstripHTML(){
    if (!photos.length) return "";
    return '<div class="filmstrip">' + photos.map(function(url){
      return '<img class="strip-img" src="' + attr(url) + '" alt="Photo from your notes" loading="lazy">';
    }).join("") + "</div>";
  }
  function timelineHTML(){
    if (!footprints.length) {
      return '<p class="compact-empty">No footprints yet. Write about this again and it will gather here.</p>';
    }
    return '<h3 class="section-label" style="margin:22px 0 0">Footprints</h3>' +
      '<div class="fp-list" style="margin-top:0">' + footprints.map(function(fp){
        const source = sourceLabel(fp);
        const image = imgSrc(fp.image_url);
        const quote = String(fp.quote || "").trim();
        return '<div class="fp" data-fp-id="' + attr(fp.id) + '">' +
          '<div class="fp-top">' +
            '<span class="fp-date">' + esc(formatDayLabel(fp.created_at)) + "</span>" +
            '<span class="fp-kind">' + esc(kindLabel(fp.kind)) + "</span>" +
            (source ? '<span class="fp-kind" title="' + attr(source.title) + '">' + esc(source.label) + "</span>" : "") +
            '<button class="fp-detach" type="button" data-detach="' + attr(fp.id) + '" aria-label="Not about this footprint">Not about this</button>' +
          "</div>" +
          (quote ? '<p class="fp-quote">' + esc(quote) + "</p>" : "") +
          (image ? '<img class="fp-thumb" src="' + attr(image) + '" alt="Photo from this footprint" loading="lazy">' : "") +
        "</div>";
      }).join("") + "</div>";
  }
  function viewChangedHTML(){
    if (!viewChanged || !viewChanged.a || !viewChanged.b) return "";
    return '<section class="viewchanged">' +
      "<h3>Your view changed</h3>" +
      '<div class="vw-grid">' +
        '<div class="vw-quote"><blockquote>' + esc(viewChanged.a.quote || "") + '</blockquote><span class="vw-date">' + esc(formatDate(viewChanged.a.created_at)) + "</span></div>" +
        '<div class="vw-quote"><blockquote>' + esc(viewChanged.b.quote || "") + '</blockquote><span class="vw-date">' + esc(formatDate(viewChanged.b.created_at)) + "</span></div>" +
      "</div>" +
    "</section>";
  }
  function qlooHTML(){
    if (!qlooTags.length) return "";
    return '<section class="qloo-tags">' +
      '<div class="qloo-head"><h3>From Qloo</h3><span class="catalogue">Qloo catalogue data</span></div>' +
      tagsHTML(qlooTags) +
    "</section>";
  }
  function canPlan(){
    if (!card) return false;
    const heart = Number(card.heart) || 0;
    if (heart < 0) return false;
    if (heart === 1) return true;
    const negative = footprints.filter(function(f){ return f.sentiment === "negative"; }).length;
    return footprints.length >= 1 && negative * 2 < footprints.length;
  }
  function footerHTML(){
    return '<div class="detail-actions">' +
      '<button class="btn btn-primary" type="button" data-use-plan' + (canPlan() ? "" : " hidden") + ">Use in a plan</button>" +
      '<button class="btn" type="button" data-card-more>More</button>' +
    "</div>";
  }
  function syncPlanButton(){
    const button = view.querySelector("[data-use-plan]");
    if (button) button.hidden = !canPlan();
  }
  function hideBrokenImages(){
    Array.prototype.forEach.call(view.querySelectorAll("img"), function(img){
      function hide(){ img.hidden = true; }
      img.addEventListener("error", hide);
      if (img.complete && img.naturalWidth === 0) hide();
    });
  }
  function paint(preserve){
    if (!card) return;
    const y = preserve ? window.scrollY : 0;
    view.innerHTML = '<article class="detail">' +
      headerHTML() +
      '<div data-reaction-block>' + reactionHTML() + "</div>" +
      summaryHTML() +
      filmstripHTML() +
      timelineHTML() +
      viewChangedHTML() +
      qlooHTML() +
      footerHTML() +
    "</article>";
    hideBrokenImages();
    Array.prototype.forEach.call(view.querySelectorAll(".fp"), function(fp){
      fp.style.touchAction = "pan-y";
    });
    if (preserve) { try { window.scrollTo(0, y); } catch (_) {} }
  }

  async function load(opts){
    const quiet = !!(opts && opts.quiet);
    const seq = ++loadSeq;
    if (!quiet) view.innerHTML = skeletonHTML();
    try {
      const data = await api("/api/cards/" + encodeURIComponent(id), { signal: ac.signal });
      if (!isCurrent(token) || seq !== loadSeq) return;
      if (!data || !data.card) throw new Error("The card did not come back.");
      card = data.card;
      footprints = (Array.isArray(data.footprints) ? data.footprints : [])
        .slice()
        .sort(function(a, b){ return (Number(b.created_at) || 0) - (Number(a.created_at) || 0); });
      viewChanged = data.view_changed || compactViewChanged(footprints);
      qlooTags = (Array.isArray(data.qloo_tags) ? data.qloo_tags : (Array.isArray(card.tags) ? card.tags : [])).slice(0, 3);
      photos = [];
      const seenPhotos = new Set();
      (Array.isArray(data.photos) ? data.photos : []).forEach(function(url){
        const safe = imgSrc(url);
        if (safe && !seenPhotos.has(safe)) { seenPhotos.add(safe); photos.push(safe); }
      });
      reactionError = "";
      paint(!!quiet);
    } catch (e) {
      if (!isCurrent(token) || seq !== loadSeq || isAbort(e)) return;
      if (quiet) {
        toast("The card did not refresh.");
        return;
      }
      if (e && e.status === 404) {
        view.innerHTML = emptyBlock("This card is gone.", "It may have been removed. Your notes are still here.", '<button class="btn btn-sm" type="button" data-nav="#/cards">Back to your cards</button>');
      } else {
        view.innerHTML = errorBlock("This card did not load. Check your connection, then try again.", "card");
      }
    }
  }

  async function react(value){
    if (reactionBusy || !card) return;
    reactionBusy = true;
    reactionError = "";
    const current = Number(card.heart) || 0;
    const next = current === value ? 0 : value;
    card = Object.assign({}, card, { heart: next }); // optimistic: the pill answers at once
    paintReaction();
    try {
      const data = await api("/api/cards/" + encodeURIComponent(id), {
        method: "PATCH",
        body: { heart: next },
        signal: ac.signal,
      });
      if (!isCurrent(token)) return;
      if (data && data.error) throw new Error(data.error);
      if (data && data.card) card = Object.assign({}, card, data.card);
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      card = Object.assign({}, card, { heart: current });
      reactionError = e && e.status === 404 ? "This card is no longer here." : "That did not save. Try again.";
    } finally {
      reactionBusy = false;
      if (isCurrent(token)) {
        paintReaction();
        syncPlanButton();
      }
    }
  }

  function detachFootprint(fpId){
    const fp = footprints.find(function(x){ return String(x.id) === String(fpId); });
    if (!fp) return;
    confirmSheet({
      title: "Not about this?",
      copy: "This footprint will be removed from the card. Your note stays in your notebook.",
      confirmLabel: "Remove footprint",
      busyLabel: "Removing",
      danger: true,
      onConfirm: async function(){
        await api("/api/footprints/" + encodeURIComponent(fp.id), { method: "DELETE" });
        if (!isCurrent(token)) return;
        footprints = footprints.filter(function(x){ return String(x.id) !== String(fp.id); });
        card.footprints = footprints.length;
        card.last_at = footprints.length ? footprints[0].created_at : null;
        card.first_at = footprints.length ? footprints[footprints.length - 1].created_at : null;
        viewChanged = compactViewChanged(footprints);
        photos = footprints.map(function(x){ return imgSrc(x.image_url); }).filter(Boolean);
        paint(true);
        toast("Footprint removed.");
        load({ quiet: true });
      },
    });
  }

  function removeCard(){
    confirmSheet({
      title: "Remove this card?",
      copy: "The card and its footprints will be removed. Your notes and photos stay in your notebook.",
      confirmLabel: "Remove card",
      busyLabel: "Removing",
      danger: true,
      onConfirm: async function(){
        await api("/api/cards/" + encodeURIComponent(id), { method: "DELETE" });
        setTimeout(function(){ toast("Card removed. Your notes are still here."); }, 80);
        go("#/cards");
      },
    });
  }

  function openMore(){
    const sheet = openMenu("Card", [
      { key: "remove", label: "Remove card", sub: "Your notes and photos are kept.", danger: true },
    ]);
    Array.prototype.forEach.call(sheet.querySelectorAll("[data-menu]"), function(item){
      item.addEventListener("click", function(){
        const key = item.getAttribute("data-menu");
        closeModal();
        if (key === "remove") removeCard();
      });
    });
  }

  function useInPlan(){
    if (!card) return;
    const name = String(card.name || "");
    putPlanPrefill(typeOf(card.type) === "place" ? "An afternoon around " + name : "An afternoon that feels like " + name);
    go("#/plan");
  }

  on(view, "click", function(e){
    const heart = e.target.closest("[data-react]");
    if (heart) {
      const value = Number(heart.getAttribute("data-react"));
      if (value === 1 || value === -1) react(value);
      return;
    }
    const detach = e.target.closest("[data-detach]");
    if (detach) { detachFootprint(detach.getAttribute("data-detach")); return; }
    if (e.target.closest("[data-use-plan]")) { useInPlan(); return; }
    if (e.target.closest("[data-card-more]")) { openMore(); }
  });
  on(view, "pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) { swipeStart = null; return; }
    if (e.target.closest("button,a,img")) { swipeStart = null; return; }
    const fp = e.target.closest("[data-fp-id]");
    if (!fp) { swipeStart = null; return; }
    swipeStart = { id: fp.getAttribute("data-fp-id"), x: e.clientX, y: e.clientY };
  });
  on(view, "pointerup", function(e){
    if (!swipeStart) return;
    const dx = e.clientX - swipeStart.x;
    const dy = e.clientY - swipeStart.y;
    const fpId = swipeStart.id;
    swipeStart = null;
    if (dx < -64 && Math.abs(dx) > Math.abs(dy) * 1.4) detachFootprint(fpId);
  });
  on(view, "pointercancel", function(){ swipeStart = null; });

  bindRetries({ card: load });
  load();
}

/* ---------------------------------------------------------------------------
   Threads
   --------------------------------------------------------------------------- */
function renderThreads(){
  const token = beginView();
  setShell({ title: "Threads", tabs: true, active: "cards" });
  const ac = abortable();
  let period = "all";
  let current = [];
  let lastData = null;

  view.innerHTML =
    '<div class="cards-head">' +
      '<div class="segmented" role="group" aria-label="Cards view">' +
        '<button class="seg-btn" type="button" aria-pressed="false" data-nav="#/cards">Wall</button>' +
        '<button class="seg-btn" type="button" aria-pressed="true">Threads</button>' +
      "</div>" +
      '<p class="sub">Patterns across your cards, named with Qloo catalogue tags.</p>' +
      '<div class="mood-row period-row" role="group" aria-label="Which you">' +
        [["all","All of you"],["now","Recent you"],["then","Earlier you"]].map(function(x){return '<button class="mood" type="button" data-tperiod="'+x[0]+'" aria-pressed="'+(x[0]===period?"true":"false")+'">'+x[1]+'</button>';}).join("") +
      "</div>" +
      '<p class="period-note" data-period-note></p>' +
    "</div>" +
    '<div data-threads>' +
      '<div class="skeleton sk-card tall"></div>' +
      '<div class="skeleton sk-card"></div>' +
    "</div>";

  const threadsEl = view.querySelector("[data-threads]");
  const noteEl = view.querySelector("[data-period-note]");
  let loadSeq = 0;

  function shiftPill(shift){
    if (!shift) return "";
    const cls = shift === "New in recent notes" ? "new" : shift === "Fading from recent notes" ? "fading" : "steady";
    return '<span class="shift-pill ' + cls + '">' + esc(shift) + "</span>";
  }
  function threadNames(thread){
    const q = Array.isArray(thread.qloo_tags) ? thread.qloo_tags.map(function(x){ return x && x.name; }).filter(Boolean) : [];
    const parts = String(thread.tag || "").split(" · ").filter(Boolean);
    return (parts.length > 1 ? parts : (q.length ? q.slice(0, 1) : parts)).slice(0, 3).map(tagPretty);
  }
  /* "Sensitive, vulnerability and intimacy" (B): middle word italic clay; zh keeps names joined by · */
  function threadTitleHTML(thread){
    const n = threadNames(thread);
    if (n.length < 2) return esc(n[0] || thread.tag || "");
    if (LANG === "zh") return n.map(function(x, i){ return i === 1 ? "<em>" + esc(x) + "</em>" : esc(x); }).join(" · ");
    const low = function(x){ return /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x; };
    if (n.length === 2) return esc(n[0]) + " and <em>" + esc(low(n[1])) + "</em>";
    return esc(n[0]) + ", <em>" + esc(low(n[1])) + "</em> and " + esc(low(n[2]));
  }
  function threadHTML(thread, i){
    const cards = Array.isArray(thread.cards) ? thread.cards : [];
    const chips = cards.map(function(card){
      const count = Number(card.footprints) || 0;
      const label = card.name + (count ? ", " + count + " " + plural(count, "footprint", "footprints") : "");
      return '<button class="thread-chip type-' + attr(card.type || "other") + '" type="button" data-nav="#/cards/' + encodeURIComponent(card.id) + '" aria-label="' + attr(label) + '">' +
        '<span translate="no">' + esc(card.name) + "</span>" + (count ? '<span class="count">' + count + "</span>" : "") +
      "</button>";
    }).join("");
    return '<article class="thread">' +
      '<div class="thread-top"><span class="from-qloo">From Qloo</span>' + shiftPill(thread.shift) + "</div>" +
      '<h2 class="thread-title" translate="no">' + threadTitleHTML(thread) + "</h2>" +
      '<span class="thread-evidence-label">From your notes</span>' +
      '<div class="thread-chips">' + chips + "</div>" +
      (thread.read ? '<p class="thread-read"><span class="label">Sparkling’s read</span>' + esc(thread.read) + "</p>" : "") +
      '<button class="why-btn" type="button" data-why="' + i + '">Why this thread?</button>' +
    "</article>";
  }
  function whyHTML(t){
    const tags = Array.isArray(t.qloo_tags) ? t.qloo_tags : [];
    const cards = Array.isArray(t.cards) ? t.cards : [];
    const words = Array.isArray(t.your_words) ? t.your_words : (t.your_words ? [t.your_words] : []);
    const rc = t.receipt || {};
    const typeOf = {}; cards.forEach(function(c){ typeOf[c.name] = c.type || "other"; });
    const listedAll = [];
    tags.forEach(function(q){ (Array.isArray(q.listed_on) ? q.listed_on : []).forEach(function(n){ if (listedAll.indexOf(n) < 0) listedAll.push(n); }); });
    const top = tags.slice(0, 3), rest = tags.slice(3);
    const qlooCard = '<section class="bcard"><div class="blabel"><i></i><span>Qloo noticed</span><small>' + (listedAll.length ? "on your cards" : "for your cards together") + "</small></div>" +
      (top.length ? '<div class="seeds">' + top.map(function(q, i){ return seedHTML(q, "s" + (i + 1)); }).join("") + "</div>" : '<p class="why-line">No tags came back.</p>') +
      (rest.length ? '<div class="seeds-h">Close behind</div><div class="seeds">' + rest.map(function(q){ return seedHTML(q, "sm"); }).join("") + "</div>" : "") +
      (listedAll.length ? '<p class="why-line">Qloo lists it on <span translate="no">' + esc(listedAll.join(", ")) + "</span></p>" : '<p class="why-line">None of these sit on a single card of yours. Qloo returned them for these cards taken together.</p>') +
    "</section>";
    const wordRows = words.length ? words.map(function(w){
      return '<div class="why-q"><p translate="no">“' + esc(w.text) + '”</p><div class="m">' +
        (w.card ? '<span class="ent type-' + attr(typeOf[w.card] || "other") + '" translate="no">' + esc(w.card) + "</span>" : "") +
        "<span>" + esc(formatDate(w.at)) + "</span></div></div>";
    }).join("") : '<p class="why-line">No note quotes yet for these cards.</p>';
    const wordsCard = '<section class="bcard"><div class="blabel"><i class="clay"></i><span>In your words</span><small>' + esc(words.length + " " + plural(words.length, "note", "notes")) + "</small></div>" + wordRows + "</section>";
    const shown = cards.slice(0, 4), more = cards.slice(4);
    const feed = shown.map(function(c){
      const n = Number(c.footprints) || 0;
      return '<button type="button" class="why-f type-' + attr(c.type || "other") + '" data-close-nav="#/cards/' + encodeURIComponent(c.id) + '">' +
        '<b translate="no">' + esc(c.name) + "</b><span>" + esc(n + " " + plural(n, "note", "notes")) + "</span></button>";
    }).join("");
    const cardsCard = '<section class="bcard"><div class="blabel"><i class="butter"></i><span>Cards it grew from</span><small>' + esc(cards.length + " " + plural(cards.length, "card", "cards")) + "</small></div>" +
      '<div class="why-feed">' + feed + "</div>" +
      (more.length ? '<p class="why-line"><span>Also</span> <span translate="no">' + esc(more.map(function(c){ return c.name; }).join(", ")) + "</span></p>" : "") +
    "</section>";
    const basedOn = String((lastData && lastData.shift && lastData.shift.based_on) || "");
    const readCard = '<section class="bcard bread"><div class="blabel"><span>Sparkling’s read</span></div>' +
      (t.read ? "<p>" + esc(t.read) + "</p>" : "") +
      (t.shift && basedOn ? "<p>" + esc(t.shift) + ": comparing the tags Qloo returns for your " + esc(basedOn) + " most recent cards against the " + esc(basedOn) + " before them.</p>" : "") +
    "</section>";
    const ents = Array.isArray(rc["signal.interests.entities"]) ? rc["signal.interests.entities"] : [];
    const receipt =
      '<div class="why-receipt" translate="no">' +
        "<div>GET " + esc(rc.endpoint || "/v2/insights") + " · filter.type=" + esc(rc["filter.type"] || "urn:tag") + "</div>" +
        "<div>signal.interests.entities = " + ents.length + "</div>" +
        ents.map(function(e){ return '<div class="ind">' + esc(String(e.qloo_id || e).slice(0, 8)) + "…" + (e.name ? ' <span class="why-faint">' + esc(e.name) + "</span>" : "") + "</div>"; }).join("") +
        (Array.isArray(rc.tag_ids) && rc.tag_ids.length ? rc.tag_ids.map(function(id, i){ return '<div class="' + (i ? "ind" : "") + '">' + (i ? "" : "→ ") + esc(id) + "</div>"; }).join("") : "") +
      "</div>";
    return '<span tabindex="-1" data-autofocus class="why-focus"></span>' +
      '<h3 class="why-h1" translate="no">' + threadTitleHTML(t) + "</h3>" +
      '<p class="why-intro">What it rests on: Qloo’s data and your own notes, shown as they are. Sparkling’s own read sits apart.</p>' +
      qlooCard + wordsCard + cardsCard + readCard +
      '<details class="why-details"><summary>Receipt</summary>' + receipt + "</details>";
  }
  function openWhy(i){
    const t = current[i];
    if (!t) return;
    openSheet({ title: "Why this thread?", cls: "why-sheet", body: whyHTML(t), onMount: function(m){
      m.querySelectorAll("[data-close-nav]").forEach(function(btn){
        btn.addEventListener("click", function(){ const h = btn.getAttribute("data-close-nav"); closeModal(); location.hash = h; });
      });
    }});
  }
  function emptyHTML(reason){
    return emptyBlock(
      "Threads take a little time.",
      reason || "Threads show up once a few things keep coming back.",
      '<button class="btn btn-sm" type="button" data-nav="#/cards">Look at your cards</button>'
    );
  }
  function setNote(data){
    if (!noteEl) return;
    const sh = data && data.shift;
    if (period === "all" || !sh || !sh.based_on) { noteEl.textContent = period === "all" ? "Everything you have kept." : ""; return; }
    const names = period === "now" ? sh.now_cards : sh.then_cards;
    noteEl.textContent = (period === "now" ? "Your " + sh.based_on + " most recent cards: " : "The " + sh.based_on + " cards before your recent ones: ") + (names || []).join(", ") + ".";
  }
  async function load(){
    const seq = ++loadSeq;
    if (threadsEl) threadsEl.innerHTML = '<div class="skeleton sk-card tall"></div><div class="skeleton sk-card"></div>';
    try {
      const data = await api("/api/threads" + (period === "all" ? "" : "?period=" + period), { signal: ac.signal });
      if (!isCurrent(token) || seq !== loadSeq) return;
      lastData = data;
      setNote(data);
      const threads = Array.isArray(data && data.threads) ? data.threads : [];
      current = threads;
      if (!threads.length) {
        threadsEl.innerHTML = emptyHTML(data && data.reason);
        return;
      }
      threadsEl.innerHTML = threads.map(threadHTML).join("");
    } catch (e) {
      if (!isCurrent(token) || seq !== loadSeq || isAbort(e)) return;
      threadsEl.innerHTML = errorBlock("Your threads did not load. Check your connection, then try again.", "threads");
    }
  }
  on(view, "click", function(e){
    const pb = e.target.closest("[data-tperiod]");
    if (pb) {
      period = pb.getAttribute("data-tperiod");
      view.querySelectorAll("[data-tperiod]").forEach(function(b){ b.setAttribute("aria-pressed", b === pb ? "true" : "false"); });
      load();
      return;
    }
    const wb = e.target.closest("[data-why]");
    if (wb) openWhy(Number(wb.getAttribute("data-why")));
  });

  bindRetries({ threads: load });
  load();
}

/* ---------------------------------------------------------------------------
   Inbox
   --------------------------------------------------------------------------- */
function renderInbox(){
  const token = beginView();
  setShell({ title: "Inbox", back: state.lastMain || "#/notes", tabs: false });
  const ac = abortable();

  view.innerHTML =
    '<p class="inbox-count" data-inbox-count></p>' +
    '<div data-inbox-body><div class="skeleton sk-inbox"></div></div>';

  const countEl = view.querySelector("[data-inbox-count]");
  const bodyEl = view.querySelector("[data-inbox-body]");
  let items = [];
  let total = 0;
  let resolved = 0;
  let busy = false;

  function sentenceHTML(sentence, mention){
    const whole = String(sentence || "");
    const needle = String(mention || "");
    if (!needle) return esc(whole);
    let at = whole.indexOf(needle);
    if (at < 0) at = whole.toLowerCase().indexOf(needle.toLowerCase());
    if (at < 0) return esc(whole);
    return esc(whole.slice(0, at)) + "<mark>" + esc(whole.slice(at, at + needle.length)) + "</mark>" + esc(whole.slice(at + needle.length));
  }
  function emptyHTML(){
    return '<div class="done-wrap">' +
      '<p class="done-title">Nothing to look at.</p>' +
      '<p class="done-copy">Sparkling was sure about everything lately. Anything less certain will wait here.</p>' +
      '<button class="btn btn-sm" type="button" data-nav="#/notes">Back to your notes</button>' +
    "</div>";
  }
  function doneHTML(){
    return '<div class="done-wrap">' +
      '<p class="done-title">That’s everything.</p>' +
      '<p class="done-copy">Anything less certain will wait here when it needs you.</p>' +
      '<button class="btn btn-sm" type="button" data-nav="#/notes">Back to your notes</button>' +
    "</div>";
  }
  function itemHTML(item){
    const seen = {};
    const guesses = (Array.isArray(item.guesses) ? item.guesses : []).filter(function(g){ const k = String(g.name||'').toLowerCase()+'|'+guessMeta(g); if (seen[k]) return false; seen[k] = 1; return true; });
    const best = guesses[0] || null;
    const alternatives = guesses.slice(1, 3);
    const bestHTML = best
      ? '<div class="guess-best">' +
          '<span class="guess-name">' + esc(best.name || "Unnamed") + "</span>" +
          '<span class="guess-meta">' + esc(guessMeta(best)) + "</span>" +
        "</div>"
      : '<p class="compact-empty">No close match this time.</p>';
    const altHTML = alternatives.length
      ? '<p class="or-label">Or</p>' + alternatives.map(function(guess){
          return '<button class="alt-guess" type="button" data-inbox-pick data-qloo-id="' + attr(guess.qloo_id) + '">' +
            '<span class="alt-name">' + esc(guess.name || "Unnamed") + "</span>" +
            '<span class="alt-meta">' + esc(guessMeta(guess)) + "</span>" +
          "</button>";
        }).join("")
      : "";
    return '<div class="inbox-stack" data-left="' + items.length + '"><article class="inbox-card">' +
      '<p class="sentence">' + sentenceHTML(item.sentence, item.mention) + "</p>" +
      '<p class="didyoumean">Did you mean</p>' +
      bestHTML +
      altHTML +
      '<p class="inline-error" data-inbox-error role="alert" hidden></p>' +
      '<div class="inbox-actions">' +
        '<button class="btn btn-primary" type="button" data-inbox-yes' + (best ? "" : " disabled") + ">Yes, that</button>" +
        '<button class="btn btn-outline" type="button" data-inbox-no>Not a thing</button>' +
      "</div>" +
      (items.length > 1 ? '<div class="keep-all"><button class="text-btn" type="button" data-inbox-keepall>Keep all guesses</button></div>' : "") +
    "</article></div>";
  }
  function syncBadge(){
    state.inboxCount = items.length;
    updateInboxBadge();
  }
  function paint(){
    if (!bodyEl) return;
    if (!items.length) {
      if (countEl) countEl.textContent = "";
      bodyEl.innerHTML = resolved > 0 ? doneHTML() : emptyHTML();
      syncBadge();
      return;
    }
    if (countEl) countEl.textContent = Math.min(resolved + 1, total) + " of " + total;
    bodyEl.innerHTML = itemHTML(items[0]) + '<p class="fx-swipe-hint">' + esc(t("Swipe right to keep · left if it is not a thing")) + "</p>";
    syncBadge();
  }
  function disableCurrent(){
    const cardEl = bodyEl.querySelector(".inbox-card");
    if (!cardEl) return;
    Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function(button){ button.disabled = true; });
  }
  function showActionError(message){
    const err = bodyEl.querySelector("[data-inbox-error]");
    if (err) {
      err.textContent = message || "That did not go through. Try again.";
      err.hidden = false;
    }
    const cardEl = bodyEl.querySelector(".inbox-card");
    if (cardEl) Array.prototype.forEach.call(cardEl.querySelectorAll("button"), function(button){ button.disabled = false; });
  }

  async function act(action, qlooId){
    if (busy || !items.length) return;
    const item = items[0];
    busy = true;
    disableCurrent();
    try {
      const body = { action: action };
      if (action === "accept" && qlooId) body.qloo_id = qlooId;
      const data = await api("/api/inbox/" + encodeURIComponent(item.id), { method: "POST", body: body });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      items = items.filter(function(x){ return String(x.id) !== String(item.id); });
      resolved += 1;
      busy = false;
      paint();
      refreshMe();
      toast(action === "reject" ? "Set aside." : "Kept.", {
        actionLabel: "Undo",
        duration: 10000,
        onAction: function(){ undo(item.id); },
      });
    } catch (e) {
      if (!isCurrent(token)) return;
      busy = false;
      showActionError(e && e.message === "not found"
        ? "That item is no longer here. It may have been handled already."
        : "That did not go through. Try again.");
    }
  }

  async function keepAll(){
    if (busy || !items.length) return;
    busy = true;
    disableCurrent();
    try {
      const data = await api("/api/inbox/accept_all", { method: "POST" });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      const count = items.length;
      items = [];
      resolved += count;
      busy = false;
      paint();
      refreshMe();
      toast("All guesses kept.");
    } catch (e) {
      if (!isCurrent(token)) return;
      busy = false;
      showActionError("That did not go through. Try again.");
    }
  }

  async function undo(itemId){
    try {
      const data = await api("/api/inbox/" + encodeURIComponent(itemId), { method: "POST", body: { action: "undo" } });
      if (data && data.error) throw new Error(data.error);
      if (!isCurrent(token)) return;
      await load({ quiet: true });
      toast("Back in the pile.");
    } catch (e) {
      if (!isCurrent(token)) return;
      toast("That could not be undone.");
      load({ quiet: true });
    }
  }

  async function load(opts){
    const quiet = !!(opts && opts.quiet);
    if (!quiet) {
      if (countEl) countEl.textContent = "";
      if (bodyEl) bodyEl.innerHTML = '<div class="skeleton sk-inbox"></div>';
    }
    try {
      const data = await api("/api/inbox", { signal: ac.signal });
      if (!isCurrent(token)) return;
      items = Array.isArray(data && data.items) ? data.items : [];
      total = items.length;
      resolved = 0;
      paint();
    } catch (e) {
      if (!isCurrent(token) || isAbort(e)) return;
      if (quiet) {
        toast("The inbox did not refresh.");
        return;
      }
      if (bodyEl) {
        bodyEl.innerHTML = errorBlock("The inbox did not load. Check your connection, then try again.", "inbox");
      }
    }
  }

  on(view, "click", function(e){
    const pick = e.target.closest("[data-inbox-pick]");
    if (pick) { act("accept", pick.getAttribute("data-qloo-id")); return; }
    if (e.target.closest("[data-inbox-yes]")) {
      const best = items[0] && Array.isArray(items[0].guesses) ? items[0].guesses[0] : null;
      if (best) act("accept", best.qloo_id);
      return;
    }
    if (e.target.closest("[data-inbox-no]")) { act("reject"); return; }
    if (e.target.closest("[data-inbox-keepall]")) { keepAll(); }
  });
  bindRetries({ inbox: load });
  load();
}
